:"tool","text":"search_filings(debtor=\"ACME LOGISTICS & DISTRIBUTION, L.L.C.\", state=\"FL\")"},{"kind":"out","text":"iter 01  FL  raw result 2,700 tok  ->  5 active liens"},{"kind":"out","text":"window after append: 5,060 / 40,000  (13%)"}],"state":{"label":"agent window · iteration 1","before":{"title":"ITERATION 1","view":{"type":"window","label":"agent window · iteration 1","capacity":40000,"layers":[{"label":"system rules + tool defs","tokens":2300},{"label":"GOAL (pinned)","tokens":60},{"label":"iter 01 raw dump — FL","tokens":2700}],"highlight":["GOAL (pinned)"],"note":"One finding on the board. The goal is legible, the single result is legible, and there is nothing yet to decide about what to keep."}}}},{"title":"Iteration 5 — working perfectly, already sliding","narrative":["Four more states: TX, GA, NY, CA. Four more 2,700-token dumps appended verbatim. The window is 15,860 tokens and the answers are all still correct — <b>the run has not failed, and that is the trap</b>.","What has changed is legibility. Florida's result is now the oldest of five raw blocks, sitting in the middle third of the context, surrounded by four other blocks of near-identical filing text. The <em>fact</em> that Florida was covered is in there. It is just no longer distinguishable from everything else in there.","And notice what the agent is paying for. Each iteration re-sends every previous dump, so by iteration 5 the run has already spent 52,300 input tokens to learn five numbers that fit on one line."],"claudeSays":"Every prior tool result is still in my context, verbatim. I am re-reading four filing dumps I already summarized in order to make the fifth call.","terminal":[{"kind":"tool","text":"search_filings(..., state=\"TX\")   # iter 02"},{"kind":"tool","text":"search_filings(..., state=\"GA\")   # iter 03"},{"kind":"tool","text":"search_filings(..., state=\"NY\")   # iter 04"},{"kind":"tool","text":"search_filings(..., state=\"CA\")   # iter 05"},{"kind":"out","text":"iter 05  window 15,860 / 40,000  (40%)  ·  5 raw dumps retained  ·  run spend so far 52,300 input tok"},{"kind":"out-pass","text":"running total so far: 20 active liens across FL, TX, GA, NY, CA"}],"state":{"label":"iteration 1 → iteration 5","before":{"title":"BEFORE — iteration 1","view":{"type":"window","label":"agent window · iteration 1","capacity":40000,"layers":[{"label":"system rules + tool defs","tokens":2300},{"label":"GOAL (pinned)","tokens":60},{"label":"iter 01 raw dump — FL","tokens":2700}]}},"after":{"title":"AFTER — iteration 5","view":{"type":"window","label":"agent window · iteration 5","capacity":40000,"layers":[{"label":"system rules + tool defs","tokens":2300},{"label":"GOAL (pinned)","tokens":60},{"label":"iter 01 raw dump — FL","tokens":2700},{"label":"iter 02 raw dump — TX","tokens":2700},{"label":"iter 03 raw dump — GA","tokens":2700},{"label":"iter 04 raw dump — NY","tokens":2700},{"label":"iter 05 raw dump — CA","tokens":2700}],"highlight":["iter 01 raw dump — FL"],"note":"Florida's finding &mdash; one line &mdash; is somewhere inside 2,700 tokens of filing text, now buried under four more blocks that look exactly like it. Nothing is wrong yet. Everything that will go wrong is already set up."}}}},{"title":"Iteration 14 — the rescue that eats the record","narrative":["At iteration 14 the append-only window would hit 40,160 tokens and cross the loop's working budget. Auto-compaction (M12) does the responsible thing: it folds iterations 1-9 — 24,300 tokens of raw dumps — into a 600-token summary and drops the originals. The window falls to 16,460 and the run continues.","Read the summary it produced: <em>&quot;Surveyed several southern and eastern states; multiple active liens found; no terminated filings of note.&quot;</em> It is fluent, it is broadly true, and it does not contain the word Florida or the number five.","So at iteration 17 the agent, working from a plan that says <em>every state it operates in</em> and a history that no longer names Florida, queries Florida again. It adds those five liens a second time. The run finishes cleanly, reports <b>41</b> active liens, and the real number is 36. No exception was raised at any point."],"claudeSays":"I did not lose the goal. I lost the evidence that I had already satisfied part of it, and re-satisfying it is indistinguishable from making progress.","youDo":"Grep your own compaction summaries for the identifiers your loop keys on. Anything the summary cannot name, the loop can do twice.","terminal":[{"kind":"out","text":"iter 14  window would be 40,160 / 40,000 — budget exceeded"},{"kind":"gate","text":"⚠ auto-compaction: folding iterations 01-09 (24,300 tok) into a 600-token summary"},{"kind":"out","text":"summary: \"Surveyed several southern and eastern states; multiple active\n          liens found; no terminated filings of note.\""},{"kind":"out","text":"iter 14  window 16,460 / 40,000  (41%) — run continues"},{"kind":"tool","text":"search_filings(..., state=\"FL\")   # iter 17"},{"kind":"out-fail","text":"iter 17 duplicates iter 01 — FL counted twice"},{"kind":"out-fail","text":"final: 41 active liens reported · 36 actual · 20 calls, 448,300 input tok, $1.40"}],"state":{"label":"compaction at iteration 14","before":{"title":"BEFORE — iterations 01-09 held verbatim","view":{"type":"rows","columns":["held in window","tokens","names Florida?"],"rows":[{"cells":["iter 01 raw dump &mdash; FL, 5 active liens","2,700","yes, verbatim"]},{"cells":["iter 02-09 raw dumps &mdash; TX GA NY CA AL SC NC VA","21,600","n/a"]},{"cells":["iter 10-13 raw dumps","10,800","n/a"]},{"cells":["GOAL + rules + tools","2,360","&mdash;"]},{"cells":["<b>total</b>","<b>40,160 &mdash; over budget</b>","&mdash;"],"tone":"bad"}]}},"after":{"title":"AFTER — folded, and Florida is gone","view":{"type":"stack","views":[{"type":"rows","columns":["held in window","tokens","names Florida?"],"rows":[{"cells":["compaction summary of iter 01-09","600","<b>no</b> &mdash; &quot;several southern states&quot;"],"tone":"bad","new":true},{"cells":["iter 10-13 raw dumps","10,800","n/a"]},{"cells":["GOAL + rules + tools","2,360","&mdash;"]},{"cells":["<b>total</b>","<b>16,460 &mdash; back under budget</b>","&mdash;"],"tone":"win"}]},{"type":"note","text":"The compaction did its job: the window is bounded again and the goal is still pinned. What it could not know is that <code>FL</code> was not prose, it was <b>state</b> &mdash; the loop's record of work completed. Compressing a summary is safe; compressing a ledger is not."}]}}}},{"title":"What should have persisted","narrative":["The managed loop carries four things across iterations and nothing else: the <b>goal</b> (pinned, never compacted), a <b>done set</b> of states already covered, a <b>running total</b>, and one shaped line per finding — <code>FL: 5 active liens</code>, twenty-two tokens instead of two thousand seven hundred. The raw dump is read, reduced, and dropped in the same step.","Two consequences follow immediately. The done set makes the iteration-17 duplicate impossible — <code>if raw['state'] in self.done: return</code> is the whole guard, and it is a set membership test rather than an act of recall. And the window never exceeds 2,890 tokens at iteration 20, so no compaction ever fires and nothing is ever folded away.","Serialize that state after every iteration and you get the third property for free: a crash at iteration 18 resumes at 19 instead of restarting at 1. Across the run: <b>448,300 input tokens and a wrong answer, against 53,600 and the right one</b> — 8.4x cheaper, and the cheapness is not the reason to do it."],"claudeSays":"Each iteration I see the goal, the twelve states I have covered, the running total, and one line per finding. There is nothing in my window to get lost in.","youDo":"Give your loop an explicit state object with a <code>done</code> set and a <code>window()</code> method, and make the raw tool result a local variable that goes out of scope.","terminal":[{"kind":"tool","text":"state.record(raw)   # shape -> append finding -> update total -> drop raw"},{"kind":"out","text":"GOAL: total active lien exposure for ACME + affiliates, all states\nDONE: [AL, CA, FL, GA, NC, NY, SC, TX, VA, ...]\nFINDINGS: FL: 5 active liens | TX: 4 | GA: 3 | NY: 2 | CA: 6 | ...\nRUNNING TOTAL: 36"},{"kind":"tool","text":"search_filings(..., state=\"FL\")   # iter 17, retried"},{"kind":"out-pass","text":"FL already in done set — skipped, no call made, no double count"},{"kind":"tool","text":"save(state.checkpoint())   # after every iteration"},{"kind":"out-pass","text":"iter 20  window 2,890 / 40,000  (7%) · 36 active liens · 20 calls, 53,600 input tok, $0.22"}],"state":{"label":"append-only vs managed, at iteration 20","before":{"title":"WINDOW AT ITERATION 20","view":{"type":"bars","unit":"tokens in the window","max":56360,"items":[{"label":"append-only, no compaction","value":56360,"tone":"bad","note":"where it was heading — 20 raw dumps, 41% over the working budget"},{"label":"append-only, compacted at 14","value":32660,"tone":"bad","note":"bounded, and the Florida record was the price"},{"label":"managed state","value":2890,"tone":"win","note":"goal + done set + 20 shaped findings + running total"}]}},"after":{"title":"THE RUN, GRADED","view":{"type":"stack","views":[{"type":"rows","columns":["","append-only","managed state"],"rows":[{"cells":["window at iter 20","32,660","2,890"],"tone":"win"},{"cells":["input tokens, whole run","448,300","53,600"],"tone":"win"},{"cells":["cost, whole run","$1.40","$0.22"],"tone":"win"},{"cells":["duplicate calls","1 (FL, iter 17)","0"],"tone":"win"},{"cells":["reported lien total","41 &mdash; <b>wrong</b>","36 &mdash; correct"],"tone":"win"},{"cells":["crash at iter 18 costs you","18 iterations","nothing &mdash; resume from checkpoint"],"tone":"win"}]},{"type":"note","text":"The append-only loop was never <em>broken</em>. It answered every tool call correctly and finished without an error. It just carried its evidence in a form that a routine, well-intentioned compression could destroy &mdash; which is why the discipline is deciding what persists <b>before</b> the pressure arrives, not what to compress once it has."}]}}}}]},{"id":"ce-planning","badge":"WALKTHROUGH","color":"#1a5276","time":"~4 min","title":"Carry the plan, not the transcript","spec":"M25 · decomposition state as context","intro":"The same UCC risk report, run twice. One agent carries 18,400 tokens of everything it has said and done. The other carries 118 tokens that answer the only question that matters between steps: what is runnable now?","provenance":{"kind":"illustrative","source":"a narrated UCC risk-report agent; plan sizes, transcript sizes, token counts and lien counts are plausible inventions, not measurements"},"foot":"This walks M25's <em>Representations and Plan Mutation</em> — a DAG that carries status, absorbs a discovered sub-task, and gates scoring until every input is in.","steps":[{"title":"The task has shape, and the list erases it","narrative":["Produce a full risk report on ACME LOGISTICS &amp; DISTRIBUTION: resolve the entity, then pull liens per state and pull related parties, then fuse and score, then format. Written as a to-do list that is five bullets and looks fine.","It is not fine, because the task is a <b>DAG</b> and the list has flattened it. Two facts about this work cannot be written in a list: <code>2a_liens</code> and <code>2b_related</code> are independent and could run at the same time, and <code>3_score</code> must not start until <em>both</em> of them are done. A list can express order. It cannot express dependency, and order is not dependency.","The immediate cost is small — the two research steps run one after the other instead of together. The cost that matters arrives later, when something needs to be inserted into the middle."],"youDo":"Write your agent's task as a list, then draw the arrows. Every arrow that is not simply &quot;the next bullet&quot; is structure your list is silently discarding.","terminal":[{"kind":"prompt","text":"produce a full UCC risk report for ACME LOGISTICS & DISTRIBUTION, L.L.C."},{"kind":"tool","text":"plan = decompose(goal)"},{"kind":"out","text":"1. resolve entity\n2. pull liens per state\n3. pull related parties\n4. fuse and score\n5. format report"},{"kind":"out","text":"next_runnable() -> ['2. pull liens per state']      # one at a time, by position"}],"state":{"label":"flat list vs DAG","before":{"title":"BEFORE — a flat list","view":{"type":"rows","columns":["#","step","runs after","parallel with"],"rows":[{"cells":["1","resolve entity","&mdash;","&mdash;"]},{"cells":["2","pull liens per state","step 1, by position","nothing &mdash; unexpressible"],"tone":"bad"},{"cells":["3","pull related parties","step 2, by position","nothing &mdash; unexpressible"],"tone":"bad"},{"cells":["4","fuse and score","step 3, by position","&mdash;"],"tone":"bad"},{"cells":["5","format report","step 4, by position","&mdash;"]}]}},"after":{"title":"AFTER — the same task as a DAG","view":{"type":"stack","views":[{"type":"rows","columns":["id","deps","status","runnable now?"],"rows":[{"cells":["<code>1_resolve</code>","&mdash;","done","&mdash;"],"tone":"win"},{"cells":["<code>2a_liens</code>","<code>1_resolve</code>","pending","<b>yes</b>"],"tone":"win"},{"cells":["<code>2b_related</code>","<code>1_resolve</code>","pending","<b>yes &mdash; in parallel</b>"],"tone":"win"},{"cells":["<code>3_score</code>","<code>2a_liens</code>, <code>2b_related</code>","pending","no &mdash; gated on both"]},{"cells":["<code>4_format</code>","<code>3_score</code>","pending","no"]}]},{"type":"note","text":"<code>next_runnable()</code> is one line &mdash; <em>pending, and every dep is done</em> &mdash; and it returns <b>two</b> steps here instead of one. The parallelism was in the task all along; the list was the thing hiding it."}]}}}},{"title":"Carrying the transcript instead of the plan","narrative":["By step four the agent's window holds 18,400 tokens of history: every tool call, every raw filing excerpt, every intermediate paragraph of reasoning. It is a complete and faithful record of what happened, and it is the wrong thing to be carrying.","The reason is that a transcript is a <b>record</b>, and what the loop needs between steps is a <b>state</b>. You cannot query a transcript for &quot;what is runnable now&quot;. The agent has to re-read its own history and re-derive the answer, from scratch, every single iteration — which is both the expense and the source of the drift.","The rendered plan is 118 tokens and answers the question directly. Same agent, same task, same tools: <b>22,600 tokens in the window against 4,318</b>, and the smaller one is the one that knows what it is doing."],"claudeSays":"With the transcript I infer my next step by re-reading nineteen pages. With the plan I read five lines and a status column.","youDo":"Ask of everything your agent carries: could a function answer &quot;what is next&quot; from this? If only a language model can, you are carrying a record, not a state.","terminal":[{"kind":"tool","text":"len(tokenize(agent.carried_state))"},{"kind":"out","text":"transcript-carrying:  18,400 tok   (14 tool calls, 6 filing excerpts, 9 reasoning blocks)"},{"kind":"out","text":"plan-carrying:            118 tok   (goal line + 5 steps with deps and status)"},{"kind":"prompt","text":"what should the agent do next?"},{"kind":"out-fail","text":"from the transcript: re-derived by the model, 1 call, ~900 output tokens of re-reasoning"},{"kind":"out-pass","text":"from the plan:      next_runnable() -> ['2a_liens', '2b_related'], 0 calls"}],"state":{"label":"what the agent carries into step 4","before":{"title":"BEFORE — the whole transcript","view":{"type":"window","label":"window at step 4 · transcript-carrying","capacity":22600,"layers":[{"label":"system rules + tool defs","tokens":2300},{"label":"transcript: 14 tool calls verbatim","tokens":9100},{"label":"transcript: 6 filing excerpts","tokens":6200},{"label":"transcript: 9 reasoning blocks","tokens":3100},{"label":"this step's working data","tokens":1900}],"highlight":["transcript: 14 tool calls verbatim","transcript: 6 filing excerpts"],"note":"Everything that happened is in here. What is <em>next</em> is not &mdash; that has to be re-derived from the record on every iteration."}},"after":{"title":"AFTER — the plan, and this step's data","view":{"type":"window","label":"window at step 4 · plan-carrying","capacity":22600,"layers":[{"label":"system rules + tool defs","tokens":2300},{"label":"rendered plan (goal + 5 steps + status)","tokens":118},{"label":"this step's working data","tokens":1900}],"highlight":["rendered plan (goal + 5 steps + status)"],"note":"4,318 of 22,600 tokens &mdash; 19% of the transcript agent's window. The results of finished steps are not gone; they were shaped to their conclusions and attached to the step that produced them."}}}},{"title":"Reality diverges at step 2b","narrative":["The related-parties search returns something the plan did not anticipate: ACME operates through an affiliated entity, ACME HOLDINGS FL LLC, which carries three active liens of its own. Those liens belong in the risk score. Nobody knew the entity existed when the plan was written, because that is what the step was for.","The flat-list agent has one move available — append to the end. So the discovered work becomes step 6, after <em>format report</em>. Scoring already ran on the two branches it had. The report ships with <b>7 active liens across 3 states</b>, correctly totalled from the inputs it was given, and it is wrong: the answer is 10.","The DAG agent inserts. One call — <code>insert(&quot;2c_related_liens&quot;, deps=[&quot;2b_related&quot;], blocks=&quot;3_score&quot;)</code> — adds the step and adds it to <code>3_score</code>'s dependency set. Scoring is now not runnable, and stays not runnable until the affiliate's liens are in. The plan absorbed reality rather than being overwritten by it."],"claudeSays":"I did not re-plan. I added one node and one edge, and the gating did the rest.","youDo":"Give your plan an <code>insert(id, deps, blocks)</code> method before you need it. A plan you can only append to is a plan that will ship the wrong answer confidently.","terminal":[{"kind":"tool","text":"run(\"2b_related\")"},{"kind":"claude","text":"Found affiliated entity: ACME HOLDINGS FL LLC (common officer, shared FL address). It has liens of its own."},{"kind":"out","text":"flat list: append -> \"6. pull liens for ACME HOLDINGS FL LLC\""},{"kind":"out-fail","text":"3_score already executed at position 4 — report ships: 7 active liens, 3 states (actual: 10)"},{"kind":"tool","text":"plan.insert(\"2c_related_liens\", deps=[\"2b_related\"], blocks=\"3_score\")"},{"kind":"gate","text":"⛔ 3_score not runnable — deps 2a_liens ✓  2b_related ✓  2c_related_liens ◻"},{"kind":"out-pass","text":"2c_related_liens done -> 3_score runnable -> report: 10 active liens, 3 states, 2 entities"}],"state":{"label":"plan mutation","before":{"title":"BEFORE — five steps, scoring gated on two","view":{"type":"spec","id":"full risk report for ACME","status":"IN PROGRESS","rows":[["✓ 1_resolve","deps: —"],["✓ 2a_liens","deps: 1_resolve · 7 liens, FL TX GA"],["⏳ 2b_related","deps: 1_resolve · running"],["◻ 3_score","deps: 2a_liens, 2b_related"],["◻ 4_format","deps: 3_score"]]}},"after":{"title":"AFTER — the discovered step, wired in","view":{"type":"stack","views":[{"type":"spec","id":"full risk report for ACME","status":"MUTATED","rows":[["✓ 1_resolve","deps: —"],["✓ 2a_liens","deps: 1_resolve · 7 liens, FL TX GA"],["✓ 2b_related","deps: 1_resolve · found ACME HOLDINGS FL LLC"],["✓ 2c_related_liens","deps: 2b_related · INSERTED · 3 liens, FL"],["◻ 3_score","deps: 2a_liens, 2b_related, 2c_related_liens"],["◻ 4_format","deps: 3_score"]]},{"type":"rows","columns":["representation","where the discovery went","reported total"],"rows":[{"cells":["flat list","appended as step 6, after formatting","<b>7 liens</b> &mdash; scoring never saw it"],"tone":"bad"},{"cells":["DAG","inserted with <code>blocks=3_score</code>","<b>10 liens</b> &mdash; scoring waited"],"tone":"win","new":true}]}]}}}},{"title":"The plan is 118 tokens and it is the state","narrative":["Three properties, and none of them are about size. The plan is <b>queryable</b> — <code>next_runnable()</code> is a set-comparison, not an inference, so the agent cannot be confused about what is available. It is <b>gating</b> — a step with an unsatisfied dependency does not run, so a discovered input cannot arrive after the step that needed it. And it is <b>mutable</b> — the first decomposition is a hypothesis, and the agent revises it without abandoning it.","That it also happens to be 118 tokens instead of 18,400 is the part you notice on the invoice and the least interesting thing about it. The transcript agent was not expensive <em>and</em> wrong by coincidence: it was wrong because it had a record where it needed a state, and expensive for the same reason.","So the rule for the loop from M24 and the plan from this module are one rule. <b>Pin the structure, shape the results, drop the narration.</b> The plan is the structure."],"claudeSays":"Between steps I carry a goal, five to six ids, a dependency set and a status each. Every question I need to answer between steps is answerable from that.","youDo":"Render your plan into the window every iteration and read it as the model would. If you cannot tell what is blocked and why, neither can it.","state":{"label":"the two runs, graded","before":{"title":"CARRIED STATE, STEP 4","view":{"type":"bars","unit":"tokens carried between steps","max":18400,"items":[{"label":"whole transcript","value":18400,"tone":"bad","note":"complete record, no answer to \"what is next\""},{"label":"transcript, auto-summarized","value":900,"note":"cheap, and the dependency edges are prose again"},{"label":"rendered DAG plan","value":118,"tone":"win","note":"goal, 5 ids, deps, status — queryable and gating"}]}},"after":{"title":"THE RULE","view":{"type":"note","text":"A plan in context is not a summary of the work &mdash; it is the <b>state</b> the work runs against. Represent it structurally so dependencies and parallelism survive; render it compactly so it stays legible under pressure; mutate it when a tool result reveals something the first decomposition could not know. A rigid plan does the planned wrong thing, and no plan re-derives the approach every step &mdash; the middle path is the only one that finishes correctly."}}}}]},{"id":"ce-multi-agent","badge":"WALKTHROUGH","color":"#1a5276","time":"~4 min","title":"Three agents, one blackboard, 21,800 tokens","spec":"M26 · hub-spoke, blackboard, message passing","intro":"The same UCC risk report split across a lien-researcher, a related-party-researcher and a report-writer. Each pattern moves the same findings between windows — and the thing that decides whether the writer's window survives is not which pattern you picked, but what you allowed to travel.","provenance":{"kind":"illustrative","source":"a narrated 3-agent UCC pipeline; window sizes and token counts are plausible inventions, not measurements. The successor-course figures quoted in step 3 are real and are cited in prose, not as data"},"foot":"This walks M26's <em>Containing the Context Explosion</em> — share summaries not raw context, scope each agent's reads, enforce the boundary between windows.","steps":[{"title":"One task, three windows","narrative":["Take the risk report from M25 and give each branch of its DAG to a specialist. The lien-researcher runs <code>2a_liens</code>, the related-party-researcher runs <code>2b_related</code>, the report-writer runs <code>3_score</code> and <code>4_format</code>. The two researchers run in parallel, which is the whole reason to split.","But the split creates something the single agent did not have: <b>three separate loop contexts</b> (M24), and findings that now have to physically move between them. The orchestration is the easy half. The context flow is where these systems come apart.","The researchers are already heavy on their own. The lien-researcher pulls 12,900 tokens of FL, TX and GA filings; the related-party-researcher pulls 6,400 tokens of corporate registry records. That weight is fine — it is being read where it was retrieved. The question is how much of it is allowed to leave."],"youDo":"For each agent in your system, write down what it retrieves and what it must hand on. If those two lists are the same list, you have not designed the sharing yet.","terminal":[{"kind":"tool","text":"pipeline.spawn([\"lien_researcher\", \"related_party_researcher\", \"report_writer\"])"},{"kind":"out","text":"lien_researcher     window 15,400  ·  12,900 tok of FL/TX/GA filings retrieved\nrelated_researcher  window  8,900  ·   6,400 tok of registry records retrieved\nreport_writer       window  2,500  ·  rules + tools + report template, budget 16,000"},{"kind":"out","text":"2a_liens and 2b_related running in parallel"}],"state":{"label":"three agents, three windows","before":{"title":"WHO HOLDS WHAT","view":{"type":"rows","columns":["agent","step","retrieves","own window"],"rows":[{"cells":["lien-researcher","<code>2a_liens</code>","FL/TX/GA filings, 12,900 tok","15,400"]},{"cells":["related-party-researcher","<code>2b_related</code>","corporate registry, 6,400 tok","8,900"]},{"cells":["report-writer","<code>3_score</code>, <code>4_format</code>","nothing &mdash; it consumes","2,500 of a 16,000 budget"]}]}}}},{"title":"The blackboard fills with raw filings","narrative":["The first implementation is a blackboard: both researchers write what they found to a shared store and the writer reads it. Simple, and it works on the test fixture with two filings.","In production each researcher writes its <em>retrieved context</em> to the board — the filings themselves, not the conclusions drawn from them. So the board becomes 19,300 tokens and the writer's window becomes 21,800 against a 16,000-token budget. It overflows at 136%, the tail is truncated, and the report ships without the related-party section because that is what fell off the end.","The failure is not the pattern. A blackboard is a fine choice here. The failure is that the researchers shared their <b>context</b> when the writer needed their <b>conclusions</b>, and shared context grows with agents times steps while conclusions do not."],"claudeSays":"I received 19,300 tokens of filing text to write a four-paragraph report. I needed two numbers and an entity name from it.","terminal":[{"kind":"tool","text":"board.write(\"liens\", lien_researcher.retrieved_context)"},{"kind":"tool","text":"board.write(\"related\", related_researcher.retrieved_context)"},{"kind":"out","text":"board: 19,300 tok  (12,900 filings + 6,400 registry records)"},{"kind":"tool","text":"report_writer.assemble(board.read_all())"},{"kind":"out-fail","text":"window 21,800 / 16,000 (136%) — 5,800 tokens truncated from the tail"},{"kind":"out-fail","text":"report incomplete: related-party section missing, affiliate liens unscored"}],"state":{"label":"report-writer · blackboard, raw writes","before":{"title":"BEFORE — the writer, idle","view":{"type":"window","label":"report-writer window","capacity":16000,"layers":[{"label":"system rules + tool defs","tokens":2100},{"label":"report template","tokens":400}],"note":"2,500 of a 16,000-token budget. All of the remaining room is for what the other two agents send it."}},"after":{"title":"AFTER — the board, read whole","view":{"type":"window","label":"report-writer window · raw blackboard","capacity":16000,"layers":[{"label":"system rules + tool defs","tokens":2100},{"label":"report template","tokens":400},{"label":"board: raw FL/TX/GA filings","tokens":12900},{"label":"board: raw registry records","tokens":6400}],"highlight":["board: raw FL/TX/GA filings","board: raw registry records"],"note":"136% of budget. The writer is now paying, in full, for retrieval it did not perform and detail it will not use &mdash; and the section that gets truncated is the one written last, not the one that matters least."}}}},{"title":"The same task under three patterns","narrative":["Run the identical work through all three. <b>Hub-and-spoke</b>: a coordinator delegates and collects, so the workers stay clean and the hub holds everything — 22,500 tokens if the workers return raw, 3,290 if they return findings. <b>Blackboard</b>: 21,800 at the writer with raw writes, 2,590 with shaped summaries and scoped reads. <b>Message passing</b>: 2,590, scoped by construction, with nobody holding the whole picture.","Read down the table and the pattern is not the variable. Hub-spoke with raw returns and blackboard with raw writes are within 700 tokens of each other; hub-spoke with shaped returns and message passing are within 700 of each other. <b>What travels matters roughly ten times more than the topology it travels over.</b>","The hub-with-raw-returns row is the one worth taking seriously, because it is measured. The <a href=\"../../ultimate-context-eng/course/index.html\">successor course</a> graded ten strategies on ten questions and found sub-agent isolation the <b>most expensive of all of them</b> — a median 1,805 input tokens against naive's 1,696, so delegating cost <em>more</em> than simply sending everything. The reason is exactly this row: the sub-agent's work comes back as a roughly 1,700-token tool-result layer in the parent's window. You paid for the sub-agent's context and then paid again to receive its output."],"claudeSays":"Isolation moved the work out of my window. It did not move the work's output out of my window, and that is what I was billed for.","youDo":"Measure the size of what your sub-agent returns, not just what it was spared. Delegation that returns a transcript is a cost transfer, not a saving.","terminal":[{"kind":"tool","text":"bench.compare(patterns=[\"hub\", \"blackboard\", \"messages\"], share=[\"raw\", \"shaped\"])"},{"kind":"out","text":"hub / raw returns        collector 22,500   total across windows 46,800\nblackboard / raw writes  collector 21,800   total across windows 46,100\nhub / shaped returns     collector  3,290   total across windows 27,590\nblackboard / scoped      collector  2,590   total across windows 26,890\nmessages / scoped        collector  2,590   total across windows 26,890"},{"kind":"out-pass","text":"spread across topologies at equal sharing: 700 tok · spread across sharing at equal topology: 19,210 tok"}],"state":{"label":"collector window, five configurations","before":{"title":"WHAT REACHES THE COLLECTOR","view":{"type":"rows","columns":["pattern","what travels","collector window","whole picture?"],"rows":[{"cells":["hub-and-spoke, raw returns","both workers' full retrieved context","22,500","yes, at the hub &mdash; and it is the bottleneck"],"tone":"bad"},{"cells":["blackboard, raw writes","every filing both agents touched","21,800","yes, and unreadable"],"tone":"bad"},{"cells":["hub-and-spoke, shaped returns","two findings, 45 tok each","3,290","yes &mdash; delegation overhead 700"],"tone":"win"},{"cells":["blackboard, scoped reads of summaries","only the keys this task names","2,590","partial, by design"],"tone":"win"},{"cells":["message passing, scoped","two direct messages","2,590","no &mdash; nobody has it, and coordination is on you"]}]}},"after":{"title":"COLLECTOR WINDOW","view":{"type":"bars","unit":"tokens in the collector's window","max":22500,"items":[{"label":"hub · raw returns","value":22500,"tone":"bad","note":"the sub-agent's work returns as a layer you pay for"},{"label":"blackboard · raw writes","value":21800,"tone":"bad","note":"136% of a 16,000 budget — truncated"},{"label":"hub · shaped returns","value":3290,"tone":"win","note":"same topology, different payload"},{"label":"blackboard · scoped summaries","value":2590,"tone":"win","note":"reads only the keys its task names"},{"label":"messages · scoped","value":2590,"tone":"win","note":"minimal and private, no shared picture"}]}}}},{"title":"Ninety tokens cross the boundary","narrative":["The fix is one line per researcher. Keep the 19,300 tokens of filings and registry records where they were retrieved and where they are actually read, and write to the shared space only what the writer's task needs: <code>debtor ACME: 7 active liens across 3 states; 1 related entity (ACME HOLDINGS FL LLC, 3 liens)</code>. That is 52 tokens from one researcher and 38 from the other.","The writer's window goes from 21,800 to 2,590 — 16% of its budget instead of 136% — and the related-party section is in the report, because nothing was truncated. The researchers' windows do not change at all. Total across all three windows falls from 46,100 to 26,890.","Add the boundary and you are done: an agent reads the board by scope, not wholesale, and the scope is checked the way a tenant is checked (M23), so one agent's state cannot arrive in another's window by default. The rule for the whole module is short — <b>heavy data stays where it is used; only conclusions cross a boundary</b> — and it holds for all three topologies, which is why it is the rule and the topology is a preference."],"claudeSays":"I now receive ninety tokens and produce the same report, including the section that used to be truncated off the end.","youDo":"Put a size assertion on your shared store: <code>assert len(tokenize(payload)) &lt; 200</code> on every write. Anything that fails it is context masquerading as a finding.","terminal":[{"kind":"tool","text":"board.write(\"liens\", shape(lien_researcher.findings), scope=\"report\")"},{"kind":"out","text":"\"debtor ACME: 7 active liens across 3 states (FL 5, TX 1, GA 1); $2.4M secured\"   52 tok"},{"kind":"tool","text":"board.write(\"related\", shape(related_researcher.findings), scope=\"report\")"},{"kind":"out","text":"\"1 related entity: ACME HOLDINGS FL LLC (common officer); 3 active FL liens\"      38 tok"},{"kind":"tool","text":"report_writer.assemble(board.read(scope=\"report\"))"},{"kind":"out-pass","text":"window 2,590 / 16,000 (16%) — nothing truncated, related-party section present"},{"kind":"out-pass","text":"10 active liens scored across 2 entities · shared context 90 tok, down from 19,300"}],"state":{"label":"raw sharing → summary sharing","before":{"title":"BEFORE — 19,300 tokens crossed","view":{"type":"bars","unit":"tokens","max":46100,"items":[{"label":"lien-researcher window","value":15400,"note":"12,900 of filings, read where retrieved"},{"label":"related-researcher window","value":8900,"note":"6,400 of registry records"},{"label":"report-writer window","value":21800,"tone":"bad","note":"136% of its budget — both researchers' raw context"},{"label":"total across windows","value":46100,"tone":"bad","note":"the same filings paid for twice"}]}},"after":{"title":"AFTER — 90 tokens crossed","view":{"type":"stack","views":[{"type":"bars","unit":"tokens","max":46100,"items":[{"label":"lien-researcher window","value":15400,"note":"unchanged — the heavy data stayed put"},{"label":"related-researcher window","value":8900,"note":"unchanged"},{"label":"report-writer window","value":2590,"tone":"win","note":"16% of budget — two findings, scoped read"},{"label":"total across windows","value":26890,"tone":"win","note":"42% less, and the report is complete"}]},{"type":"note","text":"Nothing was compressed and no researcher did less work. The only change is that <b>a conclusion crossed the boundary instead of the evidence for it</b>. Pick your topology on control and awareness &mdash; but whichever you pick, share summaries, scope every read, and keep one agent's context out of another's window by construction rather than by convention."}]}}}}]},{"id":"ce-human-loop","badge":"WALKTHROUGH","color":"#1a5276","time":"~4 min","title":"Two minutes on the analyst's desk","spec":"M27 · escalation briefs, approval gates, decision injection","intro":"The same borderline debtor, handed to a human three ways: decided silently, dumped as a 12-step log, and packaged as a one-page brief. Only one of the three gives the reviewer a verdict they can actually stand behind.","provenance":{"kind":"illustrative","source":"a narrated escalation on one borderline UCC debtor; token counts, confidence scores, and review times are plausible inventions, not measurements"},"foot":"The discipline here is M27's <em>escalation brief</em> — decision, recommendation with confidence, why, scoped evidence with provenance, options — and the return leg that injects the human's call back into agent state.","steps":[{"title":"Confidence 0.55, and nobody was asked","narrative":["The agent scores <code>ACME LOGISTICS &amp; DISTRIBUTION, L.L.C.</code> It finds two active liens, one termination that was filed but not yet reflected, and a name that nearly matches a second entity. The signals conflict, and the score comes back at <b>0.55 confidence</b> — the agent's own way of saying it is barely more sure than a coin.","It writes <code>risk: HIGH</code> anyway and returns. No flag, no pause, no reviewer. A credit committee reads HIGH four days later and declines a $2M facility on it. The first human to see the reasoning is the one writing the complaint response."],"claudeSays":"I recorded a confidence of 0.55 and then acted as if it were 0.95. Nothing in the loop treated that number as a trigger.","youDo":"Find the confidence score in your own agent's output and check what, if anything, branches on it. In most pipelines the answer is nothing.","terminal":[{"kind":"prompt","text":"score lien risk for ACME LOGISTICS & DISTRIBUTION, L.L.C."},{"kind":"tool","text":"score_filing(debtor=\"ACME LOGISTICS & DISTRIBUTION, L.L.C.\")"},{"kind":"out","text":"12 steps · 4 tool calls · 18,400 tokens of run state"},{"kind":"claude","text":"{\"risk\": \"HIGH\", \"confidence\": 0.55, \"escalated\": false}"},{"kind":"out-fail","text":"decision applied · reviewed_by = null · no audit entry"}],"state":{"label":"the silent unilateral agent","before":{"title":"WHAT WAS WRITTEN TO THE DECISION STORE","view":{"type":"json","data":{"debtor":"ACME LOGISTICS & DISTRIBUTION, L.L.C.","risk":"HIGH","confidence":0.55,"escalated":false,"reviewed_by":null,"rationale":null,"evidence":[],"audit_entry":null},"highlight":["confidence","escalated","reviewed_by","audit_entry"]}},"after":{"title":"WHAT THE SIGNALS ACTUALLY SAID","view":{"type":"rows","columns":["signal","reading","pulls toward"],"rows":[{"cells":["2 active liens","<code>2024-FL-0012345</code>, <code>2024-FL-0019988</code>","HIGH"]},{"cells":["termination filed, not yet posted","on <code>2024-FL-0019988</code>","MEDIUM"],"tone":"bad"},{"cells":["possible related entity","<code>2022-FL-0044120</code>, 0.81 name match","unknown"],"tone":"bad"},{"cells":["agent confidence","0.55","ask a person"],"tone":"bad"}]}}}},{"title":"The fix that makes it worse — send everything","narrative":["So you add an escalation. When confidence drops below 0.70, stop and hand it to an analyst. The implementation is the obvious one: attach the agent's context so nothing is hidden. That is 18,400 tokens — twelve reasoning steps, four raw tool results, thirty filing records, the retrieval scores.","The analyst opens it, scrolls for six minutes, and never finds the pending termination: it is one line inside the fourth tool result. Faced with a wall and a queue, they do what everyone does with a wall and a queue. They approve it.","A rubber stamp is not a review. Worse, it now <em>looks</em> like one in the audit trail — a human name against a decision no human understood."],"claudeSays":"I gave the analyst complete information and no decision. Completeness is not the same as sufficiency.","terminal":[{"kind":"tool","text":"escalate(state.full_log)   # 12 steps, 4 tool results, verbatim"},{"kind":"out","text":"18,400 tokens sent to review queue · 41 screens"},{"kind":"gate","text":"⏸ APPROVAL REQUIRED — analyst review pending"},{"kind":"out-fail","text":"approved after 6m 12s · rationale: \"looks fine\" · pending termination never surfaced"}],"state":{"label":"data-dump escalation","before":{"title":"WHAT LANDED IN THE REVIEW QUEUE","view":{"type":"bars","unit":"tokens","max":18400,"items":[{"label":"raw tool results (4)","value":9600,"tone":"bad","note":"the pending termination is one line in here"},{"label":"reasoning steps (12)","value":5200,"tone":"bad","note":"the agent's thinking, not the analyst's decision"},{"label":"retrieval scores + chunks","value":3200,"tone":"bad","note":"diagnostics, useful to you, useless to them"},{"label":"the actual question","value":400,"note":"0.5% of what was sent"}]}},"after":{"title":"WHAT THE ANALYST PRODUCED","view":{"type":"json","data":{"decision":"APPROVE","time_to_decide":"6m 12s","rationale":"looks fine","saw_pending_termination":false,"saw_related_entity_match":false,"audit_value":"a human name on a decision nobody read"},"highlight":["saw_pending_termination","saw_related_entity_match","audit_value"]}}}},{"title":"The brief — five fields, 340 tokens","narrative":["Replace the log with a brief. Five fields, in this order: the <b>decision</b> being asked for, the <b>recommendation and its confidence</b>, the <b>why</b> in two lines, the <b>evidence</b> — three filings, each with its ID so the analyst can open it — and the <b>options</b> they may choose between.","It is 340 tokens. Everything the agent knows is still on disk; what changed is that the analyst is handed the decision instead of the derivation. The pending termination is now the second line of the brief rather than line 900 of a tool result.","The analyst reads it, opens filing <code>0019988</code> to confirm the termination is real, and calls MEDIUM in forty seconds. That is a review you can defend."],"youDo":"Write <code>escalation_brief(state)</code> as a function that returns exactly those five fields and nothing else. If it can reach a field, that is not a reason to include it.","terminal":[{"kind":"tool","text":"escalate(escalation_brief(state))   # decision, rec+confidence, why, evidence, options"},{"kind":"out","text":"340 tokens sent to review queue · 1 screen"},{"kind":"gate","text":"⏸ APPROVAL REQUIRED — confirm MEDIUM / override HIGH / request more evidence"},{"kind":"out-pass","text":"analyst j.okafor decided in 41s: MEDIUM — \"termination on 0019988 verified with the county; 0044120 is a different entity, different EIN\""}],"state":{"label":"log → brief","before":{"title":"BEFORE — 18,400 tokens of log","view":{"type":"note","text":"Twelve reasoning steps, four verbatim tool results, thirty filing records and the retrieval scores. Correct, complete, and unreviewable in the ninety seconds an analyst has per item."}},"after":{"title":"AFTER — the escalation brief","view":{"type":"stack","views":[{"type":"spec","id":"ESC-4471 · ACME LOGISTICS & DISTRIBUTION, L.L.C.","status":"AWAITING DECISION","rows":[["decision","confirm the risk grade before it reaches the credit committee"],["recommendation","MEDIUM — confidence 0.55"],["why","2 active liens, but a termination is filed against one of them and a possible related entity is unresolved"],["evidence 1","2024-FL-0012345 · FIRST CAPITAL EQUIPMENT FINANCE, INC. · active · filed 2019-06-11"],["evidence 2","2024-FL-0019988 · REDLINE FREIGHT CAPITAL LLC · termination filed 2026-08-04, not yet posted"],["evidence 3","2022-FL-0044120 · HARBOR POINT ASSET FUNDING, INC. · 0.81 name match, entity link unconfirmed"],["options","confirm MEDIUM · override HIGH · request more evidence"]]},{"type":"rows","columns":["handoff","tokens to the human","time to decide","decision quality"],"rows":[{"cells":["silent — no escalation","0","&mdash;","no review at all"],"tone":"bad"},{"cells":["full run log","18,400","6m 12s","rubber stamp, both flags missed"],"tone":"bad"},{"cells":["scoped brief","340","41s","MEDIUM, both flags checked"],"tone":"win","new":true}]}]}}}},{"title":"The return leg — inject the decision, or it never happened","narrative":["A handoff has two directions and most implementations build one. The analyst's call comes back as a chat message, someone pastes the grade into a ticket, and the agent — still holding its own 0.55 reasoning — resumes, re-derives HIGH on the next step, and quietly contradicts the human who was just asked.","Close it properly. The decision re-enters agent state in the <b>operator tier</b>: authoritative, above the agent's own inference, carrying the analyst's rationale as new knowledge the agent did not have. <code>0044120 is a different entity</code> is now a fact in the run, not an open question.","Then log it. Who decided, what they saw, what they chose, and why — keyed to the brief they were shown. That last part matters: an audit entry that records a decision but not the evidence in front of the decider proves nothing later."],"claudeSays":"The grade is now MEDIUM because an authorized human set it, not because I inferred it. My 0.55 is still in the record as the reason I asked.","youDo":"After your approval step, assert that the agent's next action reads the human's value and not its own — a one-line check that catches the one-way handoff before production does.","terminal":[{"kind":"tool","text":"state.apply_human_decision(brief_id=\"ESC-4471\", decision=\"MEDIUM\", tier=\"operator\")"},{"kind":"tool","text":"audit.write(brief_id=\"ESC-4471\", actor=\"j.okafor\", shown=brief.sha256, chose=\"MEDIUM\")"},{"kind":"out-pass","text":"agent resumed · risk=MEDIUM (operator tier) · related-entity question closed by human rationale"},{"kind":"out-pass","text":"audit entry ESC-4471 written · brief hash recorded · reviewer, evidence and rationale all reconstructable"}],"state":{"label":"agent state · before and after the human","before":{"title":"BEFORE — the agent's own inference","view":{"type":"json","data":{"risk":"HIGH","source":"agent inference","confidence":0.55,"open_questions":["is 2022-FL-0044120 the same entity?","has the 0019988 termination posted?"],"authority_tier":"agent","audit_entry":null},"highlight":["source","authority_tier","audit_entry"]}},"after":{"title":"AFTER — the human's decision, injected","view":{"type":"stack","views":[{"type":"json","data":{"risk":"MEDIUM","source":"human decision ESC-4471","confidence":1.0,"open_questions":[],"authority_tier":"operator","reviewer":"j.okafor","rationale":"termination on 0019988 verified with the county; 0044120 is a different entity, different EIN","agent_prior":{"risk":"HIGH","confidence":0.55},"audit_entry":"ESC-4471"},"highlight":["risk","source","authority_tier","rationale","audit_entry"]},{"type":"note","text":"Three things had to be true for this to be a real approval: the trigger fired on a number the agent already knew, the human was handed a decision rather than a derivation, and their answer came back as authoritative state instead of a chat message. Drop any one and you have a gate that only looks like one."}]}}}}]},{"id":"ce-observability","badge":"WALKTHROUGH","color":"#2c3e50","time":"~4 min","title":"The window is gone by the time you ask","spec":"M28 · per-layer logging, replay debugging, alarms","intro":"Accuracy slid seven points and the bill rose. With only answers logged, the best anyone can offer is \"try a bigger model\". With per-layer accounting, the same investigation takes one query and names the commit.","provenance":{"kind":"illustrative","source":"a narrated regression in a UCC risk pipeline; token counts, cache-hit rates, costs, and accuracy figures are plausible inventions, not measurements"},"foot":"This is M28's black box: log the <em>shape</em> of every context — per-layer tokens, cache-hit, cost, latency, version, guardrail flags — so a wrong answer becomes a replayable window instead of an anecdote.","steps":[{"title":"\"The model must have changed\"","narrative":["Nightly eval accuracy on the UCC risk pipeline was 94% for two months. Last Tuesday it started coming back at 87%, and the invoice for the same request volume went up. Support has three complaints about liens the system missed.","You open the logs. There is one row per request: the request id, the question, the answer, and whether a human later marked it wrong. Nothing about what the model was shown. Every question worth asking — was the filing retrieved? where did it sit? did the cache hold? — is unanswerable from what was stored.","So the meeting produces the only hypothesis the data supports, which is not a hypothesis at all: <em>the model must have changed, let's try a bigger one</em>. That costs more and, if the cause is in your assembler, changes nothing."],"youDo":"Open your own request log and try to answer one question: for a specific bad answer, how many tokens were in the retrieval layer? If you cannot, you have an accidental black box.","terminal":[{"kind":"prompt","text":"why did ACME's disqualifying lien get missed on 2026-08-18?"},{"kind":"tool","text":"logs.get(request_id=\"req_8f21c4\")"},{"kind":"out","text":"{\"request_id\": \"req_8f21c4\", \"question\": \"...\", \"answer\": \"risk: LOW\",\n \"correct\": false}"},{"kind":"out-fail","text":"no context field · no token breakdown · no cache stats · the window is gone"}],"state":{"label":"what the log store holds","before":{"title":"WHAT WAS LOGGED","view":{"type":"rows","columns":["question you need answered","answerable from the log?"],"rows":[{"cells":["what did the model say?","yes"],"tone":"win"},{"cells":["was the disqualifying filing retrieved at all?","no"],"tone":"bad"},{"cells":["where in the window did it sit?","no"],"tone":"bad"},{"cells":["did a guardrail rewrite the block?","no"],"tone":"bad"},{"cells":["was the prefix served from cache?","no"],"tone":"bad"},{"cells":["which prompt version produced this?","no"],"tone":"bad"}]}}}},{"title":"Log the shape, not just the answer","narrative":["The fix is one wrapper and it is boring on purpose. Around every model call, record the <b>shape</b> of the context: tokens per layer, the cache-read count the API already returns, cost, latency, model and prompt version, guardrail flags, tenant, request id — and a SHA-256 of the assembled context rather than the context itself, so you can prove two calls saw the same thing without storing a debtor's address in your log store.","None of this is inference. Every field is a number the assembler or the API response already has; you are simply refusing to throw it away.","The layer split is the load-bearing part. \"11,900 input tokens\" tells you nothing. <code>system 5,200 · tools 1,900 · retrieval 3,100 · conversation 1,640 · question 60</code> tells you where the next regression will come from."],"claudeSays":"Nothing about my call changed. The wrapper reads <code>usage</code> off the same response you were already discarding.","youDo":"Add <code>@observe</code> to your call site and log the per-layer dict your assembler already built. If your assembler concatenates strings and cannot name its layers, that is the first bug.","terminal":[{"kind":"tool","text":"@observe\ndef score_filing(request, version=\"v37\"): ..."},{"kind":"tool","text":"logs.get(request_id=\"req_8f21c4\")"},{"kind":"out-pass","text":"context_sha256 recorded · 5 layers accounted · cache stats captured · version stamped"}],"state":{"label":"the per-call payload","before":{"title":"AFTER — one log record","view":{"type":"json","data":{"request_id":"req_8f21c4","prompt_version":"v37","model":"claude-sonnet-4-5","tenant":"acct_4471","layers":{"system":5200,"tools":1900,"retrieval":9400,"conversation":1640,"question":60},"input_total":18200,"cache_read_input_tokens":7100,"output_tokens":260,"cost_usd":0.0393,"latency_ms":4180,"guardrail_flags":[],"retrieval_k":12,"context_sha256":"9a41c0e2…","answer_correct":false},"highlight":["layers","cache_read_input_tokens","retrieval_k","prompt_version"]}}}},{"title":"One query separates the two weeks","narrative":["Now aggregate by layer across the good week and the bad one. Four of the five layers are flat to the token. The retrieval layer went from 3,100 to 9,400 — a retrieval <code>top_k</code> bumped from 5 to 12 in a config change on the Monday, which nobody connected to a Tuesday accuracy report.","Both symptoms fall out of that one number. Cost per request goes from $0.0204 to $0.0393 because 6,300 more uncached tokens are billed at full input price on every call — at 12,000 requests a week, $245 becomes $472.","And read the cache-hit line carefully, because it is the trap in this dataset. It fell from 60% to 39% and <em>the cache never broke</em>: the cached prefix is still exactly 7,100 tokens on every call. The rate dropped because the denominator grew. A metric moving is not yet a cause — which is precisely why you log the layers underneath it."],"youDo":"Group your own logs by prompt version and diff the per-layer medians. A regression that is invisible in the total is usually obvious in one layer.","terminal":[{"kind":"prompt","text":"compare per-layer medians, week of 2026-08-10 vs week of 2026-08-17"},{"kind":"tool","text":"dashboard.layers(group_by=\"week\", agg=\"median\")"},{"kind":"out","text":"layer         2026-08-10   2026-08-17    delta\nsystem             5,200        5,200        0\ntools              1,900        1,900        0\nretrieval          3,100        9,400   +6,300\nconversation       1,640        1,640        0\nquestion              60           60        0"},{"kind":"tool","text":"git log --since=2026-08-16 -- config/retrieval.yaml"},{"kind":"out-fail","text":"a41d0c9  \"improve recall on thin debtors\"  -  top_k: 5  →  top_k: 12"}],"state":{"label":"good week → bad week","before":{"title":"BEFORE — week of 2026-08-10","view":{"type":"receipt","mode":"top_k = 5","question":"score lien risk for ACME LOGISTICS & DISTRIBUTION, L.L.C.","layers":[{"label":"system rules (cached)","tokens":5200},{"label":"tool defs (cached)","tokens":1900},{"label":"retrieval — 5 filings","tokens":3100},{"label":"conversation","tokens":1640},{"label":"question","tokens":60}],"inputTotal":11900,"output":260,"cost":"$0.0204","cacheRead":"60%","verdict":"verified","verdictNote":"94% on the nightly eval set, $245/week at 12,000 requests"}},"after":{"title":"AFTER — week of 2026-08-17","view":{"type":"stack","views":[{"type":"receipt","mode":"top_k = 12","question":"score lien risk for ACME LOGISTICS & DISTRIBUTION, L.L.C.","layers":[{"label":"system rules (cached)","tokens":5200},{"label":"tool defs (cached)","tokens":1900},{"label":"retrieval — 12 filings","tokens":9400},{"label":"conversation","tokens":1640},{"label":"question","tokens":60}],"inputTotal":18200,"output":260,"cost":"$0.0393","cacheRead":"39%","verdict":"failed","verdictNote":"87% on the same eval set, $472/week — one config line, both symptoms","highlight":["retrieval — 12 filings"]},{"type":"rows","columns":["metric","08-10","08-17","what it means"],"rows":[{"cells":["retrieval layer","3,100","9,400","the cause — <code>top_k</code> 5 → 12"],"tone":"bad"},{"cells":["cost / request","$0.0204","$0.0393","+93%, all of it uncached input"],"tone":"bad"},{"cells":["cache-hit rate","60%","39%","the prefix is still 7,100 tokens — only the denominator moved"]},{"cells":["eval accuracy","94%","87%","not explained by cost; see the next step"],"tone":"bad"}]}]}}}},{"title":"Replay the window, then set the alarm","narrative":["Cost is explained; accuracy is not. Seven more filings should help recall, not hurt it. So replay the exact window from <code>req_8f21c4</code> — the log has the layer sizes, the retrieved filing ids, and their order.","There it is. The assembler sorts the retrieval block chronologically for readability. With five filings the disqualifying one, <code>2024-FL-0019988</code>, sat at position 2. With twelve it sits at position 9 of 12 — the middle, the worst real estate in the window. It was retrieved every single time and read none of them. That is a positioning bug wearing a retrieval bug's clothes, and no amount of model-swapping would have touched it.","The fix is a rerank back to five, and the ordering rule moved from chronological to critical-facts-at-the-edges. But the durable output of this investigation is not the fix — it is the three alarms, because a metric you log and never watch is a metric you will read about on an invoice."],"claudeSays":"The filing was in the window in both runs. In the second it was surrounded by eleven others in the position I attend to least.","youDo":"Take one wrong answer from last month, reconstruct its window from your logs, and find the ranked position of the fact it should have used. Do this before you change a single prompt.","terminal":[{"kind":"tool","text":"replay(request_id=\"req_8f21c4\").retrieval_order()"},{"kind":"out","text":" 1  2019-06-11  2024-FL-0012345   active\n 2  2020-03-02  2021-FL-0007710   terminated\n …\n 9  2021-02-03  2024-FL-0019988   ACTIVE — disqualifying\n …\n12  2024-11-19  2024-FL-0051002   terminated"},{"kind":"out-fail","text":"the disqualifying filing was present, at position 9 of 12 — lost in the middle"},{"kind":"tool","text":"alerts.add(\"layer.retrieval.median > 4000\", \"cache_read_rate < 0.50\", \"eval.accuracy drop > 2pp\")"},{"kind":"out-pass","text":"3 alarms armed · the same regression now pages in under an hour, not in nine days"}],"state":{"label":"replay · position of the disqualifying filing","before":{"title":"BEFORE — 5 filings, chronological","view":{"type":"window","label":"retrieval block · top_k = 5","capacity":12,"layers":[{"label":"1 · 2024-FL-0012345","tokens":1},{"label":"2 · 2024-FL-0019988 — disqualifying","tokens":1},{"label":"3 · 2021-FL-0007710","tokens":1},{"label":"4 · 2022-FL-0044120","tokens":1},{"label":"5 · 2023-FL-0031884","tokens":1}],"highlight":["2 · 2024-FL-0019988 — disqualifying"],"note":"near the top of the block, where the model reliably reads it"}},"after":{"title":"AFTER — 12 filings, same order rule","view":{"type":"stack","views":[{"type":"window","label":"retrieval block · top_k = 12","capacity":12,"layers":[{"label":"1-8 · older filings","tokens":8},{"label":"9 · 2024-FL-0019988 — disqualifying","tokens":1},{"label":"10-12 · newer filings","tokens":3}],"highlight":["9 · 2024-FL-0019988 — disqualifying"],"note":"retrieved, present, and buried in the middle — recall went up and accuracy went down"},{"type":"note","text":"\"The model is wrong\" is not a bug report. \"The retrieval layer tripled on Tuesday, the disqualifying filing moved from position 2 to position 9, and cost per request rose 93%\" is one — and every clause of it came from fields the API had already handed you."}]}}}}]},{"id":"ce-ab-testing","badge":"WALKTHROUGH","color":"#2c3e50","time":"~5 min","title":"Ten filings said ship it","spec":"M29 · eval sets, variance, significance, and the cheap wrong answer","intro":"A reranker that looked like a twenty-point win on ten filings, a proper trial that put it inside the noise, and a third strategy that halves the bill by being confidently wrong about exactly the filings the decision turns on.","provenance":{"kind":"illustrative","source":"a narrated A/B evaluation of three UCC retrieval strategies; eval-set sizes, accuracies, p-values, and costs are plausible inventions, not measurements"},"foot":"The method is M29's clinical trial: one representative labeled eval set, both arms over the same set, several samples per item, and a significance test before anyone says the word \"win\".","steps":[{"title":"The demo that decides it","narrative":["Someone adds a reranker to the UCC retrieval step and tries it on ten filings from the backlog. Strategy A, the current hybrid retrieval, gets eight right. Strategy B, hybrid plus rerank, gets ten. Screenshots go in the channel. Twenty points is not a close call.","Three things are wrong with that sentence and none of them are visible in the screenshots. The ten filings were the ten someone had open, not ten drawn from the real distribution. Each strategy was run <b>once</b> per filing, so every number carries a full dose of output variance. And the person who ran it wanted the reranker to work.","A single example proves nothing — that is the anecdote trap, and it is the default way context changes ship."],"youDo":"Ask of any \"it looks better\" claim: how many items, drawn how, run how many times each? Three questions, and most demos fail all three.","terminal":[{"kind":"prompt","text":"try the reranker on the filings I've got open"},{"kind":"tool","text":"for f in backlog[:10]: score(f, strategy=\"A\"); score(f, strategy=\"B\")"},{"kind":"out","text":"A  hybrid          8 / 10 correct\nB  hybrid+rerank  10 / 10 correct"},{"kind":"out-fail","text":"n=10, hand-picked, 1 run each, no labels held out — this is an anecdote with a percentage sign"}],"state":{"label":"what the demo actually measured","before":{"title":"THE CLAIM","view":{"type":"rows","columns":["strategy","score","reads as"],"rows":[{"cells":["A — hybrid retrieval","8 / 10","the incumbent"]},{"cells":["B — hybrid + rerank","10 / 10","+20 points, obviously ship"],"tone":"win"}]}},"after":{"title":"THE SAME TEN FILINGS, B RUN FIVE MORE TIMES","view":{"type":"stack","views":[{"type":"rows","columns":["run","B score"],"rows":[{"cells":["run 1 (the demo)","10 / 10"],"tone":"win"},{"cells":["run 2","9 / 10"]},{"cells":["run 3","8 / 10"],"tone":"bad"},{"cells":["run 4","10 / 10"]},{"cells":["run 5","9 / 10"]},{"cells":["run 6","8 / 10"],"tone":"bad"}]},{"type":"note","text":"B's own spread on the demo set is 8 to 10 — the entire \"twenty-point win\" fits inside the variance of one arm. Nothing has been learned yet except that the model is not deterministic."}]}}}},{"title":"Build the yardstick once","narrative":["Before comparing anything, build the eval set — and build it to look like production rather than to look easy. Two hundred filings sampled from real traffic: 142 straightforward debtors, 34 borderline cases with pending terminations or related-entity matches, and 24 that carry a disqualifying lien and must come back HIGH.","Each one gets a graded outcome — a label an analyst signed, not a model's opinion of itself. And each is run <b>three times per arm</b>, because a single sample per item measures the model's mood as much as the strategy. That is 600 runs per arm, and an item scores by majority.","This is infrastructure, not a one-off. The reranker is the first question it answers; every prompt edit, retrieval change and compression scheme for the next year is measured against the same yardstick — and in M30 the same set becomes the gate that blocks a merge."],"youDo":"Sample your eval set from real logs, not from memory. Then check the hard-case share: if your borderline and must-fail items are under 20% of the set, you have built a set that cannot fail.","terminal":[{"kind":"tool","text":"eval_set = build_eval_set(n=200, source=\"prod_logs_90d\", stratify=\"outcome\")"},{"kind":"out","text":"200 filings · 142 routine · 34 borderline · 24 disqualifying-lien (must return HIGH)\nlabels: analyst-signed · held out from every prompt-tuning run"},{"kind":"tool","text":"run_strategy(\"A\", eval_set, samples=3)   # 600 runs"},{"kind":"tool","text":"run_strategy(\"B\", eval_set, samples=3)   # 600 runs, same items, same order"},{"kind":"out-pass","text":"1,200 runs recorded with per-item scores, cost and latency"}],"state":{"label":"the eval set","before":{"title":"COMPOSITION — 200 filings","view":{"type":"rows","columns":["stratum","n","why it is in the set"],"rows":[{"cells":["routine debtors","142","the bulk of traffic; catches broad regressions"]},{"cells":["borderline","34","pending terminations, related-entity matches — where confidence is low"]},{"cells":["disqualifying lien","24","must return HIGH; a miss here is the expensive failure"],"tone":"bad"},{"cells":["samples per item","3","so variance is measured instead of absorbed"]}]}}}},{"title":"The verdict: +1.2 points, p = 0.31","narrative":["Over the full set, A scores 549 of 600 runs and B scores 556 — 91.5% against 92.7%. The delta is <b>+1.2 points</b>, with a 95% confidence interval of −1.9 to +4.3 and a p-value of 0.31. The interval contains zero. B may be better; this trial cannot say so.","Report medians, not the best run. B's per-item accuracy across its three samples ranges wider than the gap between the arms, which is the whole reason the demo looked decisive: it caught B's good draw and A's bad one on the same ten items.","Then price it. The rerank pass adds $0.0043 per request and 310 ms at p95 — about $52 a week at 12,000 requests. You are being asked to pay a certain cost for an uncertain gain. <b>No ship</b>, and it is not a rejection of reranking: it is a note that this eval set cannot resolve a difference this small, and that a bigger set or a harder one is the next experiment, not the release."],"claudeSays":"The two arms disagree on 31 of 200 items and split roughly evenly on which one is right. That is what a null result looks like from the inside.","youDo":"Run <code>compare(A, B)</code> and print the confidence interval, not just the means. If the interval crosses zero, the correct output is another experiment, not a deploy.","terminal":[{"kind":"tool","text":"compare(\"A\", \"B\", eval_set, test=\"paired bootstrap\", n_boot=10000)"},{"kind":"out","text":"A  hybrid          549 / 600   91.5%   $0.0204/req   p95 2.6s\nB  hybrid+rerank   556 / 600   92.7%   $0.0247/req   p95 2.9s\n\ndelta  +1.2pp   95% CI [-1.9, +4.3]   p = 0.31"},{"kind":"gate","text":"⛔ NO SHIP — difference not distinguishable from noise; cost delta is certain"}],"state":{"label":"ten filings → two hundred","before":{"title":"BEFORE — the demo set","view":{"type":"bars","unit":"% correct","max":100,"items":[{"label":"A — 10 filings, 1 run","value":80,"note":"8 / 10"},{"label":"B — 10 filings, 1 run","value":100,"tone":"win","note":"10 / 10 — the screenshot"}]}},"after":{"title":"AFTER — 200 filings, 3 samples each","view":{"type":"stack","views":[{"type":"bars","unit":"% correct","max":100,"items":[{"label":"A — 600 runs","value":91.5,"note":"549 / 600"},{"label":"B — 600 runs","value":92.7,"note":"556 / 600 — +1.2pp, CI [-1.9, +4.3]"}]},{"type":"rows","columns":["what you are buying","certain?","value"],"rows":[{"cells":["+1.2pp accuracy","no — p = 0.31, CI crosses zero","unknown"],"tone":"bad"},{"cells":["+$0.0043 per request","yes","&minus;$52 / week at 12,000 requests"],"tone":"bad"},{"cells":["+310 ms at p95","yes","a slower answer"],"tone":"bad"}]}]}}}},{"title":"Strategy C halves the bill and loses the liens","narrative":["A third arm arrives with a better story than either: compress the retrieved filings and the conversation history before the call. The retrieved block goes from 3,100 tokens to 620, median input from 11,900 to 8,080, and cost per request from $0.0204 to $0.0090 — <b>56% cheaper</b>, faster, and the answers read fluently. On a dashboard of cost and latency it wins outright.","Grade it against the labels and it collapses. C scores 446 of 600 overall, and on the 24 filings that carry a disqualifying lien it manages <b>18 correct runs out of 72</b> against A's 69. The compressor generalizes filing numbers into phrases — <em>&quot;an equipment lender&quot;</em> — so the answers that must name a specific active lien cannot.","This is not a hypothetical failure mode; it is a measured one. The <a href=\"../../ultimate-context-eng/course/index.html\">successor course</a> ran ten strategies over the same graded questions and its compressed arm answered an aggregation question in <b>208 input tokens</b> against a naive arm's <b>1,700</b> — then the grader marked it FAIL for dropping two required facts and recorded the savings as void. Cheapness is not correctness, and the only way to tell them apart is a labeled set and a grader that does not care how elegant the output looks."],"claudeSays":"On the routine filings my compressed answers are fine. The 24 that decide whether a facility gets written are the ones the compressor flattened.","youDo":"Score every arm on your hard stratum separately, and let a strategy that wins overall still fail on the cases the decision turns on.","terminal":[{"kind":"tool","text":"run_strategy(\"C\", eval_set, samples=3)   # compress retrieved block 3,100 → 620 tokens"},{"kind":"out","text":"C  compressed   median input 8,080 tok   $0.0090/req   p95 2.1s   (-56% cost)"},{"kind":"tool","text":"score(\"C\", eval_set, stratum=\"disqualifying-lien\")"},{"kind":"out-fail","text":"C  18 / 72 correct on disqualifying liens   (A: 69 / 72)"},{"kind":"out-fail","text":"sample miss: expected HIGH citing 2024-FL-0019988 — got \"MEDIUM; an equipment lender holds a filing\""},{"kind":"gate","text":"⛔ NO SHIP — 60% cheaper, and wrong on 75% of the cases that pay for the system"}],"state":{"label":"three arms, graded","before":{"title":"COST PER REQUEST — C WINS","view":{"type":"bars","unit":"USD / request","max":0.0247,"items":[{"label":"B — hybrid + rerank","value":0.0247,"tone":"bad","note":"most expensive arm"},{"label":"A — hybrid","value":0.0204,"note":"the incumbent"},{"label":"C — compressed","value":0.009,"tone":"win","note":"56% below A — the number that gets it shipped"}]}},"after":{"title":"ACCURACY ON THE 24 DISQUALIFYING-LIEN FILINGS","view":{"type":"stack","views":[{"type":"bars","unit":"% of 72 runs correct","max":100,"items":[{"label":"A — hybrid","value":95.8,"tone":"win","note":"69 / 72"},{"label":"B — hybrid + rerank","value":97.2,"note":"70 / 72 — still inside the noise band"},{"label":"C — compressed","value":25.0,"tone":"bad","note":"18 / 72 — filing numbers compressed into phrases"}]},{"type":"note","text":"Three arms, three honest verdicts: B is not distinguishable from A and costs more, so it does not ship. C is dramatically cheaper and fails the only stratum that matters, so it does not ship. A ships, unchanged — and the run that produced no deploy is the one that stopped two bad ones."}]}}}}]},{"id":"ce-versioning","badge":"WALKTHROUGH","color":"#2c3e50","time":"~4 min","title":"Fourteen edits, six points, no suspect","spec":"M30 · context as code — drift, attribution, regression gates","intro":"A quarter of small prompt edits took UCC risk accuracy from 94% to 88%, and nobody can name the one that did it. The same quarter, replayed with versions, changelogs and a gate, turns the mystery into a line number and a rollback.","provenance":{"kind":"illustrative","source":"a narrated quarter of prompt changes on a UCC risk pipeline; version numbers, accuracy figures, and changelog entries are plausible inventions, not measurements"},"foot":"The discipline is M30's: version every context change with a changelog, gate it on the eval set before merge, stamp the version into your logs so drift is attributable, and keep every version rollback-able.","steps":[{"title":"The slow leak","narrative":["In May the UCC risk pipeline scored 94% on the nightly eval set. In August it scores 88%. Nothing broke; there was never a bad day, only a slightly worse month than the one before it.","The system prompt lives in <code>config/prompts.yaml</code>. It has been edited about fourteen times this quarter — an example added, a sentence about tone, a retrieval <code>k</code> nudged, a compression budget trimmed, a guardrail phrase softened. Each was small, none was tested, and the file has one commit: <em>&quot;prompt tweaks&quot;</em>, amended repeatedly.","So there is nothing to bisect. You cannot name which edit cost you six points, you cannot roll back to a good state because you cannot say which state was good, and the logs record answers against a prompt they never identified. This is context drift: not one bad change, a quarter of unmeasured ones."],"youDo":"Run <code>git log</code> on the file that holds your system prompt. If it is under ten commits for a quarter of edits, your prompt is not under version control — it is under a filename.","terminal":[{"kind":"prompt","text":"which change dropped UCC risk accuracy from 94% to 88%?"},{"kind":"tool","text":"git log --oneline -- config/prompts.yaml"},{"kind":"out","text":"b2c9f11  prompt tweaks   (amended 14 times, 2026-05-02 → 2026-08-19)"},{"kind":"tool","text":"logs.group_by(\"prompt_version\")"},{"kind":"out-fail","text":"KeyError: 'prompt_version' — the field was never written"},{"kind":"out-fail","text":"no per-version eval history · no changelog · no rollback target"}],"state":{"label":"one quarter, untracked","before":{"title":"WHAT YOU CAN SEE","view":{"type":"rows","columns":["week","eval accuracy","what changed"],"rows":[{"cells":["2026-05-05","94%","unknown"]},{"cells":["2026-05-26","91%","unknown"],"tone":"bad"},{"cells":["2026-06-23","91%","unknown"]},{"cells":["2026-07-14","88%","unknown"],"tone":"bad"},{"cells":["2026-08-18","88%","unknown"],"tone":"bad"}]}},"after":{"title":"WHAT YOU CANNOT DO","view":{"type":"note","text":"Bisect (no versions), attribute (no stamps in the logs), roll back (no known-good target), or reproduce a June answer (the prompt that produced it no longer exists anywhere). The eval number is the only honest artifact you have, and it only tells you that something is wrong."}}}},{"title":"Register the change instead of saving the file","narrative":["Replay the same quarter with one rule: a context change is a <b>registered version</b>, not a file save. <code>register()</code> takes the prompt body, the retrieval and compression settings that travel with it, a changelog line saying what and why, and the eval result at the time of registration.","That last field is what makes the history useful. A changelog that says <em>&quot;trimmed the examples&quot;</em> is a diary; a changelog that says <em>&quot;trimmed the examples — 94.2% → 91.2%&quot;</em> is evidence.","And the version id is stamped into every observability record (M28), so from here on a log row knows which prompt produced it. Attribution is not a report you generate later; it is a field you write at call time or it does not exist."],"claudeSays":"Same prompt text as before. The difference is that the string now has an id, a parent, a reason, and a number attached to it.","youDo":"Add <code>prompt_version</code> to your log payload today, even before you have a registry. Everything else in this walkthrough is impossible without that one field.","terminal":[{"kind":"tool","text":"registry.register(\n    version=\"v31\", parent=\"v30\",\n    prompt=open(\"prompts/ucc_risk.md\").read(),\n    settings={\"retrieval_k\": 5, \"compress_budget\": 4000},\n    changelog=\"trim few-shot block — the 'termination filed but not posted' example looked redundant\",\n)"},{"kind":"out-pass","text":"v31 registered · sha 4e1a77c · parent v30 · eval pending"},{"kind":"tool","text":"observe.stamp(\"prompt_version\")"},{"kind":"out-pass","text":"every log record now carries prompt_version"}],"state":{"label":"config file → version registry","before":{"title":"BEFORE — an edited file","view":{"type":"diff","file":"config/prompts.yaml","lines":[["p","ucc_risk_system: |"],["p","  You are a UCC lien analyst. Grade debtor risk as LOW / MEDIUM / HIGH."],["p","  <examples>"],["m","    A termination is filed against 2024-FL-0019988 but has not posted."],["m","    The lien is still active. Grade HIGH and cite the filing id."],["p","    A debtor with no active filings grades LOW."],["p","  </examples>"]]}},"after":{"title":"AFTER — a registered version","view":{"type":"spec","id":"v31","status":"REGISTERED","rows":[["parent","v30"],["sha","4e1a77c"],["author","r.mensah"],["registered","2026-05-14"],["changelog","trim few-shot block — the 'termination filed but not posted' example looked redundant"],["settings","retrieval_k=5 · compress_budget=4000"],["eval at registration","pending — 200 filings, 3 samples"],["rollback target","v30"]]}}}},{"title":"The history answers in one query","narrative":["With sixteen versions registered and stamped, the question that had no answer becomes a table sorted by version. The six points are not spread evenly across fourteen edits — <b>two edits own five and a half of them</b> and the other twelve are noise.","<b>v31</b> removed the edge case that taught the model what a filed-but-unposted termination means. Accuracy fell 94.2% to 91.2% and the misses concentrate exactly there: on the 34 borderline filings, not across the board. <b>v37</b> cut the compression budget from 4,000 tokens to 2,500 to save money, and cost the filing identifiers the answers have to cite — 90.8% to 88.3%.","That is the whole payoff of versioning. Not that it prevents a bad change, but that it makes a bad change <em>nameable</em> — a version, a date, an author, a changelog line, and the stratum where the damage landed. \"The slide started at v31 on May 14\" is a thing you can act on. \"Accuracy is down this quarter\" is not."],"youDo":"Plot eval accuracy against version id rather than against calendar time. Steps in that chart are changes; slopes are noise.","terminal":[{"kind":"prompt","text":"eval accuracy by prompt version, v25 through v40"},{"kind":"tool","text":"registry.history(metric=\"eval_accuracy\", detect=\"step_change\")"},{"kind":"out","text":"v25 94.0   v28 93.8   v30 94.2   v31 91.2   v34 91.0\nv36 90.8   v37 88.3   v39 88.1   v40 88.0"},{"kind":"out-fail","text":"step change at v31: -3.0pp  (r.mensah, 2026-05-14, \"trim few-shot block\")"},{"kind":"out-fail","text":"step change at v37: -2.5pp  (d.alvarez, 2026-07-08, \"compress_budget 4000 → 2500 to cut cost\")"},{"kind":"out","text":"residual across the other 12 versions: -0.5pp — within noise"}],"state":{"label":"attribution","before":{"title":"BEFORE — six points, fourteen suspects","view":{"type":"note","text":"94% in May, 88% in August, fourteen undated edits and no way to tell a real regression from ordinary variation. Every proposed fix — rewrite it, freeze it, add more examples — is itself an untested change."}},"after":{"title":"AFTER — two versions own the slide","view":{"type":"rows","columns":["version","accuracy","delta","changelog","where the misses landed"],"rows":[{"cells":["v30","94.2%","&mdash;","reorder tool defs","&mdash;"],"tone":"win"},{"cells":["v31","91.2%","&minus;3.0pp","trim few-shot block","34 borderline filings"],"tone":"bad"},{"cells":["v34","91.0%","&minus;0.2pp","reword the tone sentence","noise"]},{"cells":["v36","90.8%","&minus;0.2pp","add a JSON hint","noise"]},{"cells":["v37","88.3%","&minus;2.5pp","compress_budget 4000 → 2500","24 disqualifying-lien filings"],"tone":"bad"},{"cells":["v40","88.0%","&minus;0.3pp","12 further edits, combined","noise"]}]}}}},{"title":"The gate, and the way back","narrative":["Attribution explains the past; the gate stops the next one. Every registered candidate runs the M29 eval set before it can merge, and a drop in accuracy, a rise in cost, or a fall in the safety pass rate blocks it. Candidate <b>v41</b> adds <em>&quot;be concise&quot;</em> to the system prompt, scores 85.2% against the v40 baseline of 88.0%, and never reaches production. It also rewrites the cached prefix, so the gate reports the cache and memory it would have invalidated — a prompt change is a migration, not an edit.","Then walk back the two you now have names for. Restore the v31 example and lift the compression budget to 4,000, registered as <b>v42</b> with the changelog saying which regressions it reverses. It scores 93.5% — the 0.7 points that do not come back are the honest cost of a quarter spent without a gate.","Roll out with the discipline the mechanism assumes: pin the version per request, canary 10% of traffic, keep v40 live and rollback-able, and let the old cached prefixes expire rather than serving two prompts under one cache key."],"claudeSays":"v41 was blocked by a number, not by an opinion. That is the only kind of block that survives a disagreement.","youDo":"Wire your eval set into CI as a required check on the prompt directory. A gate that runs after merge is a report; a gate that runs be
