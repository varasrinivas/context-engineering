<style>/* Walkthrough widget styles. EVERY rule is scoped under .wt so this file can be
   inlined into a course page without colliding with the host's own CSS (the
   course players already define .stamp, .step-card, table, pre, p, h3 …).
   Ported from priorauth-sdd-course/walkthrough/src/app.css, plus the receipt,
   bars, window and tab views these courses need.

   Two palettes: the default light "paper" one (kit-format players, SDD guide)
   and .wt-dark for the knowledge-graph modules, whose pages are dark navy.
   Set it per mount with data-wt-theme="dark". */

.wt{
  --paper:#FAFBFC; --sheet:#FFFFFF; --ink:#1C2127; --ink-soft:#4A5361;
  --rule:#D9DEE5; --rule-soft:#EAEDF1;
  --grid-blue:#33506B; --spec-green:#1F7A4D; --spec-green-soft:#E8F3ED;
  --signal-amber:#B45309; --signal-amber-soft:#FCF1E4;
  --defect-red:#A63A3A; --defect-red-soft:#F9ECEC;
  --term-bg:#161B22; --code-bg:#F4F6F9;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  font-family:var(--sans);color:var(--ink);line-height:1.6;font-size:16px;text-align:left;
}
.wt.wt-dark{
  --paper:#0F1A2B; --sheet:#162033; --ink:#E8ECF1; --ink-soft:#94A3B8;
  --rule:#2A3648; --rule-soft:#212C3D;
  --grid-blue:#7FB2E8; --spec-green:#5FCB93; --spec-green-soft:#12301F;
  --signal-amber:#E0A458; --signal-amber-soft:#2E2214;
  --defect-red:#E58989; --defect-red-soft:#331B1B;
  --term-bg:#0B1220; --code-bg:#101A2A;
}
.wt *{margin:0;padding:0;box-sizing:border-box}
.wt button{font-family:inherit;cursor:pointer}
.wt a{color:var(--grid-blue)}
.wt code{font-family:var(--mono);font-size:.88em;background:var(--rule-soft);padding:.1em .35em;border-radius:3px;color:inherit}
/* neutralise the host page's element styles before our own rules land */
.wt pre{background:transparent;color:inherit;border-radius:0;font-size:inherit;line-height:inherit;overflow:visible;border:none;margin:0;padding:0}
.wt table{border-collapse:collapse;background:transparent;font-size:inherit;margin:0;width:auto}
.wt h2,.wt h3{font-family:var(--sans);letter-spacing:-.01em;line-height:1.25;color:var(--ink);border:none;padding:0}
.wt p{color:var(--ink)}
.wt :focus-visible{outline:2px solid var(--grid-blue);outline-offset:2px}

/* ---------- scenario head (standalone) ---------- */
.wt .scen-head{border-left:4px solid var(--scen-color);padding-left:18px;margin-bottom:22px}
.wt .scen-meta{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:.72rem;flex-wrap:wrap}
.wt .scen-badge{background:var(--scen-color);color:#fff;padding:2px 10px;border-radius:3px;letter-spacing:.1em;font-weight:600}
.wt .scen-spec{color:var(--ink-soft);letter-spacing:.06em}
.wt .scen-head h2{font-size:1.45rem;margin:6px 0}
.wt .scen-intro{color:var(--ink-soft);max-width:80ch;font-family:var(--serif)}

/* ---------- provenance ---------- */
.wt .wt-prov{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.1em;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;color:var(--ink-soft)}
.wt .wt-prov-measured .wt-prov-k{color:var(--spec-green);font-weight:600}
.wt .wt-prov-illustrative .wt-prov-k{color:var(--signal-amber);font-weight:600}
.wt .wt-prov-v{opacity:.8;text-transform:none;letter-spacing:0}

/* ---------- progress ---------- */
.wt .progress{display:flex;align-items:center;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.wt .prog-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);background:var(--sheet);
  font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--ink-soft);transition:all .25s;
  display:flex;align-items:center;justify-content:center;padding:0}
.wt .prog-dot.done{border-color:var(--spec-green);color:var(--spec-green);background:var(--spec-green-soft)}
.wt .prog-dot.on{border-color:var(--scen-color);background:var(--scen-color);color:#fff;transform:scale(1.12)}
.wt .prog-label{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft);margin-left:6px}

/* ---------- step ---------- */
.wt .step{display:grid;grid-template-columns:minmax(320px,5fr) minmax(380px,7fr);gap:26px;
  animation:wtStepIn .35s ease both}
.wt.wt-embed .step{grid-template-columns:1fr;gap:18px}
@keyframes wtStepIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){.wt .step{grid-template-columns:1fr}}

.wt .step-copy h3{font-size:1.15rem;margin-bottom:12px;font-weight:700}
.wt .step-n{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--grid-blue);margin-bottom:2px}
.wt .step-copy p{margin-bottom:12px;max-width:66ch;font-size:.95rem}
.wt .step-copy p b{font-weight:600}

.wt .youdo,.wt .claudesays{border:1px solid var(--rule);border-left:3px solid var(--signal-amber);
  background:var(--signal-amber-soft);padding:12px 16px;margin:14px 0;border-radius:0 6px 6px 0}
.wt .claudesays{border-left-color:var(--grid-blue);background:var(--rule-soft)}
.wt .youdo-k{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;font-weight:600;
  color:var(--signal-amber);margin-bottom:4px}
.wt .cs-k{color:var(--grid-blue)}
.wt .youdo-v{font-size:.92rem}

/* ---------- terminal ---------- */
.wt .term{background:var(--term-bg);border-radius:10px;overflow:hidden;
  box-shadow:0 10px 30px rgba(16,22,30,.25);margin-bottom:20px}
.wt .term-bar{display:flex;align-items:center;gap:12px;background:#0D1117;padding:9px 14px}
.wt .term-dots{display:flex;gap:6px}
.wt .term-dots i{width:11px;height:11px;border-radius:50%;background:#30363D;display:block}
.wt .term-dots i:first-child{background:#E5534B}
.wt .term-dots i:nth-child(2){background:#D4A72C}
.wt .term-dots i:last-child{background:#3FB950}
.wt .term-title{font-family:var(--mono);font-size:.72rem;color:#8A97A6;flex:1}
.wt .term-actions button{background:none;border:1px solid #30363D;color:#8A97A6;font-family:var(--mono);
  font-size:.66rem;padding:2px 10px;border-radius:99px}
.wt .term-actions button:hover{color:#E8ECF0;border-color:#8A97A6}
.wt .term-body{padding:16px 18px;max-height:460px;overflow-y:auto;font-family:var(--mono);
  font-size:.8rem;line-height:1.55}
.wt .tl{display:flex;gap:10px;margin-bottom:10px}
.wt .tl pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;flex:1;font-size:inherit;line-height:inherit}
.wt .tl-appear{animation:wtTlIn .3s ease both}
@keyframes wtTlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wt .tl-prompt pre{color:#F0F3F6;font-weight:500}
.wt .tl-caret{color:#7FD6A8;font-weight:600}
.wt .tl-who{color:#D4A843}
.wt .tl-who-tool{color:#9BC0E8}
.wt .tl-claude pre{color:#C6CEDA}
.wt .tl-tool pre{color:#9BC0E8}
.wt .tl-out pre{color:#8A97A6}
.wt .tl-out-pass pre{color:#7FD6A8;font-weight:500}
.wt .tl-out-fail pre{color:#F1A0A0;font-weight:500}
.wt .tl-gate pre{color:#F1C58B;font-weight:600}
.wt .cursor{display:inline-block;width:7px;height:14px;background:#7FD6A8;vertical-align:-2px;
  animation:wtBlink .8s steps(1) infinite;margin-left:1px}
@keyframes wtBlink{50%{opacity:0}}

/* ---------- state panel ---------- */
.wt .state{background:var(--sheet);border:1px solid var(--ink);box-shadow:4px 4px 0 var(--rule);border-radius:2px}
.wt.wt-dark .state{border-color:var(--rule);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.wt .state-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--ink);color:var(--sheet);padding:8px 14px}
.wt.wt-dark .state-head{background:#0B1220;color:var(--ink)}
.wt .state-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em}
.wt .ba-toggle{display:flex;border:1px solid #4A5361;border-radius:99px;overflow:hidden;flex:0 0 auto}
.wt .ba-toggle button{background:none;border:none;color:#8A97A6;font-family:var(--mono);font-size:.68rem;
  letter-spacing:.08em;padding:3px 14px}
.wt .ba-toggle button.on{background:var(--defect-red);color:#fff}
.wt .ba-toggle button.on-after{background:var(--spec-green);color:#fff}
.wt .state-body{padding:16px 18px;animation:wtStateIn .3s ease both}
@keyframes wtStateIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.wt .state-title{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;margin-bottom:10px;font-weight:600}
.wt .st-before{color:var(--defect-red)}
.wt .st-after{color:var(--spec-green)}
.wt .apply{display:block;width:100%;border:none;border-top:1px dashed var(--rule);
  background:var(--spec-green-soft);color:var(--spec-green);font-family:var(--mono);font-size:.74rem;
  font-weight:600;padding:10px;letter-spacing:.04em}
.wt .apply:hover{filter:brightness(.97)}
.wt .state-note{font-size:.88rem;color:var(--ink-soft);font-family:var(--serif)}
.wt .state-stack>div{margin-bottom:14px}
.wt .state-stack>div:last-child{margin-bottom:0}

/* json */
.wt .json{font-family:var(--mono);font-size:.78rem;line-height:1.6;background:var(--code-bg);
  border:1px solid var(--rule-soft);border-radius:6px;padding:12px 14px;overflow-x:auto;color:var(--ink)}
.wt .json-row.hl{background:var(--signal-amber-soft);outline:1px solid var(--signal-amber);
  border-radius:3px;animation:wtHl 1.2s ease 1}
@keyframes wtHl{0%{opacity:.45}100%{opacity:1}}
.wt .jk{color:var(--grid-blue)}
.wt .js{color:var(--defect-red)}
.wt .jn{color:var(--spec-green)}

/* spec mini */
.wt .spec-mini{border:1px solid var(--ink);font-size:.85rem}
.wt.wt-dark .spec-mini{border-color:var(--rule)}
.wt .spec-mini-bar{display:flex;justify-content:space-between;align-items:center;background:var(--ink);
  color:var(--sheet);padding:7px 12px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;gap:10px}
.wt.wt-dark .spec-mini-bar{background:#0B1220;color:var(--ink)}
.wt .stamp{font-family:var(--mono);font-weight:600;font-size:.62rem;letter-spacing:.12em;
  border:1.5px solid currentColor;padding:2px 8px;border-radius:2px;white-space:nowrap;
  animation:wtStamp .45s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
@keyframes wtStamp{from{transform:scale(1.7) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.wt .stamp-approved,.wt .stamp-verified{color:#7FD6A8}
.wt .stamp-draft{color:#F1C58B}
.wt .stamp-defect,.wt .stamp-refused{color:#F1A0A0}
.wt .spec-mini-body{padding:6px 12px}
.wt .spec-mini-row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--rule-soft);font-size:.8rem}
.wt .spec-mini-row:last-child{border-bottom:none}
.wt .smk{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);padding-top:2px}

/* rows table */
.wt .rows{width:100%;font-size:.78rem}
.wt .rows th{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  text-align:left;color:var(--ink-soft);border-bottom:2px solid var(--ink);padding:6px 8px;background:transparent}
.wt.wt-dark .rows th{border-bottom-color:var(--rule)}
.wt .rows td{padding:6px 8px;border-bottom:1px solid var(--rule-soft);font-family:var(--mono);
  font-size:.74rem;color:var(--ink)}
.wt .row-new td{background:var(--spec-green-soft);animation:wtRowIn .6s ease both}
.wt .row-new td:first-child{border-left:3px solid var(--spec-green)}
.wt .row-win td{background:var(--spec-green-soft)}
.wt .row-bad td{background:var(--defect-red-soft)}
@keyframes wtRowIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* diff */
.wt .diff{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.wt .diff-file{font-family:var(--mono);font-size:.68rem;background:var(--rule-soft);padding:6px 12px;color:var(--ink-soft)}
.wt .diff pre{font-family:var(--mono);font-size:.76rem;line-height:1.6;padding:10px 0;overflow-x:auto;color:var(--ink)}
.wt .dl{padding:0 14px;white-space:pre}
.wt .dl-p{color:var(--ink-soft)}
.wt .dl-m{background:var(--defect-red-soft);color:var(--defect-red)}
.wt .dl-a{background:var(--spec-green-soft);color:var(--spec-green)}

/* tests */
.wt .tests{border-radius:8px;padding:16px 18px;text-align:center}
.wt .tests-fail{background:var(--defect-red-soft);border:1px solid var(--defect-red)}
.wt .tests-pass{background:var(--spec-green-soft);border:1px solid var(--spec-green);
  animation:wtPass .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes wtPass{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.wt .tests-big{font-family:var(--mono);font-weight:600;font-size:1rem;letter-spacing:.08em}
.wt .tests-fail .tests-big{color:var(--defect-red)}
.wt .tests-pass .tests-big{color:var(--spec-green)}
.wt .tests-nums{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft);margin-top:4px}
.wt .tests-note{font-size:.8rem;color:var(--ink-soft);margin-top:8px;font-family:var(--serif)}

/* ---------- receipt (Token Lens) ---------- */
.wt .receipt{font-family:var(--mono);font-size:.78rem}
.wt .rc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.wt .rc-mode{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.wt .rc-q{font-size:.68rem;color:var(--ink-soft);font-style:italic;max-width:32ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .lbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--rule-soft);margin-bottom:12px}
.wt .lseg{height:100%;transition:width .5s ease}
.wt .lseg-hl{outline:2px solid var(--ink);outline-offset:-2px}
.wt .rc-lines{margin-bottom:6px}
.wt .rc-line{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.wt .rc-line.hl{background:var(--signal-amber-soft);border-radius:3px;margin:0 -6px;padding:3px 6px}
.wt .rc-sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto;display:inline-block}
.wt .rc-k{color:var(--ink-soft)}
.wt .rc-dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
.wt .rc-v{font-variant-numeric:tabular-nums;color:var(--ink)}
.wt .rc-total{display:flex;align-items:baseline;gap:8px;padding:7px 0 3px;margin-top:4px;
  border-top:1px solid var(--rule);font-weight:600}
.wt .rc-total .rc-k,.wt .rc-total .rc-v{color:var(--ink)}
.wt .rc-sub .rc-k,.wt .rc-sub .rc-v{opacity:.75}
.wt .rc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wt .rc-chip{font-size:.64rem;letter-spacing:.04em;border:1px solid var(--rule);border-radius:99px;
  padding:2px 9px;color:var(--ink-soft)}
.wt .rc-verdict{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wt .rcv-note{font-size:.68rem;color:var(--ink-soft)}
.wt .rcv-failed{background:var(--defect-red-soft);margin:12px -18px -16px;padding:10px 18px;border-top:1px solid var(--defect-red)}

/* ---------- bars (comparative totals) ---------- */
.wt .bars{font-family:var(--mono);font-size:.76rem}
.wt .bars-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.wt .bars-row:last-child{border-bottom:none}
.wt .bars-k{color:var(--ink-soft);letter-spacing:.04em}
.wt .bars-track{background:var(--rule-soft);border-radius:3px;height:14px;overflow:hidden}
.wt .bars-fill{height:100%;background:var(--grid-blue);border-radius:3px;transition:width .6s ease}
.wt .bt-win .bars-fill{background:var(--spec-green)}
.wt .bt-bad .bars-fill{background:var(--defect-red)}
.wt .bt-win .bars-k{color:var(--spec-green);font-weight:600}
.wt .bt-bad .bars-k{color:var(--defect-red)}
.wt .bars-v{font-variant-numeric:tabular-nums;color:var(--ink)}
.wt .bars-note{grid-column:2/4;font-size:.68rem;color:var(--ink-soft);margin-top:-2px}

/* ---------- window (context window capacity) ---------- */
.wt .cwin{font-family:var(--mono);font-size:.76rem}
.wt .cwin-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.wt .cwin-k{color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;font-size:.66rem}
.wt .cwin-v{color:var(--ink);font-variant-numeric:tabular-nums}
.wt .cwin-track{background:var(--rule-soft);border:1px solid var(--rule);border-radius:5px;
  height:22px;overflow:hidden;padding:2px}
.wt .cwin-used{height:100%;transition:width .6s ease;min-width:2px}
.wt .cwin-used .lbar{height:100%;margin:0;border-radius:3px}
.wt .cwin-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.68rem;color:var(--ink-soft)}
.wt .cwin-item{display:inline-flex;align-items:center;gap:5px}
.wt .cwin-item.hl{color:var(--ink);font-weight:600}
.wt .cwin-note{margin-top:10px;font-family:var(--serif);font-size:.82rem;color:var(--ink-soft)}

/* per-step source citation */
.wt .wt-cite{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);
  font-size:.64rem;color:var(--ink-soft);letter-spacing:.02em;flex-wrap:wrap}
.wt .wt-cite-k{color:var(--spec-green);font-weight:600;letter-spacing:.12em;
  border:1px solid var(--spec-green);border-radius:99px;padding:1px 7px}

/* ---------- step nav ---------- */
.wt .stepnav{display:flex;justify-content:space-between;gap:12px;margin:24px 0 0}
.wt .stepnav button{border:1px solid var(--rule);background:var(--sheet);padding:10px 22px;border-radius:8px;
  font-size:.9rem;color:var(--ink-soft)}
.wt .stepnav button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.wt .stepnav button.primary{background:var(--scen-color);color:#fff;border-color:var(--scen-color);font-weight:600}
.wt .stepnav button.primary:hover:not(:disabled){filter:brightness(1.1)}
.wt .stepnav button:disabled{opacity:.4;cursor:default}

/* ---------- embedded chrome ---------- */
.wt.wt-embed{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--scen-color);
  border-radius:0 0 8px 8px;padding:20px 22px 22px;margin:24px 0 34px}
.wt .wt-embed-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px dashed var(--rule)}
.wt .weh-badge{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.12em;
  background:var(--scen-color);color:#fff;padding:3px 10px;border-radius:3px}

</style>
<script>/* Walkthrough runtime — dependency-free port of the priorauth-sdd-course
   walkthrough widget (walkthrough/src/components/*.jsx).

   Scenarios are data. A scenario is stepped through one step at a time; each
   step pairs intent (narrative + YOU DO + CLAUDE'S MOVE) with evidence (a
   replayed terminal and a before/after state panel).

   Usage in a page:
     <div data-wt="kg-147-files"></div>
     <script>WT.register([ ...scenarios... ]); WT.mountAll();<\/script>

   Mounting re-runs under a MutationObserver, because the kit-format course
   players replace their content wrapper's innerHTML on every module change.

   Schema (see README.md for the full reference):
     scenario { id, badge, color, time, title, spec, intro, provenance, steps[] }
     step     { title, narrative[], youDo, claudeSays, terminal[], state }
     terminal line { kind: prompt|claude|tool|out|out-pass|out-fail|gate, text }
     state    { label, before:{title,view}, after:{title,view} }
     view     json | spec | rows | diff | tests | note | stack
              | receipt | bars | window        (added for these courses)
*/
(function (global) {
  'use strict';

  var REDUCED = !!(global.matchMedia &&
    global.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var LINE_DELAY = 420;   // ms between revealed lines
  var TYPE_SPEED = 16;    // ms per character on prompt lines
  var PROMPT_HOLD = 260;  // ms pause after a prompt line finishes typing

  var REGISTRY = {};

  /* ---------------------------------------------------------------- utils */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function html(tag, cls, markup) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (markup != null) n.innerHTML = markup;
    return n;
  }

  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }

  function num(n) {
    return typeof n === 'number' ? n.toLocaleString('en-US') : String(n);
  }

  /* Layer palette for receipt/window views, in canonical layer order. */
  var LAYER_COLORS = ['#33506B', '#1F7A4D', '#B45309', '#7A3E9D', '#A63A3A',
                      '#2D7D8A', '#8A6D2F'];

  /* ---------------------------------------------------------------- views */

  function jsonView(v) {
    var pre = el('pre', 'json');
    var keys = Object.keys(v.data);
    var hl = v.highlight || [];
    pre.appendChild(document.createTextNode('{'));
    keys.forEach(function (k, i) {
      var row = el('div', 'json-row' + (hl.indexOf(k) >= 0 ? ' hl' : ''));
      var val = v.data[k];
      var isNum = typeof val === 'number';
      row.appendChild(document.createTextNode('  '));
      add(row, el('span', 'jk', '"' + k + '"'));
      row.appendChild(document.createTextNode(': '));
      add(row, el('span', isNum ? 'jn' : 'js', isNum ? num(val) : '"' + val + '"'));
      if (i < keys.length - 1) row.appendChild(document.createTextNode(','));
      pre.appendChild(row);
    });
    pre.appendChild(document.createTextNode('}'));
    return pre;
  }

  function specView(v) {
    var box = el('div', 'spec-mini');
    var bar = el('div', 'spec-mini-bar');
    add(bar, el('span', null, v.id),
             el('span', 'stamp stamp-' + String(v.status).toLowerCase().replace(/[^a-z]/g, ''), v.status));
    var body = el('div', 'spec-mini-body');
    (v.rows || []).forEach(function (r) {
      var row = el('div', 'spec-mini-row');
      add(row, el('span', 'smk', r[0]), html('span', 'smv', r[1]));
      body.appendChild(row);
    });
    return add(box, bar, body);
  }

  function rowsView(v) {
    var t = el('table', 'rows');
    var thead = el('thead'), htr = el('tr');
    (v.columns || []).forEach(function (c) { add(htr, el('th', null, c)); });
    add(thead, htr);
    var tb = el('tbody');
    (v.rows || []).forEach(function (r) {
      var tr = el('tr', r.new ? 'row-new' : (r.tone ? 'row-' + r.tone : null));
      (r.cells || []).forEach(function (c) { add(tr, html('td', null, String(c))); });
      add(tb, tr);
    });
    return add(t, thead, tb);
  }

  function diffView(v) {
    var box = el('div', 'diff');
    add(box, el('div', 'diff-file', v.file));
    var pre = el('pre');
    (v.lines || []).forEach(function (l) {
      add(pre, el('div', 'dl dl-' + l[0], l[1]));
    });
    return add(box, pre);
  }

  function testsView(v) {
    var pass = !v.failures;
    var box = el('div', 'tests ' + (pass ? 'tests-pass' : 'tests-fail'));
    add(box, el('div', 'tests-big', v.big || (pass ? 'BUILD SUCCESS' : 'BUILD FAILURE')));
    if (v.run != null) {
      add(box, el('div', 'tests-nums',
        'Tests run: ' + v.run + ' · Failures: ' + (v.failures || 0) + ' · Errors: 0'));
    }
    if (v.note) add(box, html('div', 'tests-note', v.note));
    return box;
  }

  /* A horizontal stacked bar shared by the receipt and window views. */
  function stackedBar(layers, total, highlight) {
    var bar = el('div', 'lbar');
    layers.forEach(function (l, i) {
      var seg = el('div', 'lseg' + (highlight && highlight.indexOf(l.label) >= 0 ? ' lseg-hl' : ''));
      seg.style.width = (total ? (l.tokens / total) * 100 : 0) + '%';
      seg.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      seg.title = l.label + ' · ' + num(l.tokens);
      add(bar, seg);
    });
    return bar;
  }

  /* receipt — the Token Lens: layered bar, itemised lines, verdict stamp. */
  function receiptView(v) {
    var box = el('div', 'receipt');
    var head = el('div', 'rc-head');
    add(head, el('span', 'rc-mode', (v.mode || '') + ' · token receipt'));
    if (v.question) add(head, el('span', 'rc-q', v.question));
    add(box, head);

    var layers = v.layers || [];
    var sum = layers.reduce(function (a, l) { return a + l.tokens; }, 0);
    add(box, stackedBar(layers, sum, v.highlight));

    var list = el('div', 'rc-lines');
    layers.forEach(function (l, i) {
      var row = el('div', 'rc-line' + (v.highlight && v.highlight.indexOf(l.label) >= 0 ? ' hl' : ''));
      var sw = el('span', 'rc-sw');
      sw.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      add(row, sw, el('span', 'rc-k', l.label), el('span', 'rc-dots'),
               el('span', 'rc-v', num(l.tokens)));
      add(list, row);
    });
    add(box, list);

    var tot = el('div', 'rc-total');
    add(tot, el('span', 'rc-k', 'Input total'), el('span', 'rc-dots'),
             el('span', 'rc-v', num(v.inputTotal != null ? v.inputTotal : sum)));
    add(box, tot);

    if (v.output != null) {
      var o = el('div', 'rc-line rc-sub');
      add(o, el('span', 'rc-k', 'Output'), el('span', 'rc-dots'), el('span', 'rc-v', num(v.output)));
      add(box, o);
    }

    var meta = el('div', 'rc-meta');
    if (v.cost) add(meta, el('span', 'rc-chip', v.cost));
    if (v.cacheRead) add(meta, el('span', 'rc-chip', 'cache read ' + v.cacheRead));
    if (v.latency) add(meta, el('span', 'rc-chip', v.latency));
    if (meta.childNodes.length) add(box, meta);

    if (v.verdict) {
      var vk = String(v.verdict).toLowerCase();
      var label = vk === 'verified' ? '✓ Correct'
                : vk === 'failed' ? '✕ FAILED — savings void'
                : '– Ungraded';
      var stamp = el('div', 'rc-verdict rcv-' + vk);
      add(stamp, el('span', 'stamp stamp-' + (vk === 'verified' ? 'verified' : vk === 'failed' ? 'refused' : 'draft'), label));
      if (v.verdictNote) add(stamp, el('span', 'rcv-note', v.verdictNote));
      add(box, stamp);
    }
    return box;
  }

  /* bars — comparative totals across arms/strategies. */
  function barsView(v) {
    var box = el('div', 'bars');
    var items = v.items || [];
    var max = v.max || items.reduce(function (a, i) { return Math.max(a, i.value); }, 0);
    items.forEach(function (it) {
      var row = el('div', 'bars-row' + (it.tone ? ' bt-' + it.tone : ''));
      add(row, el('span', 'bars-k', it.label));
      var track = el('div', 'bars-track');
      var fill = el('div', 'bars-fill');
      fill.style.width = (max ? (it.value / max) * 100 : 0) + '%';
      add(track, fill);
      add(row, track, el('span', 'bars-v', num(it.value) + (v.unit ? ' ' + v.unit : '')));
      if (it.note) add(row, el('span', 'bars-note', it.note));
      add(box, row);
    });
    return box;
  }

  /* window — a context window's layer composition against its capacity. */
  function windowView(v) {
    var box = el('div', 'cwin');
    var layers = v.layers || [];
    var used = v.used != null ? v.used : layers.reduce(function (a, l) { return a + l.tokens; }, 0);
    var cap = v.capacity || used;

    var head = el('div', 'cwin-head');
    add(head, el('span', 'cwin-k', v.label || 'context window'),
              el('span', 'cwin-v', num(used) + ' / ' + num(cap) +
                 ' (' + Math.round((used / cap) * 100) + '% full)'));
    add(box, head);

    var track = el('div', 'cwin-track');
    var used_pct = Math.min(100, (used / cap) * 100);
    var inner = el('div', 'cwin-used');
    inner.style.width = used_pct + '%';
    add(inner, stackedBar(layers, used, v.highlight));
    add(track, inner);
    add(box, track);

    var legend = el('div', 'cwin-legend');
    layers.forEach(function (l, i) {
      var it = el('span', 'cwin-item' + (v.highlight && v.highlight.indexOf(l.label) >= 0 ? ' hl' : ''));
      var sw = el('span', 'rc-sw');
      sw.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      add(it, sw, el('span', null, l.label + ' ' + num(l.tokens)));
      add(legend, it);
    });
    add(box, legend);
    if (v.note) add(box, html('div', 'cwin-note', v.note));
    return box;
  }

  function renderView(v) {
    if (!v) return null;
    switch (v.type) {
      case 'json':    return jsonView(v);
      case 'spec':    return specView(v);
      case 'rows':    return rowsView(v);
      case 'diff':    return diffView(v);
      case 'tests':   return testsView(v);
      case 'receipt': return receiptView(v);
      case 'bars':    return barsView(v);
      case 'window':  return windowView(v);
      case 'note':    return html('div', 'state-note', v.text);
      case 'stack':
        var box = el('div', 'state-stack');
        (v.views || []).forEach(function (sub) {
          var r = renderView(sub);
          if (r) add(box, add(el('div'), r));
        });
        return box;
      default: return null;
    }
  }

  /* ------------------------------------------------------------- terminal */

  /* Replays a session: lines appear in order, prompt lines type out. */
  function Terminal(lines) {
    var shown = 0, typed = 0, skipped = REDUCED, timer = null;

    var root = el('div', 'term');
    var bar = el('div', 'term-bar');
    var dots = el('span', 'term-dots');
    add(dots, el('i'), el('i'), el('i'));
    var title = el('span', 'term-title', 'claude — session replay');
    var actions = el('span', 'term-actions');
    var btn = el('button');
    btn.type = 'button';
    add(actions, btn);
    add(bar, dots, title, actions);
    var body = el('div', 'term-body');
    add(root, bar, body);

    function clear() { if (timer) { clearTimeout(timer); timer = null; } }

    function paint() {
      body.textContent = '';
      var visible = skipped ? lines.length : Math.min(lines.length, shown + 1);
      for (var i = 0; i < visible; i++) {
        var line = lines[i];
        var isCurrent = !skipped && i === shown;
        var text = (line.kind === 'prompt' && isCurrent) ? line.text.slice(0, typed) : line.text;
        var row = el('div', 'tl tl-' + line.kind +
          (isCurrent && line.kind !== 'prompt' ? ' tl-appear' : ''));
        if (line.kind === 'prompt') add(row, el('span', 'tl-caret', '›'));
        if (line.kind === 'claude') add(row, el('span', 'tl-who', '⏺'));
        if (line.kind === 'tool')   add(row, el('span', 'tl-who tl-who-tool', '⚒'));
        var pre = el('pre', null, text);
        if (line.kind === 'prompt' && isCurrent && typed < line.text.length) {
          add(pre, el('span', 'cursor'));
        }
        add(row, pre);
        add(body, row);
      }
      body.scrollTop = body.scrollHeight;
      var done = skipped || shown >= lines.length;
      btn.textContent = done ? 'replay ↺' : 'show all';
    }

    function tick() {
      clear();
      if (skipped || shown >= lines.length) { paint(); return; }
      var line = lines[shown];
      if (line.kind === 'prompt' && typed < line.text.length) {
        timer = setTimeout(function () { typed++; paint(); tick(); }, TYPE_SPEED);
      } else {
        timer = setTimeout(function () {
          shown++; typed = 0; paint(); tick();
        }, line.kind === 'prompt' ? PROMPT_HOLD : LINE_DELAY);
      }
      paint();
    }

    btn.addEventListener('click', function () {
      var done = skipped || shown >= lines.length;
      if (done) { shown = 0; typed = 0; skipped = false; }
      else { skipped = true; }
      tick();
    });

    tick();
    return { el: root, destroy: clear };
  }

  /* ---------------------------------------------------------- state panel */

  function StatePanel(state) {
    var side = 'before';
    var single = !state.after;

    var root = el('div', 'state');
    var head = el('div', 'state-head');
    add(head, el('span', 'state-label', state.label || ''));

    var beforeBtn, afterBtn;
    if (!single) {
      var toggle = el('span', 'ba-toggle');
      toggle.setAttribute('role', 'tablist');
      beforeBtn = el('button', 'on', 'Before');
      afterBtn = el('button', null, 'After');
      beforeBtn.type = afterBtn.type = 'button';
      beforeBtn.addEventListener('click', function () { show('before'); });
      afterBtn.addEventListener('click', function () { show('after'); });
      add(toggle, beforeBtn, afterBtn);
      add(head, toggle);
    }

    var body = el('div', 'state-body sb-before');
    var apply = el('button', 'apply', 'Apply this step — see the after state →');
    apply.type = 'button';
    apply.addEventListener('click', function () { show('after'); });

    add(root, head, body);
    if (!single) add(root, apply);

    function show(next) {
      side = next;
      body.className = 'state-body sb-' + side;
      body.textContent = '';
      var cur = side === 'before' ? state.before : state.after;
      if (cur.title) add(body, el('div', 'state-title st-' + side, cur.title));
      var v = renderView(cur.view);
      if (v) add(body, v);
      if (!single) {
        beforeBtn.className = side === 'before' ? 'on' : '';
        afterBtn.className = side === 'after' ? 'on on-after' : '';
        apply.style.display = side === 'before' ? '' : 'none';
      }
    }

    show('before');
    return { el: root };
  }

  /* ----------------------------------------------------------- walkthrough */

  function provenanceEl(p) {
    if (!p) return null;
    var measured = p.kind === 'measured';
    var box = el('span', 'wt-prov wt-prov-' + (measured ? 'measured' : 'illustrative'));
    add(box, el('span', 'wt-prov-k', measured ? 'MEASURED' : 'ILLUSTRATIVE'));
    if (p.source) add(box, el('span', 'wt-prov-v', p.source));
    return box;
  }

  function renderScenario(host, scenario, opts) {
    opts = opts || {};
    var embedded = opts.embedded !== false;
    var stepIdx = 0;
    var live = [];   // teardown handles for the current step

    host.textContent = '';
    var theme = host.getAttribute('data-wt-theme') || opts.theme || '';
    host.className = 'wt' + (embedded ? ' wt-embed' : '') + (theme === 'dark' ? ' wt-dark' : '');
    host.style.setProperty('--scen-color', scenario.color || '#33506B');

    if (embedded) {
      var eh = el('div', 'wt-embed-head');
      add(eh, el('span', 'weh-badge', scenario.badge || 'WALKTHROUGH'),
              el('span', 'weh-title', scenario.title + ' — walk it step by step'));
      var prov = provenanceEl(scenario.provenance);
      if (prov) add(eh, prov);
      if (scenario.time) add(eh, el('span', 'weh-time', scenario.time));
      add(host, eh);
    } else {
      var sh = el('div', 'scen-head');
      var meta = el('div', 'scen-meta');
      add(meta, el('span', 'scen-badge', scenario.badge || 'WALKTHROUGH'));
      if (scenario.spec) add(meta, el('span', 'scen-spec', scenario.spec));
      var p2 = provenanceEl(scenario.provenance);
      if (p2) add(meta, p2);
      add(sh, meta, el('h2', null, scenario.title));
      if (scenario.intro) add(sh, html('p', 'scen-intro', scenario.intro));
      add(host, sh);
    }

    var progress = el('div', 'progress');
    var stepWrap = el('div');
    var nav = el('div', 'stepnav');
    var prevBtn = el('button', null, '← Previous');
    var nextBtn = el('button', 'primary', 'Next step →');
    prevBtn.type = nextBtn.type = 'button';
    add(nav, prevBtn, nextBtn);
    add(host, progress, stepWrap, nav);

    if (embedded && scenario.foot) {
      add(host, html('div', 'wt-embed-foot', scenario.foot));
    }

    prevBtn.addEventListener('click', function () { go(stepIdx - 1); });
    nextBtn.addEventListener('click', function () { go(stepIdx + 1); });

    host.setAttribute('tabindex', '-1');
    host.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { go(stepIdx + 1); }
      else if (e.key === 'ArrowLeft') { go(stepIdx - 1); }
    });

    function teardown() {
      live.forEach(function (h) { if (h && h.destroy) h.destroy(); });
      live = [];
    }

    function go(i) {
      if (i < 0 || i >= scenario.steps.length) return;
      stepIdx = i;
      render();
    }

    function render() {
      teardown();
      var step = scenario.steps[stepIdx];
      var last = stepIdx === scenario.steps.length - 1;

      progress.textContent = '';
      scenario.steps.forEach(function (st, i) {
        var d = el('button', 'prog-dot' + (i === stepIdx ? ' on' : '') + (i < stepIdx ? ' done' : ''));
        d.type = 'button';
        d.title = st.title;
        d.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.title);
        add(d, el('span', null, String(i + 1)));
        d.addEventListener('click', function () { go(i); });
        add(progress, d);
      });
      add(progress, el('span', 'prog-label',
        'Step ' + (stepIdx + 1) + ' of ' + scenario.steps.length + ' — ' + step.title));

      stepWrap.textContent = '';
      var sec = el('section', 'step');

      var copy = el('div', 'step-copy');
      var h3 = el('h3');
      add(h3, el('span', 'step-n', 'STEP ' + (stepIdx + 1)));
      h3.appendChild(document.createTextNode(step.title));
      add(copy, h3);
      (step.narrative || []).forEach(function (p) { add(copy, html('p', null, p)); });
      if (step.youDo) {
        var yd = el('div', 'youdo');
        add(yd, el('div', 'youdo-k', 'YOU DO'), html('div', 'youdo-v', step.youDo));
        add(copy, yd);
      }
      if (step.claudeSays) {
        var cs = el('div', 'claudesays');
        add(cs, el('div', 'youdo-k cs-k', "CLAUDE'S MOVE"), html('div', 'youdo-v', step.claudeSays));
        add(copy, cs);
      }
      add(sec, copy);

      var screens = el('div', 'step-screens');
      if (step.terminal && step.terminal.length) {
        var t = Terminal(step.terminal);
        live.push(t);
        add(screens, t.el);
      }
      if (step.state) {
        add(screens, StatePanel(step.state).el);
      }
      if (step.source) {
        var cite = el('div', 'wt-cite');
        add(cite, el('span', 'wt-cite-k', 'MEASURED'), el('span', null, step.source));
        add(screens, cite);
      }
      add(sec, screens);
      add(stepWrap, sec);

      prevBtn.disabled = stepIdx === 0;
      nextBtn.disabled = last;
      nextBtn.textContent = last ? 'Walkthrough complete' : 'Next step →';
    }

    render();
    return { destroy: teardown };
  }

  /* --------------------------------------------------------------- mounts */

  function mountAll(root) {
    var scope = root || document;
    var nodes = scope.querySelectorAll('[data-wt]:not([data-wt-mounted])');
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var sc = REGISTRY[node.getAttribute('data-wt')];
      if (!sc) continue;
      node.setAttribute('data-wt-mounted', '1');
      renderScenario(node, sc, { embedded: true });
    }
  }

  /* The course players swap innerHTML on module change, so watch for new
     mount points rather than relying on a single pass at load. */
  var pending = null;
  function observe() {
    if (!global.MutationObserver || !document.body) return;
    new MutationObserver(function () {
      if (pending) return;
      pending = setTimeout(function () { pending = null; mountAll(); }, 60);
    }).observe(document.body, { childList: true, subtree: true });
  }

  /* Standalone quick-reference page: every scenario behind a tab. */
  function standalone(host, ids) {
    var list = (ids && ids.length ? ids : Object.keys(REGISTRY))
      .map(function (id) { return REGISTRY[id]; })
      .filter(Boolean);
    if (!list.length) return;

    host.textContent = '';
    var tabs = el('div', 'wt-tabs');
    var stage = el('div', 'wt-stage');
    add(host, tabs, stage);
    var current = null;

WT.register([{"id":"ce-orientation","badge":"WALKTHROUGH","color":"#4a6741","time":"~4 min","title":"The same sentence, twice","spec":"M00 · prompt engineering vs. context engineering, on one filing","intro":"One UCC-3 amendment and one instruction: <em>extract the debtor name as JSON</em>. Reword the instruction three times and it keeps failing. Leave the instruction untouched, build the counter around it, and it succeeds — which tells you where the lever actually is.","provenance":{"kind":"illustrative","source":"a narrated extraction of one UCC-3 amendment under two designs; token counts and prices are plausible inventions, not measurements"},"foot":"This is M00's <em>mise en place</em> in one call: the recipe card never changed, the counter did. The five layers it assembles are the ones the rest of the course takes apart.","steps":[{"title":"The starved window","narrative":["Filing <code>2024-FL-0024117</code> is a UCC-3 amendment. Its body is procedural: <em>AMENDMENT TO 2024-FL-0012345 — debtor name changed, see original filing.</em> The debtor name is not in this document. It is in the one it points at.","The window holds 680 tokens: a one-line instruction, the filing, the question. Nothing retrieves the original, nothing forbids guessing, nothing checks the answer. The model returns <code>NORTHBAY MARINE SUPPLY, INC.</code> — correctly capitalized, correctly punctuated, and invented."],"youDo":"Print the exact bytes you send on your worst-performing call and count the layers present. Most failing calls have one.","terminal":[{"kind":"prompt","text":"Extract the debtor name from this filing. Return JSON."},{"kind":"out","text":"FILING: 2024-FL-0024117  TYPE: UCC-3\nAMENDMENT TO: 2024-FL-0012345\nACTION: Debtor name changed. See original filing."},{"kind":"claude","text":"{\"debtor_name\": \"NORTHBAY MARINE SUPPLY, INC.\"}"},{"kind":"out-fail","text":"expected ACME LOGISTICS & DISTRIBUTION, L.L.C. — name fabricated, no source in window"}],"state":{"label":"attempt 1 · instruction only","before":{"title":"ONE LAYER, 680 TOKENS","view":{"type":"receipt","mode":"prompt only","question":"extract the debtor name from 2024-FL-0024117","layers":[{"label":"the instruction","tokens":40},{"label":"the filing","tokens":620},{"label":"the question","tokens":20}],"inputTotal":680,"output":60,"cost":"$0.0029","verdict":"failed","verdictNote":"a confident, well-formatted, wrong name — the failure mode that costs the least and hurts the most","highlight":["the instruction"]}}}},{"title":"Three rewrites, one failure","narrative":["Prompt engineering's move is to work the sentence. Add a role. Add step-by-step. Add an emphatic prohibition. Each rewrite is a real technique and each one is worth having — this course does not throw any of them away.","None of them recovers the name, because the name was never in the window. The third rewrite does change something: <code>if the name is not clearly present, return null</code> stops the fabrication. That is a genuine improvement and it is still not an answer. The instruction grew by 62 tokens and the bill moved by three hundredths of a cent."],"claudeSays":"Rewrite 3 stopped me guessing. It did not give me anything to guess from.","youDo":"Take your own most-rewritten prompt and ask what it is missing rather than what it should say. Grounding, state, a tool, or a constraint — one of the four is usually the real gap.","terminal":[{"kind":"prompt","text":"You are an expert UCC filing analyst. Extract the debtor name. Return JSON."},{"kind":"claude","text":"{\"debtor_name\": \"NORTHBAY MARINE SUPPLY, INC.\"}"},{"kind":"prompt","text":"Think step by step, then extract the debtor name. Return JSON."},{"kind":"claude","text":"{\"debtor_name\": \"NORTHBAY MARINE SUPPLY, INC.\"}"},{"kind":"prompt","text":"Never fabricate. If the debtor name is not clearly present, return null. Return JSON."},{"kind":"claude","text":"{\"debtor_name\": null}"},{"kind":"out-fail","text":"0/3 rewrites produced the debtor name · instruction 40 -> 102 tokens"}],"state":{"label":"attempt 2 · reworded, same window","before":{"title":"WHAT EACH REWRITE CHANGED","view":{"type":"rows","columns":["rewrite","technique","tokens added","result"],"rows":[{"cells":["1","expert role","+11","same fabricated name"],"tone":"bad"},{"cells":["2","step-by-step","+9","same fabricated name, with reasoning"],"tone":"bad"},{"cells":["3","never fabricate, prefer <code>null</code>","+42","<code>null</code> — honest, and still not the answer"],"tone":"bad"}]}},"after":{"title":"AFTER — the best rewrite","view":{"type":"receipt","mode":"prompt only, rewrite 3","question":"extract the debtor name from 2024-FL-0024117","layers":[{"label":"the instruction (reworded)","tokens":102},{"label":"the filing","tokens":620},{"label":"the question","tokens":20}],"inputTotal":742,"output":40,"cost":"$0.0028","verdict":"failed","verdictNote":"the failure mode improved and the capability did not — the referenced filing is still not in the window","highlight":["the instruction (reworded)"]}}}},{"title":"Same sentence, engineered counter","narrative":["Now put the original instruction back — the 40-token one from step 1, word for word — and build the mise en place around it. Extraction rules as a system block. The referenced filing <code>2024-FL-0012345</code>, retrieved because the amendment named it. The debtor's other active liens, from a tool call. A line saying who is asking.","3,520 tokens, and the answer is the filed name with its commas and its <code>L.L.C.</code> intact. The sentence that failed twice is doing the work now, because it finally has something to work on. That is the whole claim of the course, and it is worth about a cent a call."],"claudeSays":"The name came from the retrieved original filing, not from me. I can cite the filing number it came out of.","youDo":"Add exactly one missing layer to your own failing call — the smallest one — and re-run before you add a second.","terminal":[{"kind":"tool","text": g moved 2,840 tokens and moved the outcome.","This is measurable outside this page. The <a href=\"../../ultimate-context-eng/course/index.html\">successor course</a> grades ten strategies over ten questions: on a question whose answer had been redacted, its <code>naive</code> arm fabricated a date of birth at 1,686 input tokens and was graded FAILED, while the arm that had the one canonical file in the window refused correctly at 157. Fabrication is not a wording defect. It is an empty-window defect.","One caution before you start bolting layers onto everything, because M02 will make it explicit: more layers is not the lesson. The right layers is. A self-contained question that needs no grounding gets nothing from retrieval except a bill."],"youDo":"Open <code>labs/M00/</code>, run the sandbox's three sample calls, and map every token in each to one of the five layers before you write any code of your own.","state":{"label":"three attempts, one filing","before":{"title":"INPUT TOKENS PER CALL","view":{"type":"bars","unit":"tokens","max":3520,"items":[{"label":"instruction only","value":680,"tone":"bad","note":"fabricated a debtor name"},{"label":"instruction reworded 3x","value":742,"tone":"bad","note":"stopped fabricating, still no answer"},{"label":"same instruction, five layers","value":3520,"tone":"win","note":"correct name, cited to 2024-FL-0012345"}]}},"after":{"title":"THE SHIFT","view":{"type":"note","text":"Prompt engineering optimizes the recipe card; context engineering designs the counter. The card still matters &mdash; every rewrite in step 2 is a technique you keep &mdash; but it is layer 1 of five, and no wording recovers a fact that is not in the window. What you are learning to control for the next 32 modules is which tokens are on the counter, where they sit, what they cost, and who is allowed to write them."}}}}]},{"id":"ce-assemble-window","badge":"WALKTHROUGH","color":"#4a6741","time":"~5 min","title":"Assembling a 200K window","spec":"M01 · tokens, positions, attention","intro":"One risk question about one UCC filing. Watch the window fill layer by layer — and watch the last step prove that where a fact sits matters as much as how many tokens it cost.","provenance":{"kind":"illustrative","source":"a narrated assembly of one lien-risk turn; every token count is a plausible invention, not a measurement"},"foot":"The mechanics under this walkthrough are M01 — <em>The Token Is the Atom</em> and <em>Position, Attention, and the Shape of the Window</em>.","steps":[{"title":"The ceiling is not the budget","narrative":["Before you put anything in the window, look at what you are actually working with. The model advertises 200,000 tokens, and that number is a <b>hard ceiling</b> — the point at which the API rejects your call — not a working budget you can spend freely.","Nothing is in the window yet. Every token you add from here competes with every other token for the model's attention, and the compute to relate them all grows with the <em>square</em> of the length."],"youDo":"Open the model card for whatever you are building on and write down two numbers: the advertised window, and the largest prompt you have ever actually sent it.","terminal":[{"kind":"prompt","text":"before I ask anything — how much room do I actually have?"},{"kind":"tool","text":"models.retrieve(\"claude-sonnet-4-6\")"},{"kind":"out","text":"context_window: 200000 tokens   max_output: 64000 tokens"},{"kind":"claude","text":"That 200,000 is the point where the call fails, not the point where\nquality does. Quality starts sliding long before it."}],"state":{"label":"context window · empty","before":{"title":"AN EMPTY WINDOW","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":0},{"label":"tool defs","tokens":0},{"label":"retrieved filings","tokens":0},{"label":"history","tokens":0},{"label":"your turn","tokens":0}],"note":"Five layers, all empty. Every one of them is a design decision you are about to make, whether you notice or not."}}}},{"title":"Layer 1 — the system prompt","narrative":["The first thing in is the system prompt: the analyst persona, the scoring rules, and four worked examples of a UCC-1 read correctly. It is 2,400 tokens and it will be identical on every call you make today.","This layer earns its place — the rules are what stop the model inventing a risk grade. But notice what it already is: <b>1.2% of the ceiling, spent before the user has said a word</b>."],"claudeSays":"The examples are the expensive part. Four worked filings cost more than the rules they illustrate — and they are also the part you will most want to cache later.","terminal":[{"kind":"tool","text":"count_tokens(system=SYSTEM)"},{"kind":"out","text":"rules ............ 610\nfour examples .... 1,790\nsystem total ..... 2,400 tokens"}],"state":{"label":"context window · + system","before":{"title":"BEFORE — empty","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":0},{"label":"tool defs","tokens":0},{"label":"retrieved filings","tokens":0},{"label":"history","tokens":0},{"label":"your turn","tokens":0}]}},"after":{"title":"AFTER — rules and examples loaded","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":0},{"label":"retrieved filings","tokens":0},{"label":"history","tokens":0},{"label":"your turn","tokens":0}],"highlight":["system"],"note":"2,400 tokens · 1% of the ceiling. Stable across every call today, which is exactly what makes it cacheable in M19."}}}},{"title":"Layer 2 — the tool definitions","narrative":["Next come the tools the agent may call: <code>search_filings</code>, <code>fetch_filing</code>, <code>lookup_debtor</code>, <code>fetch_amendments</code>, <code>score_risk</code>, <code>write_memo</code>. Six JSON schemas, 1,900 tokens.","Tool definitions tokenize badly. Braces, quotes, and snake_case field names shatter into fragments in a way English prose does not — six small schemas cost nearly as much as the whole system prompt."],"youDo":"Run <code>count_tokens</code> on your own tool array. Most people are surprised by a factor of two.","terminal":[{"kind":"tool","text":"count_tokens(tools=TOOLS)"},{"kind":"out","text":"6 tools · 1,900 tokens\nlargest: fetch_amendments (520) — nested filter object"},{"kind":"claude","text":"Every tool is in the window on every call, whether or not this turn\nhas any use for it. That is a fixed tax, not a per-use cost."}],"state":{"label":"context window · + tool defs","before":{"title":"BEFORE — system only","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":0},{"label":"retrieved filings","tokens":0},{"label":"history","tokens":0},{"label":"your turn","tokens":0}]}},"after":{"title":"AFTER — six schemas in","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"retrieved filings","tokens":0},{"label":"history","tokens":0},{"label":"your turn","tokens":0}],"highlight":["tool defs"],"note":"4,300 tokens and the conversation has not started. This is the floor of every single call in the pipeline."}}}},{"title":"Layer 3 — twelve filings, and the tokenizer's revenge","narrative":["Retrieval pulls the twelve filings on record for <b>ACME LOGISTICS &amp; DISTRIBUTION, L.L.C.</b> You budgeted four pages each at roughly 900 tokens — call it 11,000 for the set. The real number is 31,200.","The gap is the tokenizer. <code>ACME LOGISTICS &amp; DISTRIBUTION, L.L.C.</code> is four words to you and nine or ten pieces to the model: the all-caps, the ampersand, and the dotted <code>L.L.C.</code> each fragment. A filing ID like <code>2024-FL-0012345</code> can split almost digit by digit.","Toggle <b>Before / After</b>. One retrieval step just consumed seven times the floor."],"youDo":"Take one real record from your own domain, count its words, then count its tokens. Divide. Anything above 1.5 means your page-based estimates are wrong.","terminal":[{"kind":"tool","text":"search_filings(debtor=\"ACME LOGISTICS & DISTRIBUTION, L.L.C.\")"},{"kind":"out","text":"12 filings · 5 active · 7 terminated"},{"kind":"tool","text":"count_tokens(retrieved)"},{"kind":"out","text":"words:  9,140\ntokens: 31,200\ntokens/word: 3.41   <- caps, punctuation, and IDs"}],"state":{"label":"context window · + retrieval","before":{"title":"BEFORE — the fixed floor","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"retrieved filings","tokens":0},{"label":"history","tokens":0},{"label":"your turn","tokens":0}],"note":"4,300 tokens. You estimated the twelve filings would add about 11,000."}},"after":{"title":"AFTER — the filings, as the model counts them","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"retrieved filings","tokens":31200},{"label":"history","tokens":0},{"label":"your turn","tokens":0}],"highlight":["retrieved filings"],"note":"35,500 tokens — nearly 3x the estimate. Pages are not a unit. Tokens are the only unit that budgets, prices, or truncates."}}}},{"title":"Layer 4 — the history, and finally the question","narrative":["Nine turns of prior conversation go in: two clarifications, three tool results the agent already summarized, and the analyst's earlier instruction to score only from verified records. That is 8,600 tokens of transcript.","Then the actual question — <em>is ACME's 2019 equipment lien still perfected?</em> — costs 90 tokens. The thing you want an answer to is <b>0.2% of the window</b>; the other 99.8% is setup."],"claudeSays":"The window is now 22% full and I have not thought about the question yet. Everything so far is furniture.","terminal":[{"kind":"prompt","text":"is ACME's 2019 equipment lien still perfected? cite the filing."},{"kind":"tool","text":"count_tokens(messages=history + [turn])"},{"kind":"out","text":"history .... 8,600\nyour turn ..    90\nwindow ..... 44,190 / 200,000  (22%)"}],"state":{"label":"context window · assembled","before":{"title":"BEFORE — system, tools, filings","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"retrieved filings","tokens":31200},{"label":"history","tokens":0},{"label":"your turn","tokens":0}]}},"after":{"title":"AFTER — the complete turn","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"retrieved filings","tokens":31200},{"label":"history","tokens":8600},{"label":"your turn","tokens":90}],"highlight":["history","your turn"],"note":"44,190 tokens. Room to spare against the ceiling — which is exactly why the next step is the one that matters."}}}},{"title":"Same tokens, different answer","narrative":["The amendment that resolves the question — the 2021 continuation statement on <code>2024-FL-0012345</code> — is filing seven of twelve, sitting dead centre of the largest block in the window. The model attends to it in competition with 31,000 neighbouring tokens.","Move that one filing to the end, immediately before the question. <b>The token count does not change at all.</b> The answer does. That is positional encoding and diluted attention doing their work, and it is why 44,190 tokens is not a single number but an arrangement.","More context is also not more correctness. The <a href=\"../../ultimate-context-eng/course/index.html\">successor course</a> measures a naive 1,686-token context <em>fabricating</em> a debtor's date of birth on a question it should have refused, while a 157-token curated context correctly declined to answer."],"youDo":"Take a prompt that failed on you, move the decisive document to the very end without changing anything else, and re-run it.","terminal":[{"kind":"prompt","text":"same 44,190 tokens — reorder so the continuation statement is last"},{"kind":"out-fail","text":"run A (amendment at position 7/12): \"no continuation on record; the lien lapsed in 2024\""},{"kind":"out-pass","text":"run B (amendment last, adjacent to the question): \"perfected — continuation filed 2021-03-14, cite 2024-FL-0012345\""}],"state":{"label":"44,190 tokens, two arrangements","before":{"title":"BEFORE — buried in the middle","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"retrieved filings","tokens":31200},{"label":"history","tokens":8600},{"label":"your turn","tokens":90}],"highlight":["retrieved filings"],"note":"The decisive filing is #7 of 12 inside the highlighted block — the most crowded, least attended stretch of the window."}},"after":{"title":"AFTER — position, not size, is the variable","view":{"type":"rows","columns":["arrangement","tokens","attention neighbours","answer"],"rows":[{"cells":["amendment at 7 of 12 (middle)","44,190","~31,000 competing tokens","wrong — reported the lien lapsed"],"tone":"bad"},{"cells":["amendment last, next to the question","44,190","~90 competing tokens","correct, with the citation"],"tone":"win"},{"cells":["amendment first, before the rules","44,190","~43,000 after it","correct, but ignored the scoring rules"]}]}}}}]},{"id":"ce-paradigm-shift","badge":"WALKTHROUGH","color":"#4a6741","time":"~4 min","title":"Two edits, one batch","spec":"M02 · where the leverage moved","intro":"Five filings, one fixed extraction prompt, two failures. One engineer edits the instruction string; the other edits the assembly step. Both diffs are small. Only one of them moves the pass rate — and the last step shows the same reflex applied where it loses money.","provenance":{"kind":"illustrative","source":"a narrated five-filing extraction batch under two competing edits; token counts and prices are plausible inventions, not measurements"},"foot":"This walks M02's <em>Where Prompt-Only Breaks</em> — grounding, memory, tools, governance — and then its counterweight, layer maximalism.","steps":[{"title":"The batch, and which layer each failure is missing","narrative":["One prompt — <em>extract the debtor name as JSON</em> — run across five filings. Three pass. The UCC-3 amendment invents a debtor because the original filing it points at was never retrieved. The redacted filing returns a different JSON shape on every run.","Classify the failures by <b>what is absent</b>, not by what the prompt says. Amendment: no grounding. Redacted: no governance. Neither cell in that table has a wording fix in it."],"youDo":"Run your own fixed prompt over a batch that includes your ugliest inputs, and label each failure grounding / memory / tool / governance before you touch the prompt.","terminal":[{"kind":"tool","text":"for f in batch: extract(f, prompt=PROMPT_V1)"},{"kind":"out","text":"2024-FL-0012345  UCC-1  clean            -> ACME LOGISTICS & DISTRIBUTION, L.L.C."},{"kind":"out","text":"2024-FL-0021077  UCC-1  84-char name     -> NORTHBAY MARINE SUPPLY INC ... (flagged)"},{"kind":"out","text":"2024-TX-0004410  UCC-1  non-English      -> COMERCIALIZADORA DEL NORTE S.A. DE C.V."},{"kind":"out-fail","text":"2024-FL-0024117  UCC-3  amendment        -> \"NORTHBAY MARINE SUPPLY, INC.\"  FABRICATED"},{"kind":"out-fail","text":"2024-FL-0030291  UCC-1  redacted debtor  -> shape drifts across runs: null / \"\" / \"REDACTED\""},{"kind":"out","text":"3/5 correct · 2,180 input tokens per call"}],"state":{"label":"baseline · PROMPT_V1","before":{"title":"FIVE FILINGS, ONE PROMPT","view":{"type":"rows","columns":["filing","outcome","missing layer","would rewording fix it?"],"rows":[{"cells":["<code>2024-FL-0012345</code> clean UCC-1","correct","&mdash;","n/a"]},{"cells":["<code>2024-FL-0021077</code> 84-char name","correct, flagged","&mdash;","n/a"]},{"cells":["<code>2024-TX-0004410</code> non-English party","correct","&mdash;","n/a"]},{"cells":["<code>2024-FL-0024117</code> UCC-3 amendment","fabricated a name","grounding &mdash; the original filing","no"],"tone":"bad"},{"cells":["<code>2024-FL-0030291</code> redacted debtor","3 shapes in 3 runs","governance &mdash; no output contract","no"],"tone":"bad"}]}}}},{"title":"Edit A — work the sentence","narrative":["The first engineer opens the prompt file. Role added, emphasis added, an explicit rule about amendments added. It is a careful edit and it reads better than what it replaced.","It moves 34 tokens. Re-run the batch: still 3/5. The amendment case now <em>knows</em> that the name may live in an original filing, and still cannot reach it. Telling a model about a document is not the same as putting the document in the window."],"claudeSays":"The new rule told me where the name lives. I have no way to open that filing from here, so I filled the field the only way left.","terminal":[{"kind":"tool","text":"git diff prompts/extract.py | head -8"},{"kind":"tool","text":"for f in batch: extract(f, prompt=PROMPT_V2)"},{"kind":"out-fail","text":"2024-FL-0024117 -> \"NORTHBAY MARINE SUPPLY, INC.\"  still fabricated"},{"kind":"out","text":"3/5 correct · 2,214 input tokens per call  (+34)"}],"state":{"label":"edit A · the instruction string","before":{"title":"THE DIFF — prompts/extract.py","view":{"type":"diff","file":"prompts/extract.py","lines":[["p","PROMPT = ("],["m","    \"Extract the debtor name as JSON.\\n\""],["a","    \"You are an expert UCC Secretary-of-State filing analyst.\\n\""],["a","    \"Extract the debtor name as JSON. Be precise and NEVER guess.\\n\""],["a","    \"Note: UCC-3 amendments reference an original filing where the\\n\""],["a","    \"name may appear.\\n\""],["p",")"]]}},"after":{"title":"AFTER — re-run","view":{"type":"receipt","mode":"PROMPT_V2","question":"extract the debtor name from 2024-FL-0024117","layers":[{"label":"system rules (reworded)","tokens":1234},{"label":"this filing","tokens":900},{"label":"the question","tokens":80}],"inputTotal":2214,"output":70,"cost":"$0.0077","verdict":"failed","verdictNote":"3/5, unchanged &mdash; 34 tokens of better wording against a missing document","highlight":["system rules (reworded)"]}}}},{"title":"Edit B — work the assembly","narrative":["The second engineer never opens the prompt file. <code>PROMPT_V1</code> ships unchanged. The edit is four lines in the assembly step: if the filing is a UCC-3 and names an original, fetch it and put it in the window under its own heading.","That moves 1,180 tokens — the retrieved original filing — and the amendment resolves to <code>ACME LOGISTICS &amp; DISTRIBUTION, L.L.C.</code> with a citation. A JSON-schema constraint on the same call fixes the redacted case. 5/5, at 3,360 tokens and just over a cent."],"claudeSays":"The name came out of the retrieved original. Nothing about how I was asked changed between the failing run and this one.","youDo":"Diff the two edits by the question &quot;how many tokens did this move?&quot; A prompt rewrite moves tens. An assembly change moves thousands. Leverage follows the tokens.","terminal":[{"kind":"tool","text":"git diff pipeline/assemble.py"},{"kind":"out","text":"+ if filing.type == \"UCC-3\" and filing.amends:\n+     original = retrieve_filing(filing.amends)\n+     blocks.append(f\"<original_filing>{original.text}</original_filing>\")"},{"kind":"tool","text":"for f in batch: extract(f, prompt=PROMPT_V1, schema=DebtorOut)"},{"kind":"out-pass","text":"2024-FL-0024117 -> ACME LOGISTICS & DISTRIBUTION, L.L.C.  (src 2024-FL-0012345)"},{"kind":"out-pass","text":"2024-FL-0030291 -> null, flags [\"redacted\"] — same shape 3/3 runs"},{"kind":"out-pass","text":"5/5 correct · 3,360 input tokens per call  (+1,180)"}],"state":{"label":"edit B · the assembly step","before":{"title":"BEFORE — PROMPT_V1, no retrieval","view":{"type":"receipt","mode":"PROMPT_V1","question":"extract the debtor name from 2024-FL-0024117","layers":[{"label":"system rules","tokens":1200},{"label":"this filing","tokens":900},{"label":"the question","tokens":80}],"inputTotal":2180,"output":70,"cost":"$0.0076","verdict":"failed"}},"after":{"title":"AFTER — PROMPT_V1, plus the referenced filing","view":{"type":"receipt","mode":"PROMPT_V1 + retrieval","question":"extract the debtor name from 2024-FL-0024117","layers":[{"label":"system rules (unchanged)","tokens":1200},{"label":"this filing","tokens":900},{"label":"the referenced original, retrieved","tokens":1180},{"label":"the question","tokens":80}],"inputTotal":3360,"output":95,"cost":"$0.0115","verdict":"verified","verdictNote":"5/5 &mdash; the prompt file was never opened","highlight":["the referenced original, retrieved"]}}}},{"title":"Two diffs, and the edit that goes the wrong way","narrative":["Side by side: 34 tokens for no change in pass rate, 1,180 tokens for +2. That ratio is the paradigm shift in one number, and it is why the discipline renamed itself.","Now the inverse mistake, because it is the same reflex pointed at the wrong problem. The help button answers <em>&quot;what is a UCC-1?&quot;</em> from a 90-token prompt, correctly, every time. Someone adds retrieval, tool defs and session memory &quot;to be safe&quot;: 4,130 input tokens for the identical sentence back — 46x the input for zero reliability gain, on a task that was never missing a layer.","Both halves are the same skill. Ask which layer is missing; add exactly that one; and when the honest answer is <em>none</em>, ship the prompt."],"youDo":"For every layer in your current pipeline, name the failure it prevents. Any layer you cannot attach a failure to is dilution you are paying for.","state":{"label":"leverage, both directions","before":{"title":"TOKENS MOVED BY EACH EDIT","view":{"type":"bars","unit":"tokens moved","max":1180,"items":[{"label":"edit A — reword the prompt","value":34,"tone":"bad","note":"pass rate 3/5 -> 3/5"},{"label":"edit B — retrieve the referenced filing","value":1180,"tone":"win","note":"pass rate 3/5 -> 5/5"}]}},"after":{"title":"AFTER — the same reflex, misapplied","view":{"type":"stack","views":[{"type":"rows","columns":["help-button build","input tokens","cost / call","answer"],"rows":[{"cells":["plain prompt","90","$0.0021","correct, every run"],"tone":"win"},{"cells":["+ retrieval + tool defs + memory","4,130","$0.0142","correct, identical text"],"tone":"bad"}]},{"type":"note","text":"46x the input tokens and 6.8x the cost to return the same sentence. Layer maximalism is the mirror image of prompt whack-a-mole and it bills you for the privilege. The judgment M02 is teaching is not &quot;add layers&quot; &mdash; it is <b>add the missing one, and be able to name it</b>."}]}}}}]},{"id":"ce-economics","badge":"WALKTHROUGH","color":"#4a6741","time":"~4 min","title":"6,000 tokens, five claimants","spec":"M03 · budgeting one risk call, layer by layer","intro":"One lien-risk request, a 6,000-token working budget, and five layers that want 7,150 between them. Watch what each layer costs per day, which one gets cut first, and why the call that fits is still not the call you want.","provenance":{"kind":"illustrative","source":"a narrated lien-risk call against a fixed working budget; token counts, accuracies and prices are plausible inventions, not measurements"},"foot":"The allocator here is M03's <em>Budget</em> class — a ceiling, per-layer caps, and a priority order that evicts the lowest-value layer first.","steps":[{"title":"The request overruns the ceiling","narrative":["An analyst asks for a lien-risk score on <code>ACME LOGISTICS &amp; DISTRIBUTION, L.L.C.</code>. The window is 200K, but the working budget for this endpoint is 6,000 tokens — a ceiling the team chose, not one the model imposed, because the knee of the quality curve sits well below the ceiling of the bag.","Measure what each layer actually wants: extraction rules 1,200, analyst profile 150, the filing text 2,500, debtor history 1,500, the session so far 1,800. That is 7,150 tokens against a 6,000 budget. Nothing has gone wrong yet — this is what a normal call looks like before anyone allocates."],"youDo":"Instrument your own call to report tokens per layer, not tokens per request. You cannot allocate a number you have never broken down.","terminal":[{"kind":"prompt","text":"score lien risk for ACME LOGISTICS & DISTRIBUTION, L.L.C."},{"kind":"tool","text":"count_tokens_by_layer(request)"},{"kind":"out","text":"system 1200 · user 150 · retrieval 2500 · tool 1500 · conversation 1800"},{"kind":"gate","text":"⚠ 7,150 tokens against a 6,000 ceiling — over by 1,150"}],"state":{"label":"measured · before allocation","before":{"title":"WHAT THE FIVE LAYERS ASKED FOR","view":{"type":"window","label":"6,000-token working budget","capacity":6000,"layers":[{"label":"system rules","tokens":1200},{"label":"analyst profile","tokens":150},{"label":"filing text","tokens":2500},{"label":"debtor history","tokens":1500},{"label":"conversation","tokens":1800}],"highlight":["conversation"],"note":"7,150 tokens · 119% of the budget. The overflow is 1,150 tokens and something has to give — the only question is whether you choose it or the truncation does."}}}},{"title":"What each layer costs and what it buys","narrative":["At $3 per million input tokens and 40,000 risk calls a day, every 1,000 tokens of layer is about $120 a day, forever. That is the sentence that reframes a system prompt: it is not a one-time write, it is a standing order.","Price the layers and the ranking stops being a matter of taste. The filing text is the single most expensive block at $300 a day — and it is also the one thing the answer cannot be produced without. The conversation history is $216 a day to carry a session the model mostly does not need to re-read."],"claudeSays":"Two of these five layers are load-bearing for this specific question. The other three are convenience, insurance, and habit.","youDo":"Multiply each layer's token count by your daily call volume and by your input rate. Do it before the review meeting; the table usually ends the argument.","terminal":[{"kind":"tool","text":"usage.project(tokens_by_layer, calls_per_day=40_000, rate_in=3.00)"},{"kind":"out","text":"system        1,200 tok   48.0M/day   $144/day\nuser            150 tok    6.0M/day    $18/day\nretrieval     2,500 tok  100.0M/day   $300/day\ntool          1,500 tok   60.0M/day   $180/day\nconversation  1,800 tok   72.0M/day   $216/day"},{"kind":"out","text":"input $858/day · output 260 tok/call $156/day · total $1,014/day"}],"state":{"label":"$3/M input · 40,000 calls/day","before":{"title":"THE BILL, BY LAYER","view":{"type":"rows","columns":["layer","tokens / call","$ / day","what those tokens buy"],"rows":[{"cells":["system rules","1,200","$144","the scoring policy — stable, and therefore cacheable (M19)"]},{"cells":["analyst profile","150","$18","seniority and desk, which set the report's depth"]},{"cells":["filing text","2,500","$300","the collateral and secured party the score is computed from"],"tone":"win"},{"cells":["debtor history","1,500","$180","the prior-lien stack — the other half of the score"],"tone":"win"},{"cells":["conversation","1,800","$216","turns 1-9 of a session whose live question is in turn 10"],"tone":"bad"}]}}}},{"title":"The first thing to cut","narrative":["The allocator does not cut the biggest layer. It cuts the lowest-priority one: <code>conversation</code> before <code>tool</code>, <code>tool</code> before <code>retrieval</code>, and <code>system</code> last, because the rules are what keep every other layer interpretable.","1,150 tokens come off the history — the oldest turns, not the newest — and the call lands at exactly 6,000. Same answer, $876 a day instead of $1,014. Note what did <em>not</em> happen: the filing text, the most expensive block on the page, was never a candidate. Cost per token is not the same as value per token, and only one of them decides eviction order."],"claudeSays":"I lost turns 1 through 6 of the session. The question in turn 10 does not refer to them, which is why they were first in the priority list.","youDo":"Write down your own eviction order before you need it. Deciding under an overflow, at request time, is how the filing text gets truncated.","terminal":[{"kind":"tool","text":"Budget(ceiling=6000).allocate(measured)"},{"kind":"out","text":"6000 tokens, fits: True\n - trimmed 1150 tokens from 'conversation'"},{"kind":"out-pass","text":"risk HIGH · 5 active liens · same verdict as the untrimmed call"},{"kind":"out","text":"$1,014/day -> $876/day"}],"state":{"label":"allocation · priority eviction","before":{"title":"BEFORE — 7,150, over budget","view":{"type":"window","label":"6,000-token working budget","capacity":6000,"layers":[{"label":"system rules","tokens":1200},{"label":"analyst profile","tokens":150},{"label":"filing text","tokens":2500},{"label":"debtor history","tokens":1500},{"label":"conversation","tokens":1800}]}},"after":{"title":"AFTER — 6,000, allocated","view":{"type":"window","label":"6,000-token working budget","capacity":6000,"layers":[{"label":"system rules","tokens":1200},{"label":"analyst profile","tokens":150},{"label":"filing text","tokens":2500},{"label":"debtor history","tokens":1500},{"label":"conversation (trimmed)","tokens":650}],"highlight":["conversation (trimmed)"],"note":"6,000 tokens · exactly at budget. The lowest-priority layer absorbed the whole overflow; the two layers the score is computed from were never touched."}}}},{"title":"Aim at the knee, not the ceiling","narrative":["Fitting the budget is not the same as spending it well. Vary one thing — how many prior filings ride in the <code>tool</code> layer, at about 300 tokens each — and the accuracy curve rises, plateaus, then falls.","Three filings is the knee: 5,400 tokens, and the best score on the board. Forty-seven filings is 18,600 tokens and a <em>worse</em> score, because the three that mattered are now buried in the crowded middle among forty-four that do not. The prior-filings block alone goes up 15x; the whole call goes up 3.4x; accuracy goes down. That is the worst quadrant — more money and less quality — and it is the default outcome of treating the window as a bucket.","So the shipped call is not the one that fills 6,000 tokens. It is the 5,400-token one, two cents each, that sits at the knee with 600 tokens of headroom left deliberately unspent."],"youDo":"Sweep one layer's size across five settings, score correctness at each, and mark where your own curve turns over. Then budget to that point, not to the ceiling.","terminal":[{"kind":"tool","text":"sweep(prior_filings=[0, 1, 3, 8, 20, 47], task=\"lien_risk\")"},{"kind":"out","text":"  0 filings   4,500 tok   78%\n  1 filing    4,800 tok   86%\n  3 filings   5,400 tok   91%   <- knee\n  8 filings   6,900 tok   90%\n 20 filings  10,500 tok   88%\n 47 filings  18,600 tok   84%"},{"kind":"out-pass","text":"shipped: 3 prior filings · 5,400 tok · $0.0201/call · 91%"}],"state":{"label":"the quality x quantity curve","before":{"title":"INPUT TOKENS PER CALL, BY PRIOR-FILING COUNT","view":{"type":"bars","unit":"tokens","max":18600,"items":[{"label":"0 filings","value":4500,"tone":"bad","note":"78% — the lien stack is genuinely missing"},{"label":"1 filing","value":4800,"note":"86% — most of the gain arrives immediately"},{"label":"3 filings","value":5400,"tone":"win","note":"91% — the knee, and 600 tokens under budget"},{"label":"8 filings","value":6900,"note":"90% — plateau; you are paying for nothing"},{"label":"20 filings","value":10500,"note":"88% — dilution starts winning"},{"label":"47 filings","value":18600,"tone":"bad","note":"84% — 3.4x the bill for 7 points of accuracy lost"}]}},"after":{"title":"THE RULE","view":{"type":"note","text":"Every token bills you three times &mdash; money, latency, and attention &mdash; and only the first one shows up on the invoice. A budget is not a target to hit; it is a limit you should usually finish under. Allocate by value, evict by priority, and aim at the knee: &quot;maximum context&quot; is almost never &quot;maximum quality&quot;, and a bigger window buys you a longer runway into the same mistake."}}}}]},{"id":"ce-system-prompt","badge":"WALKTHROUGH","color":"#8b5e3c","time":"~4 min","title":"Same handbook, reshelved","spec":"M04 · sections, order, and the data boundary","intro":"One UCC extraction system prompt, 2,180 tokens, six sections. Shuffle nothing but their order and the model fabricates a debtor name. Put them back in priority order — same words, same bill — and it returns <code>null</code> with a flag.","provenance":{"kind":"illustrative","source":"a narrated re-architecture of one UCC extraction system prompt; token counts and prices are plausible inventions, not measurements"},"foot":"The ordering here is M04's <em>Order Is Meaning</em> — identity and hard constraints at the top, bulk reference in the middle, the live task and its data fenced at the bottom.","steps":[{"title":"Take a census of the blob","narrative":["The prompt in production is one 2,180-token string with no headings. Before changing a word, label every line by which of the six slots it belongs to: role, objective, rules, capabilities, output contract, examples — and note that the filing itself has been pasted in among them.","The census is the whole trick. &quot;Write a better prompt&quot; is an intimidating, unfalsifiable task. &quot;Six named sections, each in the right place, with a boundary around the untrusted one&quot; is an engineering task you can finish and check."],"youDo":"Print your own system prompt with line numbers and tag each line with one of the six slot names. Anything you cannot tag is either dead text or a seventh thing you did not know was in there.","terminal":[{"kind":"tool","text":"python tools/section_census.py prompts/ucc_extract_syste
