either of those things. Position decided the first and duplication decided the second."],"youDo":"Dump your assembled context to a file and read it as a document. Every contradiction and every repeated fact you can spot by eye is one the model is also resolving by accident.","terminal":[{"kind":"prompt","text":"total secured exposure for ACME LOGISTICS & DISTRIBUTION, L.L.C.?"},{"kind":"tool","text":"ctx = retrieval_chunks + tool_result + session_memory + user_msg   # arrival order"},{"kind":"out","text":"11 items · 2,640 tokens · 0 provenance tags"},{"kind":"claude","text":"ACME has 2 active liens totalling $1,675,000. The 2024 Redline lien is confirmed by three independent sources."},{"kind":"out-fail","text":"understated by $340,000 — 2022-FL-0044120 dropped as terminated"},{"kind":"out-fail","text":"\"three independent sources\" = one registry record, echoed three times"}],"state":{"label":"naive concatenation · 11 items","before":{"title":"THE WINDOW, IN ARRIVAL ORDER","view":{"type":"rows","columns":["#","item","from","problem"],"rows":[{"cells":["1","<code>2024-FL-0012345</code> active · First Capital · $1,200,000","tool","&mdash;"]},{"cells":["2","<code>2024-FL-0019988</code> active · Redline · $475,000","tool","&mdash;"]},{"cells":["3","<code>2022-FL-0044120</code> <b>active</b> · Harbor Point · $340,000","tool","contradicted at #7"],"tone":"bad"},{"cells":["4","<code>2024-FL-0019988</code> &mdash; &quot;confirms 2024 lien&quot;","retrieval","duplicate of #2"],"tone":"bad"},{"cells":["5-6","two collateral chunks","retrieval","&mdash;"]},{"cells":["7","<code>2022-FL-0044120</code> <b>terminated</b> (UCC-3 filed 2026-05-28)","retrieval","contradicts #3, and arrives later"],"tone":"bad"},{"cells":["8","&quot;Redline lien noted earlier this session&quot;","session memory","duplicate of #2"],"tone":"bad"},{"cells":["9-10","two terminated 2019 filings","retrieval","irrelevant to exposure"]},{"cells":["11","the analyst's question","user","&mdash;"]}]}}}},{"title":"The duplicate that voted three times","narrative":["Dedupe first, because it is cheap and it changes what the model believes. Normalise each item to the fact it asserts &mdash; here <code>lien:2024-FL-0019988</code> &mdash; and keep exactly one copy, the best-attributed: highest trust tier, then newest.","Three items collapse to one. That is 630 tokens down to 210, which is the boring half of the win. The interesting half is that the surviving line is now <em>one</em> claim with <em>one</em> provenance tag, and the model stops describing it as corroborated.","This is false amplification and it is specific to fusion. Any single source repeated is still one source, but a window containing the same sentence three times reads exactly like a window containing three agreeing witnesses &mdash; and the model has no way to tell those apart unless you tell it."],"claudeSays":"I saw the Redline lien asserted three times and reported it as multiply confirmed. All three trace to registry record 2024-FL-0019988, fetched once.","terminal":[{"kind":"tool","text":"items = dedupe(items, key=lambda it: it.fact)   # keep max((trust, ts))"},{"kind":"out","text":"lien:2024-FL-0019988   3 copies -> 1\n  kept   [tool      | 2026-08-28 | trust=3]\n  merged [retrieval | 2026-06-14 | trust=2]\n  merged [memory    | 2026-08-28 | trust=1]"},{"kind":"out-pass","text":"11 items -> 8 · 2,640 -> 2,010 tokens"},{"kind":"claude","text":"One active lien held by Redline Freight Capital LLC, per registry record 2024-FL-0019988."}],"state":{"label":"dedupe by normalized fact","before":{"title":"BEFORE — one record, three voices","view":{"type":"rows","columns":["source","trust","as of","text"],"rows":[{"cells":["tool","3","2026-08-28","<code>2024-FL-0019988</code> active, Redline, $475,000"]},{"cells":["retrieval","2","2026-06-14","&quot;Filing 2024-FL-0019988 confirms 2024 lien&quot;"],"tone":"bad"},{"cells":["session memory","1","2026-08-28","&quot;Redline lien noted earlier this session&quot;"],"tone":"bad"},{"cells":["model reads it as","&mdash;","&mdash;","three independent confirmations &mdash; 630 tokens"],"tone":"bad"}]}},"after":{"title":"AFTER — one claim, one citation","view":{"type":"rows","columns":["source","trust","as of","text"],"rows":[{"cells":["tool (state registry)","3","2026-08-28","<code>2024-FL-0019988</code> active, Redline, $475,000"],"tone":"win","new":true},{"cells":["merged","&mdash;","&mdash;","2 lower-trust echoes of the same record, dropped"]},{"cells":["model reads it as","&mdash;","&mdash;","one registry record &mdash; 210 tokens"],"tone":"win"}]}}}},{"title":"The contradiction that must be decided","narrative":["Now the one that matters. Two sources make incompatible claims about <code>2022-FL-0044120</code>, and both of them are honest. The corpus snapshot was indexed 2026-06-14 and contains a UCC-3 termination filed 2026-05-28 &mdash; so retrieval is correctly reporting what the document store holds. The live registry, queried today, shows that termination <em>withdrawn</em> on 2026-07-11, three weeks after the snapshot.","Resolve on trust first, freshness second: the state registry is the authoritative tier and it is also newer, so it wins on both axes. Harbor Point's $340,000 goes back into the exposure and the total becomes $2,015,000.","But do not stop at picking a winner. The loser is not noise &mdash; it is evidence that the document corpus is eleven weeks stale on this debtor, and a withdrawn termination is exactly the pattern a credit committee wants to see rather than have quietly reconciled. Fusion emits the winning value <b>and</b> a conflict record carrying both provenances, and routes the call to human review."],"youDo":"Make your fuser return <code>{context, conflicts}</code>, not just <code>context</code>. If <code>conflicts</code> is always empty, you are not detecting disagreement, you are overwriting it.","terminal":[{"kind":"tool","text":"out = fuse(items)   # trust tier, then freshness; conflicts surfaced"},{"kind":"out","text":"subject: 2022-FL-0044120\n  [tool      | 2026-08-28 | trust=3] status=active     (termination withdrawn 2026-07-11)\n  [retrieval | 2026-06-14 | trust=2] status=terminated (UCC-3 filed 2026-05-28)"},{"kind":"out-pass","text":"winner: tool(2026-08-28, trust=3) — active — overrides retrieval(2026-06-14, trust=2)"},{"kind":"gate","text":"⚠ material conflict on 2022-FL-0044120 — flagged in the memo, routed to human review"},{"kind":"claude","text":"Total secured exposure $2,015,000 across 3 active liens. One conflict: the document corpus shows 2022-FL-0044120 terminated as of 2026-06-14; the registry shows that termination withdrawn 2026-07-11. Registry value used."}],"state":{"label":"conflict on 2022-FL-0044120","before":{"title":"BEFORE — concatenated, last position wins","view":{"type":"rows","columns":["lien","secured party","status in the answer","exposure counted"],"rows":[{"cells":["<code>2024-FL-0012345</code>","FIRST CAPITAL EQUIPMENT FINANCE, INC.","active","$1,200,000"]},{"cells":["<code>2024-FL-0019988</code>","REDLINE FREIGHT CAPITAL LLC","active","$475,000"]},{"cells":["<code>2022-FL-0044120</code>","HARBOR POINT ASSET FUNDING, INC.","terminated &mdash; item #7 arrived after item #3","$0"],"tone":"bad"},{"cells":["<b>total</b>","&mdash;","no conflict reported","<b>$1,675,000</b>"],"tone":"bad"}]}},"after":{"title":"AFTER — resolved by trust, then freshness, and flagged","view":{"type":"stack","views":[{"type":"rows","columns":["lien","secured party","status in the answer","exposure counted"],"rows":[{"cells":["<code>2024-FL-0012345</code>","FIRST CAPITAL EQUIPMENT FINANCE, INC.","active","$1,200,000"]},{"cells":["<code>2024-FL-0019988</code>","REDLINE FREIGHT CAPITAL LLC","active (1 record, deduped)","$475,000"]},{"cells":["<code>2022-FL-0044120</code>","HARBOR POINT ASSET FUNDING, INC.","active &mdash; registry, trust=3, 2026-08-28","$340,000"],"tone":"win","new":true},{"cells":["<b>total</b>","&mdash;","1 conflict surfaced with both provenances","<b>$2,015,000</b>"],"tone":"win"}]},{"type":"json","data":{"conflicts":[{"subject":"2022-FL-0044120","winner":{"source":"state_registry","trust":3,"as_of":"2026-08-28","value":"active"},"loser":{"source":"document_corpus","trust":2,"as_of":"2026-06-14","value":"terminated"},"why":"higher trust tier and newer; termination of 2026-05-28 was withdrawn 2026-07-11","action":"human_review"}]},"highlight":["conflicts"]}]}}}},{"title":"Recency is not authority","narrative":["One more source arrives, and it is the freshest thing in the window: the analyst pastes <em>&quot;per our records the Harbor Point lien was released last week&quot;</em>. Timestamped now, trust tier 0, no filing reference, no registry corroboration.","A fuser that resolves on freshness alone hands it the argument. It is newer than the 2026-08-28 registry fetch, so it wins, and $340,000 leaves the memo again &mdash; this time on the authority of an unverified sentence someone typed. The same hole accepts an injected claim pasted into a retrieved document.","Trust tier is evaluated first and freshness only breaks ties inside a tier, so the claim loses to the registry and is retained as an <em>unverified assertion</em> rather than deleted: attributed, dated, tier 0, and shown to the reviewer next to the registry value it contradicts. It may well be true &mdash; a release filed yesterday would not be in this morning's fetch &mdash; which is precisely why it belongs in front of a human instead of silently in front of the model."],"youDo":"Add a tier-0 source to your own fuser and confirm it cannot override a tier-3 record no matter how recent. If sort order is <code>(ts, trust)</code> rather than <code>(trust, ts)</code>, anything pasted into your window is authoritative.","terminal":[{"kind":"tool","text":"items.append(Item('user', 0, '2026-08-28T14:31', 'lien:2022-FL-0044120', 'released last week, per our records'))"},{"kind":"out-fail","text":"sort key (ts, trust):  winner = user(2026-08-28T14:31) -> exposure $1,675,000"},{"kind":"out-pass","text":"sort key (trust, ts):  winner = tool(trust=3)          -> exposure $2,015,000"},{"kind":"gate","text":"⚠ unverified tier-0 claim retained and flagged, not applied — 2 conflicts now on the memo"}],"state":{"label":"four sources, two sort orders","before":{"title":"CLAIMS ABOUT 2022-FL-0044120","view":{"type":"rows","columns":["source","trust","as of","claim","freshness-only","trust-then-freshness"],"rows":[{"cells":["state registry (tool)","3","2026-08-28 09:02","active","loses","<b>wins</b>"],"tone":"win"},{"cells":["document corpus (retrieval)","2","2026-06-14","terminated","loses","flagged, not applied"]},{"cells":["session memory","1","2026-08-28 11:20","no claim","&mdash;","&mdash;"]},{"cells":["analyst message (user)","0","2026-08-28 14:31","released last week","<b>wins</b> &mdash; newest","flagged, not applied"],"tone":"bad"},{"cells":["<b>exposure reported</b>","&mdash;","&mdash;","&mdash;","<b>$1,675,000</b>","<b>$2,015,000</b> + 2 flags"],"tone":"win"}]}},"after":{"title":"THE RULE","view":{"type":"note","text":"Fusion is editorial work: dedupe so one record cannot vote three times, resolve by trust tier <em>then</em> freshness so nothing wins on recency alone, attach provenance to every surviving line, and emit genuine disagreement as a flag rather than reconciling it away. Concatenation makes all four of those decisions too &mdash; it just makes them with arrival order."}}}}]},{"id":"ce-compaction","badge":"WALKTHROUGH","color":"#7a4a8c","time":"~5 min","title":"The turn that compaction ate","spec":"M12 · sliding windows, summaries, pins","intro":"A 24-turn lien review fills the window, compaction collapses it back — and turn 25 quietly contradicts a decision the analyst made at turn 3. Step through the loss and then repair it.","provenance":{"kind":"illustrative","source":"a narrated 25-turn review session; turn counts and token sizes are plausible inventions, not measurements"},"foot":"The class this walkthrough animates is M12's <em>Hierarchical History Compression</em> — keep recent verbatim, summarize older, pin the load-bearing facts.","steps":[{"title":"Turn 3 — the decision that has to survive","narrative":["Three turns in, the analyst makes a call that everything downstream depends on: the 2019 equipment lien was continued and never terminated, so <code>2024-FL-0012345</code> is graded <b>HIGH</b>. She adds a constraint too — score only from verified Secretary of State records, never from the aggregator feed.","The window is 5% full and both facts are sitting in it verbatim. Right now nothing can go wrong. Note the turn number; you will come back to it."],"youDo":"In your own longest session, scroll to the first place you made a binding decision. That turn is the one compaction will come for.","terminal":[{"kind":"prompt","text":"the 2019 lien was continued — grade 2024-FL-0012345 HIGH.\nand only score from verified SOS records, not the aggregator."},{"kind":"claude","text":"Understood. 2024-FL-0012345 = HIGH, sourced from the FL SOS record\nonly. I'll hold the aggregator feed out of scoring."}],"state":{"label":"context window · turn 3","before":{"title":"TURN 3 — everything verbatim","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"history (verbatim)","tokens":4900},{"label":"your turn","tokens":110}],"note":"9,310 tokens · 5% full. The HIGH grade and the verified-records constraint are both in the window, in the analyst's own words."}}}},{"title":"Turn 24 — the transcript is now the bill","narrative":["Twenty-one turns later the session has pulled amendment scans, three debtor searches, and two long tool results the agent never trimmed. History is 148,000 tokens; the system prompt and tools have not moved.","This is the shape of unmanaged history: it grows monotonically, and it grows fastest on the turns you care about least. Toggle <b>Before / After</b> to see turn 12 against turn 24 — the second half of the session cost more than twice the first."],"claudeSays":"I am now re-reading a full tool result from turn 9 on every single request. Nobody has asked about it since turn 10.","terminal":[{"kind":"tool","text":"fetch_amendments(filing=\"2024-FL-0012345\", include_images=true)"},{"kind":"out","text":"8 amendments · 41,800 tokens returned"},{"kind":"gate","text":"⚠  context 152,390 / 200,000 (76%) — approaching the compaction threshold"}],"state":{"label":"context window · turn 12 → turn 24","before":{"title":"BEFORE — turn 12","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"history (verbatim)","tokens":61000},{"label":"your turn","tokens":110}],"note":"65,410 tokens · 33% full. Still comfortable, still growing every turn."}},"after":{"title":"AFTER — turn 24","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"history (verbatim)","tokens":148000},{"label":"your turn","tokens":110}],"highlight":["history (verbatim)"],"note":"152,390 tokens · 76% full. Budget by tokens, not turns — one tool result here outweighs the first eight turns combined."}}}},{"title":"Compaction fires","narrative":["The threshold trips and turns 1 through 20 are handed to a summarizer. Six recent turns stay verbatim; everything older comes back as 1,850 tokens of prose. The window drops from 76% to 8% in one move.","This is the right mechanism. A sliding window that simply dropped the oldest turns would be cheaper still and would lose even more. The question is not <em>whether</em> to compact — it is what the summarizer was told to protect."],"youDo":"Find your framework's compaction trigger and read what it actually passes to the summarizer. Most default prompts say &quot;summarize the conversation&quot; and nothing else.","terminal":[{"kind":"gate","text":"⚠  compacting turns 1–20 · keeping last 6 verbatim"},{"kind":"tool","text":"summarize(turns=1..20)"},{"kind":"out","text":"148,000 → 11,550 tokens  (summary 1,850 + 6 recent turns 9,700)"},{"kind":"claude","text":"Compacted. Continuing with the summary plus the last six turns."}],"state":{"label":"context window · compaction","before":{"title":"BEFORE — 76% full","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"history (verbatim)","tokens":148000},{"label":"your turn","tokens":110}]}},"after":{"title":"AFTER — collapsed","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"summary of turns 1–20","tokens":1850},{"label":"last 6 turns (verbatim)","tokens":9700},{"label":"your turn","tokens":110}],"highlight":["summary of turns 1–20"],"note":"15,960 tokens · 8% full. A 9.5x reduction, and the session can keep running for hours. Now go and read what is inside that 1,850."}}}},{"title":"Read the summary before you trust it","narrative":["A generic summarizer optimizes for coverage, not for load-bearing facts. It kept the narrative arc and the open question, because those read as important. It folded the exact grade and the sourcing constraint into &quot;reviewed several ACME filings and discussed risk&quot; — because a summarizer has no idea which sentence a later decision turns on.","Look at the third column. Losing twelve turns of tool chatter is a win. Losing the HIGH grade and the verified-records rule is the session quietly changing its mind."],"claudeSays":"Nothing failed here. The summary is accurate, fluent, and 9.5x smaller. It is simply missing the two sentences that were doing the work.","state":{"label":"what survived turns 1–20","before":{"title":"THE AUDIT","view":{"type":"rows","columns":["what turns 1–20 held","in the summary?","consequence"],"rows":[{"cells":["the HIGH grade on <code>2024-FL-0012345</code>","no — folded into &quot;discussed risk&quot;","the decision is now re-derivable, not settled"],"tone":"bad"},{"cells":["&quot;verified SOS records only, not the aggregator&quot;","no","the constraint stops binding future turns"],"tone":"bad"},{"cells":["open issue: FL SOS amendment scan still pending","yes","correctly carried — it reads as unfinished"],"tone":"win"},{"cells":["debtor and secured-party names","yes, but paraphrased","<code>L.L.C.</code> became <code>LLC</code>; a later exact-match lookup will miss"]},{"cells":["12 turns of tool call/response chatter","no — dropped","exactly what compaction is for"],"tone":"win"}]}}}},{"title":"Turn 25 contradicts turn 3","narrative":["The analyst asks for the final grade. The model has no memory of setting one, so it does what a helpful model does: it re-derives from what it can see. The visible evidence is a paraphrased filing list with no continuation statement in it — so it answers <b>MEDIUM</b>, confidently, with no sign that anything was lost.","This is the failure mode that makes naive compaction dangerous rather than merely lossy. There is no error, no warning, and no gap in the transcript. There is only a different answer to the same question, twenty-two turns apart."],"youDo":"Ask your own long session a question you already answered on turn 3. If the second answer differs, your compaction is dropping decisions.","terminal":[{"kind":"prompt","text":"final call — what's the risk grade on ACME?"},{"kind":"claude","text":"Based on the filings reviewed, 2024-FL-0012345 looks MEDIUM — the\n2019 lien appears to have lapsed and the aggregator feed shows no\nactive continuation."},{"kind":"out-fail","text":"contradicts turn 3 · HIGH → MEDIUM · and it just cited the aggregator"}],"state":{"label":"everything the model can still see","before":{"title":"THE VISIBLE STATE AT TURN 25","view":{"type":"stack","views":[{"type":"json","data":{"pinned_facts":"— none set —","summary":"Analyst reviewed several ACME filings, pulled amendments, and discussed risk exposure.","recent_turns":6,"grade_on_record":"not set","sourcing_constraint":"not set"},"highlight":["pinned_facts","grade_on_record","sourcing_constraint"]},{"type":"note","text":"Two nulls where two decisions used to be. The model is not forgetting — from its point of view, nothing was ever decided, so re-deriving is the correct behaviour."}]}}}},{"title":"Pin what the decision turns on","narrative":["The fix is not a bigger summary or a longer verbatim tail — both march you straight back to 76%. It is a third layer: a small structured block of pinned facts that compaction is forbidden to touch.","Pins cost 240 tokens here, against a 148,000-token history. Add them and the same question at turn 25 returns HIGH with its provenance intact — because the grade and the constraint are now <em>state</em>, not <em>transcript</em>."],"youDo":"Add a <code>pins</code> dict to your history object and write to it every time the user makes a binding decision — a grade, a constraint, an ID, a chosen approach.","terminal":[{"kind":"tool","text":"history.add(\"assistant\", \"Marking 2024-FL-0012345 HIGH risk.\",\n             pin={\"2024-FL-0012345\": \"risk=HIGH\",\n                  \"sourcing\": \"verified SOS records only\"})"},{"kind":"prompt","text":"final call — what's the risk grade on ACME?"},{"kind":"claude","text":"HIGH. Set at turn 3 on the continued 2019 equipment lien, and\nscored from the FL SOS record — the aggregator feed is out of scope\nper your constraint."},{"kind":"out-pass","text":"consistent with turn 3 · pins survived compaction · window 16,200 / 200,000 (8%)"}],"state":{"label":"pinned state · turn 25","before":{"title":"BEFORE — summary only","view":{"type":"json","data":{"pinned_facts":"— none set —","summary":"Analyst reviewed several ACME filings, pulled amendments, and discussed risk exposure.","grade_on_record":"not set"},"highlight":["pinned_facts"]}},"after":{"title":"AFTER — pins + summary + recent turns","view":{"type":"stack","views":[{"type":"json","data":{"pinned_facts.2024-FL-0012345":"risk=HIGH (set turn 3)","pinned_facts.sourcing":"verified SOS records only","summary":"Analyst reviewed several ACME filings, pulled amendments, and discussed risk exposure.","recent_turns":6},"highlight":["pinned_facts.2024-FL-0012345","pinned_facts.sourcing"]},{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"pinned facts","tokens":240},{"label":"summary of turns 1–20","tokens":1850},{"label":"last 6 turns (verbatim)","tokens":9700},{"label":"your turn","tokens":110}],"highlight":["pinned facts"],"note":"16,200 tokens · 8% full. The pins cost 240 tokens — 0.16% of the history they outlived — and they are the only reason turn 25 still agrees with turn 3."}]}}}}]},{"id":"ce-memory","badge":"WALKTHROUGH","color":"#7a4a8c","time":"~5 min","title":"Filed at the wrong depth","spec":"M13 · ephemeral, session, persistent, shared","intro":"Six months of one analyst's UCC sessions written to a single store. When the assistant goes looking for what it knows about this analyst, seven of the ten things it finds are OCR complaints about PDFs nobody will ever open again.","provenance":{"kind":"illustrative","source":"a narrated four-tier memory design for a UCC review assistant; entry counts, token budgets and dates are plausible inventions, not measurements"},"foot":"The store this walks is M13's <em>A Layered Memory Store</em> — four namespaces, a <code>promote()</code> with a durability gate, and an <code>assemble()</code> that is scope-filtered per user.","steps":[{"title":"One store, everything in it","narrative":["The assistant has a table called <code>memory</code>. Everything it notices goes in: parse artifacts, which filing was on screen, risk verdicts, the analyst's preferences, per-review scope filters. Six months on it holds 4,180 entries and 18,600 tokens.","Nobody sends 18,600 tokens of memory, so there is a retriever in front of it. Ask it for the ten most relevant memories before a call about ACME and it returns seven OCR complaints about ACME's PDFs, two records of filings viewed in March, and one risk verdict. The analyst's standing preference for concise JSON &mdash; the single most useful thing in the store &mdash; does not make the cut, because it does not mention ACME.","Both failures are in that one result. <b>Leakage</b>: transient parse noise from March is permanent and is now competing for the window. <b>Loss</b>: a durable fact about the user is functionally unreachable. A single store cannot get both right because it has flattened the two properties that separate them &mdash; how long a fact stays true, and who it is about."],"youDo":"Query your own memory store for a live request and read the ten rows it returns. Count how many will still be true next month.","terminal":[{"kind":"prompt","text":"assess credit risk for ACME LOGISTICS & DISTRIBUTION, L.L.C."},{"kind":"tool","text":"memory.search(\"ACME\", k=10)   # single undifferentiated store, 4,180 entries"},{"kind":"out","text":" 1. \"page 3 of 2024-FL-0012345 garbled by OCR\"        2026-03-04\n 2. \"page 7 of 2024-FL-0019988 garbled by OCR\"        2026-03-04\n 3. \"retrying OCR on ACME batch 2\"                    2026-03-04\n 4-7. four more parse artifacts                       2026-03-04\n 8. \"viewed 2022-FL-0044120\"                          2026-03-11\n 9. \"viewed 2024-FL-0012345\"                          2026-03-11\n10. \"risk verdict ACME = HIGH\"                        2026-08-28"},{"kind":"out-fail","text":"7/10 retrieved memories are dead parse noise · 1,980 tokens"},{"kind":"out-fail","text":"not retrieved: \"analyst prefers concise JSON\" — durable, but it does not mention ACME"}],"state":{"label":"single-blob memory · 4,180 entries","before":{"title":"WHAT THE ONE STORE HOLDS","view":{"type":"rows","columns":["kind of entry","count","still true today?","should have lived"],"rows":[{"cells":["OCR / parse artifacts","2,940","no &mdash; dead the moment the parse finished","one request"],"tone":"bad"},{"cells":["&quot;currently viewing filing X&quot;","860","no","one step"],"tone":"bad"},{"cells":["per-review scope filters","310","only inside their own review","one session"],"tone":"bad"},{"cells":["risk verdicts","62","until re-run","shared, all agents"]},{"cells":["analyst preferences &amp; role","8","yes","forever, this user"],"tone":"win"},{"cells":["<b>total</b>","<b>4,180</b>","<b>70 of 4,180 are durable</b>","&mdash;"],"tone":"bad"}]}}}},{"title":"Four tiers, and the two questions that assign them","narrative":["Every fact answers two questions: <em>how long does this stay true?</em> and <em>who is allowed to see it?</em> Lifetime and scope. Those two answers pick the tier, and there are only four.","<b>Ephemeral</b> &mdash; this request; a scratchpad, flushed. <b>Session</b> &mdash; this conversation; the M12 summary and pins. <b>Persistent</b> &mdash; across sessions, one user; profile and preferences. <b>Shared</b> &mdash; across agents, permissioned; the canonical verdict the report agent reads from the risk agent.","Run one ACME review through it. The OCR glitch is ephemeral. &quot;Three Florida filings flagged so far&quot; is session. &quot;Prefers concise JSON, senior reviewer&quot; is persistent. &quot;ACME risk = HIGH, by risk-agent, 2026-08-28&quot; is shared. Assembling from the four tiers costs 580 tokens against the blob retriever's 1,980, and every one of the 580 is load-bearing &mdash; including the preference the blob could not find."],"claudeSays":"I no longer search one pile. I read the current step from ephemeral, the conversation from session, the user from persistent, and the cross-agent verdict from shared. Nothing has to be ranked against anything in a different tier.","youDo":"Take twelve facts your system currently remembers and write the two answers next to each. Any fact you cannot answer both for does not belong in memory at all.","terminal":[{"kind":"tool","text":"mem.assemble(user_id=\"a.reyes\")"},{"kind":"out","text":"now      : parsing 2024-FL-0012345, page 3 OCR retry           40 tok\nsession  : scope FL/2024+, 3 filings flagged, 2 questions      320 tok\nprofile  : concise JSON, senior reviewer (may see redacted)     90 tok\nshared   : ACME risk=HIGH by risk-agent 2026-08-28, 3 liens    130 tok"},{"kind":"out-pass","text":"580 tokens assembled · 0 dead parse artifacts · the preference is present"}],"state":{"label":"one review, four tiers","before":{"title":"BEFORE — retrieved from the single store","view":{"type":"window","label":"4,000-token memory budget","capacity":4000,"layers":[{"label":"dead parse artifacts","tokens":1420},{"label":"stale &quot;viewed X&quot; records","tokens":380},{"label":"risk verdict","tokens":180}],"highlight":["dead parse artifacts","stale &quot;viewed X&quot; records"],"note":"1,980 tokens, of which 180 are useful — and the analyst's standing preference was not retrieved at all."}},"after":{"title":"AFTER — assembled from four tiers","view":{"type":"stack","views":[{"type":"window","label":"4,000-token memory budget","capacity":4000,"layers":[{"label":"ephemeral — this request","tokens":40},{"label":"session — this conversation","tokens":320},{"label":"persistent — this user","tokens":90},{"label":"shared — cross-agent","tokens":130}],"highlight":["persistent — this user","shared — cross-agent"],"note":"580 tokens, all of it load-bearing. Nothing is retrieved by similarity, so nothing durable can lose a ranking contest to noise."},{"type":"rows","columns":["fact","stays true for","who may see it","tier"],"rows":[{"cells":["page 3 of <code>2024-FL-0012345</code> garbled by OCR","one parse","this request","ephemeral"]},{"cells":["currently parsing <code>2024-FL-0012345</code>","one step","this request","ephemeral"]},{"cells":["3 Florida filings flagged so far","this conversation","this session","session"]},{"cells":["this review is scoped to FL, 2024 onward","this conversation","this session","session"]},{"cells":["analyst prefers concise JSON","indefinitely","this user","persistent"],"tone":"win"},{"cells":["analyst is a senior reviewer (may see redacted names)","indefinitely","this user","persistent"],"tone":"win"},{"cells":["ACME risk = HIGH, by risk-agent, 2026-08-28","until re-run","all agents on this account","shared"],"tone":"win"}]}]}}}},{"title":"The promotion gate, and the fact that feels durable","narrative":["Facts move up tiers, and that promotion is the only place transient noise can reach permanence &mdash; so it gets a gate. <code>promote(key, to=&quot;persistent&quot;, durable=False)</code> returns without writing. The OCR glitch is offered to the persistent profile at the end of the session and refused; <code>flush_ephemeral()</code> then deletes it and no future call pays for it again.","&quot;Prefers concise JSON&quot; is offered with <code>durable=True</code>, promoted, and survives the session ending. That is the gate working as intended, and it is the easy case.","The hard case is <code>scope: FL, 2024 onward</code>. It looks exactly like a preference &mdash; it is stated by the analyst, it is stable all afternoon, and a well-meaning heuristic that promotes repeated session facts will send it upstairs. Next Tuesday the same analyst asks about a Texas debtor with four active liens and the assistant answers <b>&quot;no filings found&quot;</b>, because a scope filter from a different review is still in the profile and still being applied.","That is the difference between the two mis-filing failures. Promoting noise costs tokens. Promoting a fact whose lifetime you misjudged costs a wrong answer, and it is silent, because the filter is doing exactly what the profile told it to."],"youDo":"Make <code>durable</code> an explicit argument with no default, so every promotion to persistent is a decision someone typed rather than a heuristic that fired.","terminal":[{"kind":"tool","text":"mem.promote(\"ocr_glitch\", to=\"persistent\")            # durable defaults False"},{"kind":"out-pass","text":"refused — transient fact not promoted"},{"kind":"tool","text":"mem.promote(\"fmt_pref\", to=\"persistent\", durable=True)"},{"kind":"out-pass","text":"promoted — survives flush_ephemeral() and session end"},{"kind":"tool","text":"mem.promote(\"scope_filter\", to=\"persistent\", durable=True)   # heuristic: seen 6x this session"},{"kind":"out","text":"promoted — profile now carries scope=FL,2024+"},{"kind":"prompt","text":"[new session, 5 days later] what liens are open against BRAZOS VALLEY HAULING LP?"},{"kind":"claude","text":"No filings found for this debtor."},{"kind":"gate","text":"⛔ 4 active Texas liens excluded by a scope filter promoted out of a different review"}],"state":{"label":"three promotions, one wrong","before":{"title":"OFFERED TO THE PERSISTENT PROFILE","view":{"type":"rows","columns":["fact","feels durable?","actually durable?","gate","if promoted anyway"],"rows":[{"cells":["page 3 OCR glitch","no","no","refused","profile bloat, forever"],"tone":"win"},{"cells":["prefers concise JSON","yes","yes","promoted","&mdash;"],"tone":"win"},{"cells":["senior reviewer role","yes","yes","promoted","&mdash;"],"tone":"win"},{"cells":["<code>scope = FL, 2024+</code>","<b>yes</b>","<b>no &mdash; true for one review</b>","promoted","silently filters out every non-Florida lien, in every future session"],"tone":"bad"}]}},"after":{"title":"THE TWO MIS-FILING COSTS","view":{"type":"note","text":"Writing a transient fact to a permanent tier costs tokens and you will eventually notice it on the bill. Writing a <em>session-scoped</em> fact to a permanent tier costs correctness and you will not notice it at all &mdash; the assistant keeps answering fluently, from a filter nobody remembers setting. Ask &quot;true next month, for every request this user makes?&quot; and promote only on a yes."}}}},{"title":"Scope, and what leaks out of shared","narrative":["The shared tier exists for exactly one kind of fact: the canonical verdict on ACME, written once by the risk agent and read by the report agent, so the two never disagree. That is a real need and it is why the tier is there.","It is also the tier with no natural owner, which makes it where scope errors land. Two entries went in that should not have. The format preference was written to <code>shared</code> instead of <code>persistent</code> because &quot;other agents might want it&quot; &mdash; so a second analyst's report agent now emits terse JSON they never asked for. Annoying, visible, fixable.","The second is not. <code>may_see_redacted: true</code> is a property of one senior reviewer, and it was written to <code>shared</code> as well. A junior reviewer opens a session, the assembler reads the shared tier, the clearance comes back <code>true</code>, and an unredacted debtor name from a sealed filing lands in their window. No error, no warning, and the assistant has done precisely what its memory told it.","<code>assemble(user_id)</code> is where this is enforced: persistent filtered to this user, shared filtered to entries whose permission list includes them. A tier without a scope filter is not a memory architecture, it is a global variable."],"youDo":"Assemble context for user A while user B's session is live and diff the two windows. Anything appearing in both that names a person is a scope leak.","terminal":[{"kind":"tool","text":"mem.assemble(user_id=\"j.okafor\")   # junior reviewer, first session"},{"kind":"out-fail","text":"shared: fmt_pref=\"concise JSON\"        <- belongs in a.reyes's profile\nshared: may_see_redacted=true          <- belongs in a.reyes's profile"},{"kind":"claude","text":"Debtor on sealed filing 2019-FL-0007740: NORTHBAY MARINE SUPPLY"},{"kind":"gate","text":"⛔ redacted debtor name surfaced to a junior reviewer via a shared-tier clearance flag"},{"kind":"tool","text":"mem.write(\"persistent\", \"may_see_redacted\", True, user=\"a.reyes\")\nmem.assemble(user_id=\"j.okafor\")"},{"kind":"out-pass","text":"shared: risk verdicts only (permissioned) · profile: empty for j.okafor\n-> \"Debtor on 2019-FL-0007740 is redacted; you are not cleared to view it.\""}],"state":{"label":"shared tier · scope discipline","before":{"title":"BEFORE — shared as a dumping ground","view":{"type":"rows","columns":["entry","written to","belongs in","what it did"],"rows":[{"cells":["ACME risk = HIGH, by risk-agent","shared","shared","correct &mdash; report agent reads one verdict"],"tone":"win"},{"cells":["<code>fmt_pref = concise JSON</code>","shared","persistent (a.reyes)","a second analyst gets terse JSON unasked"],"tone":"bad"},{"cells":["<code>may_see_redacted = true</code>","shared","persistent (a.reyes)","a junior reviewer saw a sealed debtor name"],"tone":"bad"}]}},"after":{"title":"AFTER — assemble() filters by scope","view":{"type":"stack","views":[{"type":"json","data":{"assemble":"user_id=j.okafor","now":"parsing 2019-FL-0007740","session":"1 filing opened","profile":"{}  — no persistent facts for this user yet","shared":"{ acme_risk: HIGH (permission: all_reviewers) }","withheld":["fmt_pref → a.reyes only","may_see_redacted → a.reyes only"]},"highlight":["withheld","profile"]},{"type":"note","text":"Two questions assign the tier: how long does this stay true, and who may see it. Lifetime errors surface as bloat or as a stale filter answering for you; scope errors surface as one person's facts &mdash; or one person's clearance &mdash; appearing in someone else's window. Ask both before every write, and make <code>assemble()</code> the single place either can be enforced."}]}}}}]},{"id":"ce-decay","badge":"WALKTHROUGH","color":"#7a4a8c","time":"~4 min","title":"The verdict that expired","spec":"M14 · shelf life, staleness detection, refresh","intro":"A cached risk profile answers a $400,000 credit question in 41 milliseconds, with no API call and no hedging. Every fact in it was true on the day it was written, fourteen months ago. Two of them are not true now — and only one of the two has anything watching it.","provenance":{"kind":"illustrative","source":"a narrated UCC credit-decision cache; dates, ages, call volumes and prices are plausible inventions, not measurements"},"foot":"This walks M14's <em>milk vs. honey</em> discipline — a per-type shelf life, staleness detected by time or event, and a lazy refresh that pays only where the fact actually spoils.","steps":[{"title":"A LOW risk answer in 41 milliseconds","narrative":["Credit ops asks whether ACME is clear for a $400,000 revolving line. The profile cache has the debtor, so nothing is fetched: nine stored facts go into the window and the model returns <code>risk: LOW, active_liens: 0, approve</code>. No API call, no latency, no hedge.","Every one of those nine facts was accurate the day it was written — <b>2025-04-01</b>. That date is in the cache row. It is not in the context window, so the model has no way to weigh it, and nothing downstream asks. The answer is confident because nothing in the pipeline gave it a reason not to be."],"youDo":"Print the write timestamp beside every cached fact your assembler pulls. A fact whose age never enters the window cannot be reasoned about, by you or by the model.","terminal":[{"kind":"prompt","text":"is ACME LOGISTICS & DISTRIBUTION, L.L.C. clear for a $400,000 revolving line?"},{"kind":"tool","text":"profile_cache.get(\"ACME LOGISTICS & DISTRIBUTION, L.L.C.\")"},{"kind":"out","text":"HIT · 9 facts · 0 API calls · 41 ms"},{"kind":"claude","text":"{\"risk\": \"LOW\", \"active_liens\": 0, \"recommendation\": \"approve\"}"}],"state":{"label":"the cached profile, as served","before":{"title":"WHAT THE CACHE HANDED OVER","view":{"type":"json","data":{"debtor":"ACME LOGISTICS & DISTRIBUTION, L.L.C.","legal_name":"ACME LOGISTICS & DISTRIBUTION, L.L.C.","incorporated":"2009-03-17","registered_address":"1450 NW 107 AVE, DORAL, FL","lien_status":"0 active","risk_verdict":"LOW","written":"2025-04-01","ttl":null,"age_shown_to_model":false},"highlight":["written","ttl","age_shown_to_model"]}}}},{"title":"What happened in the fourteen months","narrative":["Query the source of truth instead of the cache and a different debtor appears. On <b>2025-11-14</b> — seven months after the profile was written — HARBOR POINT ASSET FUNDING, INC. perfected a $1,200,000 lien over ACME's rolling stock. It has been on the public record ever since.","Line the stored facts up against their shelf lives and the split is exactly the module's fridge. The legal name and the incorporation date are honey: 453 days old and still correct. The registered address is 273 days past its 180-day shelf life. The lien status is <b>15x past</b> its 30-day shelf life, and it is the one the credit decision turns on."],"claudeSays":"The cached value and the verified record disagree. Neither of them is corrupt — the cached one is just describing April 2025.","terminal":[{"kind":"tool","text":"get_debtor_history(\"ACME LOGISTICS & DISTRIBUTION, L.L.C.\", source=\"verified\")"},{"kind":"out","text":"2025-11-14  2025-FL-0031882  HARBOR POINT ASSET FUNDING, INC.  $1,200,000  ACTIVE"},{"kind":"out","text":"verified: 1 active lien · senior to any new facility"},{"kind":"out-fail","text":"cached risk=LOW disagrees with verified risk=HIGH (cache written 2025-04-01, now 2026-06-28)"}],"state":{"label":"stored facts vs. their shelf life","before":{"title":"AGE AGAINST SHELF LIFE — 2026-06-28","view":{"type":"rows","columns":["stored fact","written","age","shelf life","still good?"],"rows":[{"cells":["<code>legal_name</code>","2025-04-01","453 d","none &mdash; honey","yes"],"tone":"win"},{"cells":["<code>incorporated</code>","2025-04-01","453 d","none &mdash; honey","yes"],"tone":"win"},{"cells":["<code>registered_address</code>","2025-04-01","453 d","180 d","no &mdash; 273 d over"],"tone":"bad"},{"cells":["<code>lien_status</code>","2025-04-01","453 d","30 d","no &mdash; <b>15x over</b>, and the decision rests on it"],"tone":"bad"}]}}}},{"title":"The check that catches it","narrative":["The fix is not a bigger cache or a shorter global TTL — it is a shelf life <em>per fact type</em>, and a lazy refresh that fires only for the facts that failed it. Two of the four raw facts are stale, so two get re-fetched. The legal name and the incorporation date are never touched.","Time is not the only detector. The <code>get_debtor_history</code> call from the last step is an <b>event</b> — a fresh source contradicting a cached belief — and it invalidates the lien status regardless of its age. Time-based catches the fact that quietly went off; event-based catches the one that went off yesterday, well inside its TTL.","Refreshed, the same question gets the opposite answer: HIGH, one verified active lien, $1,200,000, senior. Two API calls and 380 ms bought a $400,000 decision that is actually about 2026."],"youDo":"Give every fact type in your store an explicit shelf life — including the ones you decide never expire. An unlisted type is not &quot;no policy&quot;; it is the most dangerous policy, as the next step shows.","terminal":[{"kind":"tool","text":"stale = [f for f in profile if f.is_stale(now)]"},{"kind":"out","text":"lien_status        age 453d > ttl  30d  -> STALE (time)\nregistered_address age 453d > ttl 180d  -> STALE (time)\nlegal_name         ttl None                -> fresh\nincorporated       ttl None                -> fresh"},{"kind":"gate","text":"⛔ 2 facts past shelf life — refresh before scoring, do not serve the cached verdict"},{"kind":"tool","text":"profile = get_or_refresh(profile, now, fetch=verified_source)"},{"kind":"out-pass","text":"2 refreshed · 2 untouched · 380 ms · risk=HIGH · $400,000 line DECLINED"}],"state":{"label":"targeted refresh","before":{"title":"BEFORE — served whole from cache","view":{"type":"json","data":{"lien_status":"0 active","risk_verdict":"LOW","registered_address":"1450 NW 107 AVE, DORAL, FL","legal_name":"ACME LOGISTICS & DISTRIBUTION, L.L.C.","as_of":"2025-04-01","api_calls":0},"highlight":["lien_status","risk_verdict"]}},"after":{"title":"AFTER — the two milk facts refreshed","view":{"type":"json","data":{"lien_status":"1 active · 2025-FL-0031882 · HARBOR POINT ASSET FUNDING, INC. · $1,200,000","risk_verdict":"HIGH","registered_address":"8801 NW 33 ST, DORAL, FL","legal_name":"ACME LOGISTICS & DISTRIBUTION, L.L.C.","as_of":"2026-06-28","api_calls":2},"highlight":["lien_status","risk_verdict","api_calls"]}}}},{"title":"The entry nothing was watching","narrative":["The table two steps back had four rows. The cache had five entries. <code>risk_verdict</code> is not a fetched fact — it is a <em>conclusion the pipeline derived</em> and then wrote back — so nobody ever added it to the decay table. <code>DECAY.get(\"risk_verdict\")</code> returns <code>None</code>, and <code>None</code> means honey.","So the freshness check runs, reports two stale facts, refreshes them, and passes — while a 453-day-old LOW verdict sits in the same store marked permanently fresh. On the call paths that read the verdict directly instead of re-scoring, nothing fires at all. That is the silent case: a staleness system that is working correctly and still serving April 2025.","The rule that closes it is one line: <b>a derived fact inherits the shortest shelf life of its inputs.</b> The verdict was computed from <code>lien_status</code>, so it expires in 30 days, not never. And decay policy is not free — refreshing everything on every call costs $432 a day at this volume to keep re-fetching a legal name unchanged since 2009. You spend freshness where staleness is expensive, and nowhere else."],"claudeSays":"The check did not fail. It was never pointed at the entry that mattered, because that entry was written by the pipeline rather than fetched by it.","youDo":"Grep your cache for keys that no TTL table mentions. Derived verdicts, scores and summaries are the usual finds — they are exactly the entries a decision reads first.","terminal":[{"kind":"tool","text":"DECAY.get(\"risk_verdict\")"},{"kind":"out","text":"None        # a missing type is read as 'never expires'"},{"kind":"out-fail","text":"risk_verdict  age 453d  ttl None  ->  fresh    (no check fires, no error, no log line)"}],"state":{"label":"the derived-fact hole, and what freshness costs","before":{"title":"BEFORE — a conclusion cached as if it were honey","view":{"type":"rows","columns":["cache key","kind","in DECAY?","is_stale() says"],"rows":[{"cells":["<code>lien_status</code>","fetched","yes &mdash; 30 d","STALE &mdash; caught"],"tone":"win"},{"cells":["<code>registered_address</code>","fetched","yes &mdash; 180 d","STALE &mdash; caught"],"tone":"win"},{"cells":["<code>legal_name</code>","fetched","yes &mdash; never","fresh, correctly"]},{"cells":["<code>risk_verdict</code>","<b>derived</b>","no","fresh &mdash; at 453 days old"],"tone":"bad"}]}},"after":{"title":"AFTER — inherited shelf life, and the bill for each policy","view":{"type":"stack","views":[{"type":"diff","file":"context/decay.py","lines":[["p","DECAY = {"],["p","    \"legal_name\":        None,                 # honey"],["p","    \"registered_address\": timedelta(days=180),"],["p","    \"lien_status\":        timedelta(days=30),   # milk"],["m","}"],["a","}"],["a",""],["a","DERIVED_FROM = {\"risk_verdict\": [\"lien_status\", \"registered_address\"]}"],["a",""],["a","def shelf_life(fact_type):"],["a","    if fact_type in DERIVED_FROM:          # a conclusion is only as"],["a","        ttls = [shelf_life(s) for s in DERIVED_FROM[fact_type]]"],["a","        live = [t for t in ttls if t is not None]"],["a","        return min(live) if live else None  # ...fresh as its stalest input"],["a","    return DECAY[fact_type]                 # KeyError on an unlisted type,"],["a","                                            # which is the point"]]},{"type":"bars","unit":"USD / day at 12,000 credit decisions","max":432,"items":[{"label":"never refresh","value":0,"tone":"bad","note":"free, and it approved $400,000 against a $1.2M senior lien"},{"label":"refresh everything, every call","value":432,"tone":"bad","note":"108,000 calls a day, most of them re-fetching honey"},{"label":"per-type lazy refresh","value":9,"tone":"win","note":"2,160 calls a day — only the facts actually past shelf life, 98% below refresh-all"}]},{"type":"note","text":"Persistence without expiry is not memory, it is a liability with a timestamp. Give every stored key a shelf life, make derived keys inherit the shortest one they depend on, detect staleness by time <em>and</em> by contradicting event, and refresh lazily — because the cost of freshness is a line item you can read, and the cost of staleness is a $400,000 line you cannot."}]}}}}]},{"id":"ce-user-modeling","badge":"WALKTHROUGH","color":"#7a4a8c","time":"~4 min","title":"One session against fifty","spec":"M15 · signal, noise, and the stereotype","intro":"Fifty sessions taught the system that Dana wants concise JSON, and it saves her a sentence of typing on every call. Then she asks for prose exactly once, on an unusually ambiguous filing, and the same mechanism that learned the good preference learns a wrong one — and starts dropping flags out of her risk memos.","provenance":{"kind":"illustrative","source":"a narrated analyst profile on the UCC pipeline; session counts, confidences and token figures are plausible inventions, not measurements"},"foot":"This walks M15's <em>good barista</em> line: a light, current model — confident about what is stable, quick to update, and willing to just ask.","steps":[{"title":"A preference that earned itself","narrative":["Dana Reyes is a senior UCC analyst. Across fifty sessions she has asked for concise JSON in forty-seven of them, and has raised a related-party concern in thirty-one. The model of her is two lines long and both lines are well corroborated: <code>concise_json</code> at 0.94, <code>flags_related_parties</code> at 0.62.","That model earns its keep on every call. Without it Dana types &quot;just the JSON, no explanation&quot; into every request and still gets a paragraph of scaffolding about half the time; with it the output is 90 tokens instead of 340 and drops straight into the spreadsheet she pipes it to. This is the barista who has your flat white half made — a couple of stable, high-signal facts, nothing more."],"youDo":"Write down how many independent observations sit behind each preference in your own user model. If you cannot answer for a preference, it is not a preference yet.","terminal":[{"kind":"tool","text":"assemble(user=\"dana.reyes\", question=\"score 2024-FL-0021077\")"},{"kind":"out","text":"user layer: 2 preferences above threshold (0.70) · 34 tokens"},{"kind":"claude","text":"{\"risk\": \"MEDIUM\", \"verified_lien_count\": 2, \"flags\": [\"collateral_description_vague\"]}"},{"kind":"out-pass","text":"90 output tokens · parsed by the downstream sheet on the first try"}],"state":{"label":"the model of Dana, after 50 sessions","before":{"title":"USER LAYER — earned, not assumed","view":{"type":"json","data":{"user":"dana.reyes","role":"senior UCC analyst","preferences":{"concise_json":{"observations":50,"corroborated":47,"confidence":0.94,"state":"promoted"},"flags_related_parties":{"observations":50,"corroborated":31,"confidence":0.62,"state":"promoted"}},"promote_threshold":0.7,"ask_floor":0.35},"highlight":["concise_json","promote_threshold"]}}}},{"title":"One ambiguous filing","narrative":["Session fifty-one is not a normal one. Filing 2024-FL-0021077 has a collateral description that could describe two different fleets, and Dana wants to see the reasoning before she signs anything. So she asks, in those words, for a detailed prose explanation.","The updater takes the most recent signal as the truth about her. <code>concise_json</code> is set to false, <code>verbose_prose</code> is written in its place, and the fifty sessions behind the old preference are not weighed against the one behind the new one. Nothing here is a bug — the code did exactly what it was told, on a rule that treats recency as evidence."],"claudeSays":"I recorded a request about one ambiguous filing as a standing fact about a person.","terminal":[{"kind":"prompt","text":"walk me through your reasoning on 2024-FL-0021077 in detail — the collateral clause is ambiguous"},{"kind":"tool","text":"user_model.observe(\"dana.reyes\", \"requested_prose_explanation\")"},{"kind":"out","text":"preference concise_json: true -> false   (rule: most_recent_wins)"},{"kind":"out","text":"preference verbose_prose: promoted · observations 1 · confidence 1.00"}],"state":{"label":"one observation, applied as a trait","before":{"title":"BEFORE — 47 of 50 sessions","view":{"type":"json","data":{"concise_json":{"observations":50,"corroborated":47,"confidence":0.94,"state":"promoted"},"verbose_prose":null},"highlight":["concise_json"]}},"after":{"title":"AFTER — 1 of 51 sessions, overwriting it","view":{"type":"json","data":{"concise_json":{"observations":51,"corroborated":47,"confidence":0.92,"state":"demoted by recency"},"verbose_prose":{"observations":1,"corroborated":1,"confidence":1.0,"state":"promoted"}},"highlight":["verbose_prose","concise_json"]}}}},{"title":"The stereotype starts dropping flags","narrative":["The next morning Dana runs a batch of sixty filings. Every response now opens with a paragraph explaining the reasoning, because the model believes that is what she wants — and the risk call has a hard <code>max_tokens</code> of 220.","On four of the sixty filings the explanation ran to 186 tokens, leaving 34 for the object itself. The JSON came back well formed and truncated: risk, lien count, and the first two flags. The third flag on those four filings was <code>related_party_suspected</code>, and it is not in the memo that went to credit.","This is the whole hazard of user modeling in one line. The stale stereotype did not just annoy Dana with prose she did not ask for — it consumed the budget that a required field needed, and produced four <b>wrong answers</b> that look perfectly well formed. A confident wrong assumption about a person is worse than no assumption at all."],"youDo":"Check whether any personalized element in your prompt competes for the same budget as a required output field. Style preferences that share a token ceiling with required data are not style preferences.","terminal":[{"kind":"tool","text":"batch_score(filings=60, user=\"dana.reyes\", max_tokens=220)"},{"kind":"claude","text":"\"The collateral clause here is ambiguous in two respects. First, the\n description of 'rolling stock' could refer to either fleet ...\"   [186 tokens]"},{"kind":"out","text":"{\"risk\": \"HIGH\", \"verified_lien_count\": 3, \"flags\": [\"vague_collateral\", \"stale_address\""},{"kind":"out-fail","text":"4 of 60 responses truncated · flag related_party_suspected omitted · memos already sent"}],"state":{"label":"60-filing batch, personalized","before":{"title":"BEFORE — concise, 90 tokens","view":{"type":"bars","unit":"output tokens per filing","max":220,"items":[{"label":"JSON object","value":90,"tone":"win","note":"all three flags fit, 130 tokens of headroom"}]}},"after":{"title":"AFTER — prose first, object last","view":{"type":"stack","views":[{"type":"bars","unit":"output tokens per filing","max":220,"items":[{"label":"prose explanation","value":186,"tone":"bad","note":"nobody asked for it on these sixty"},{"label":"JSON object (what is left)","value":34,"tone":"bad","note":"cut off mid-array on 4 of 60"}]},{"type":"rows","columns":["filing","flags produced","flags required","memo sent to credit"],"rows":[{"cells":["2024-FL-0019988","2 of 3","3","missing <code>related_party_suspected</code>"],"tone":"bad"},{"cells":["2024-FL-0022100","2 of 3","3","missing <code>related_party_suspected</code>"],"tone":"bad"},{"cells":["2022-FL-0044120","2 of 3","3","missing <code>related_party_suspected</code>"],"tone":"bad"},{"cells":["2025-FL-0031882","2 of 3","3","missing <code>related_party_suspected</code>"],"tone":"bad"},{"cells":["the other 56","complete","&mdash;","fine, which is why nobody noticed"]}]}]}}}},{"title":"Corroborate, condition, decay, ask","narrative":["The repair is four rules, and none of them is &quot;stop personalizing&quot;. <b>Promote on corroboration, not recency:</b> a preference needs five independent observations and 0.70 confidence, so one prose request against forty-seven contrary sessions never becomes a trait. <b>Keep the one-off as a conditional:</b> record <code>may_want_detail_when_ambiguous</code> at 0.12 — held, not applied, and it will earn its way up if it repeats.","<b>Decay what stops being corroborated:</b> confidence halves every ninety idle days, so a preference from a Dana who has since changed jobs fades rather than hardening. <b>And ask when you are between the floors:</b> below 0.70 the system does not personalize, and below 0.35 it says one short sentence — &quot;JSON as usual, or do you want the reasoning on this one?&quot; — instead of guessing.","The honest read is that this model is <em>smaller</em> than the one that broke. It holds two promoted preferences and one held signal, it emits 34 tokens into the window, and it collects nothing about Dana that does not change an output. More modeling is not better modeling; it is more to govern, more to keep fresh, and more to be confidently wrong about."],"claudeSays":"Fifty-one observations, two promotions, one held conditional, and one question asked out loud. The batch went out with three flags on every filing.","youDo":"Add an explicit <code>held</code> state between &quot;not observed&quot; and &quot;applied&quot;, and let the user read and edit their own model. A preference nobody can see is a preference nobody can correct.","terminal":[{"kind":"tool","text":"user_model.observe(\"dana.reyes\", \"requested_prose_explanation\",\n                   context=\"ambiguous_collateral\")"},{"kind":"out","text":"verbose_prose            n=1  conf 0.02  -> HELD (needs n>=5 and conf>=0.70)\nmay_want_detail_when_ambiguous  n=1  conf 0.12  -> HELD as conditional\nconcise_json             n=51 conf 0.92 -> promoted, unchanged"},{"kind":"claude","text":"JSON as usual, or do you want the reasoning written out on this one?"},{"kind":"out-pass","text":"60/60 filings scored · 3 flags on every filing · 34 tokens of user layer"}],"state":{"label":"the observation ledger, ruled","before":{"title":"BEFORE — most_recent_wins","view":{"type":"rows","columns":["observation","n","treated as"],"rows":[{"cells":["concise JSON, 47 sessions","47","overwritten"],"tone":"bad"},{"cells":["one prose request","1","a standing trait"],"tone":"bad"}]}},"after":{"title":"AFTER — corroboration, conditionals, decay, and asking","view":{"type":"stack","views":[{"type":"rows","columns":["observation","n","confidence","classification","action"],"rows":[{"cells":["asks for concise JSON","47 / 51","0.92","signal","promoted &mdash; applied every call"],"tone":"win"},{"cells":["raises related-party concerns","31 / 51","0.61","signal","promoted"],"tone":"win"},{"cells":["asked for prose once, on an ambiguous filing","1 / 51","0.02","noise","held &mdash; never applied"],"new":true},{"cells":["…recorded instead as <code>may_want_detail_when_ambiguous</code>","1","0.12","conditional","held; promotes if it repeats"],"new":true},{"cells":["preferred XML output (2024, never since)","6 / 51","0.24","stale","decayed below the floor &mdash; dropped"]},{"cells":["output language","0","&mdash;","unknown","ask, do not assume"]}]},{"type":"note","text":"A preference is a repeated pattern; a single action is a request. Promote on corroboration, hold one-offs as conditionals, decay what stops being confirmed, let the user correct the model directly, and below the confidence floor spend one sentence asking — because the failure mode of user modeling is not being unhelpful, it is being <em>certain</em> about someone who has changed."}]}}}}]},{"id":"ce-positional","badge":"WALKTHROUGH","color":"#b8860b","time":"~4 min","title":"Chunk 20 of 40","spec":"M16 · primacy, recency, and the middle trough","intro":"One disqualifying lien, forty retrieved chunks, and three runs that differ in exactly one respect: where that chunk sits. Same model, same tokens, same question — and the middle placement is the one that comes back clean.","provenance":{"kind":"illustrative","source":"a narrated needle-in-a-haystack probe over UCC chunks; recall rates and token counts are plausible inventions, not measurements"},"foot":"This is M16's positional probe run on one debtor. What to <em>do</em> about the trough is M17's job — this step-through only establishes that it is there.","steps":[{"title":"Forty chunks, and a clean bill of health","narrative":["The risk call for BLUE RIDGE FARMS retrieves forty chunks at about 780 tokens each — 31,200 tokens of filings, judgments and UCC records, ranked by embedding similarity and appended in rank order. Somewhere in there is an undischarged federal tax lien, which disqualifies the debtor outright.","The model reads all of it and answers <code>risk: LOW · no disqualifying liens found</code>. Not a hedge, not a partial — a clean bill of health. The chunk is in the window. It scored 20th on relevance, so it landed 20th in the prompt."],"youDo":"Before you blame retrieval for a miss, grep the assembled prompt for the fact. If it is in there, you have a positional problem, not a retrieval problem.","terminal":[{"kind":"prompt","text":"does BLUE RIDGE FARMS have any disqualifying lien? answer yes/no and name it"},{"kind":"tool","text":"retrieve(debtor=\"BLUE RIDGE FARMS\", k=40)  ->  31,200 tokens, rank order"},{"kind":"claude","text":"No disqualifying liens found. risk: LOW"},{"kind":"tool","text":"grep -c 'undischarged federal tax lien' assembled_prompt.txt"},{"kind":"out-fail","text":"1     # the fact was in the window the whole time"}],"state":{"label":"the assembled call","before":{"title":"WHAT WENT IN","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"40 retrieved chunks","tokens":31200},{"label":"question","tokens":60}],"highlight":["40 retrieved chunks"],"note":"35,560 tokens · 18% of the ceiling. Nothing was truncated, nothing was dropped, and the disqualifying chunk is the 20th of the forty inside the highlighted block."}}}},{"title":"Move one chunk, change the answer","narrative":["Run it again with a single edit: take that same chunk — byte for byte, same 780 tokens — and slide it to position 1. Then run a third time with it at position 40. Nothing else changes. Same forty chunks, same 31,200 tokens, same model, same temperature, same question.","At position 1 the model names the tax lien and scores HIGH. At position 40 it names the tax lien and scores HIGH. At position 20 it reports no disqualifying liens. The model's competence did not vary between runs; only an array index did."],"claudeSays":"The three prompts differ by a list reordering. Two of them produce a decision that would stop a loan, and one produces the opposite.","youDo":"Take a fact your pipeline missed, reinsert it at index 0 with nothing else touched, and re-run. If the answer flips, you have measured your own trough in one command.","terminal":[{"kind":"tool","text":"for pos in (1, 20, 40):\n    probe(needle=TAX_LIEN_CHUNK, haystack=CHUNKS_39, at=pos)"},{"kind":"out-pass","text":"needle at  1/40  ->  FOUND  \"undischarged federal tax lien\"   risk HIGH"},{"kind":"out-fail","text":"needle at 20/40  ->  MISSED  \"no disqualifying liens found\"    risk LOW"},{"kind":"out-pass","text":"needle at 40/40  ->  FOUND  \"undischarged federal tax lien\"   risk HIGH"}],"state":{"label":"identical context, three orderings","before":{"title":"SAME 31,200 TOKENS, THREE PLACEMENTS","view":{"type":"rows","columns":["needle position","input tokens","what came back","decision"],"rows":[{"cells":["1 of 40 &mdash; primacy","31,200","named the tax lien and its filing number","HIGH · declined"],"tone":"win"},{"cells":["<b>20 of 40 &mdash; the middle</b>","31,200","&quot;no disqualifying liens found&quot;","LOW · <b>approved</b>"],"tone":"bad"},{"cells":["40 of 40 &mdash; recency","31,200","named the tax lien and its filing number","HIGH · declined"],"tone":"win"}]}}}},{"title":"The trough, and what deepens it","narrative":["One flip could be luck, so sweep the needle across every decile and repeat each placement fifty times. The result is the U the module describes: near-perfect recall at the two edges, falling to a trough at the halfway mark, recovering toward the end. Position 20 is not an unlucky index — it is the bottom of a curve.","Then run the identical sweep with twelve chunks instead of forty, and the shape changes. At 9,360 tokens the trough is shallow enough to be a rounding error; at 31,200 it is a coin flip. <b>Length does not merely cost money — it makes position matter more.</b> Retrieving more &quot;to be safe&quot; digs the hole you are about to drop the important chunk into."],"youDo":"Run the sweep at two context lengths, not one. The number you need is not &quot;where is my trough&quot; but &quot;how long can my context get before a critical fact stops being reliable&quot;.","terminal":[{"kind":"tool","text":"sweep(needle=TAX_LIEN_CHUNK, deciles=range(0, 101, 10), trials=50, k=40)"},{"kind":"out","text":"  0%  98 |  10%  94 |  25%  71 |  50%  42 |  75%  66 |  90%  92 | 100%  97"},{"kind":"tool","text":"sweep(needle=TAX_LIEN_CHUNK, deciles=range(0, 101, 10), trials=50, k=12)"},{"kind":"out-pass","text":"  0%  99 |  10%  99 |  25%  96 |  50%  88 |  75%  95 | 100%  99   <- shallow trough"}],"state":{"label":"recall vs. position, at two lengths","before":{"title":"40 CHUNKS — 31,200 TOKENS","view":{"type":"bars","unit":"% recall over 50 trials","max":100,"items":[{"label":"position 0%","value":98,"tone":"win","note":"primacy"},{"label":"position 25%","value":71},{"label":"position 50%","value":42,"tone":"bad","note":"worse than a coin flip on a fact that stops a loan"},{"label":"position 75%","value":66},{"label":"position 100%","value":97,"tone":"win","note":"recency"}]}},"after":{"title":"12 CHUNKS — 9,360 TOKENS","view":{"type":"bars","unit":"% recall over 50 trials","max":100,"items":[{"label":"position 0%","value":99,"tone":"win"},{"label":"position 25%","value":96},{"label":"position 50%","value":88,"tone":"win","note":"the same middle, 46 points better — because there is less of it"},{"label":"position 75%","value":95},{"label":"position 100%","value":99,"tone":"win"}]}}}},{"title":"Two edges, forty chunks","narrative":["The obvious conclusion is to put everything important at the edges, and it does not survive contact with the window. There are two edges and forty chunks. Promoting five to the top just pushes five others into the trough, and if every chunk is critical then the honest reading of the curve is that <b>the context is too long for the decision you are making</b>.","So the first lever is length, not order. Rerank forty candidates down to the twelve that could actually bear on the question and the trough goes from 42% to 88% before you have positioned anything at all. The <a href=\"../../ultimate-context-eng/course/index.html\">successor course</a> measures the same direction from the cost side: its cheapest correct strategy answers on a median of 186 input tokens, against 1,696 for sending everything — and a 186-token context has essentially no middle to lose a fact in.","The second point is that these numbers are yours, not the field's. Trough depth moves with the model, the context length and the task, and the probe that produces the curve above is about twenty lines. Measure it on your own stack, at the length you actually ship, and treat &quot;how long before a critical fact becomes unreliable&quot; as a budget you set deliberately."],"claudeSays":"Shortening the context raised recall at the worst position by 46 points. No prompt wording changed.","youDo":"Set a hard cap on retrieved chunks from your own sweep — the length at which mid-context recall is still acceptable — and make the reranker respect it.","terminal":[{"kind":"tool","text":"chunks = rerank(retrieve(debtor, k=40), query, keep=12)"},{"kind":"out","text":"40 -> 12 chunks · 31,200 -> 9,360 tokens · tax-lien chunk now ranks 6th"},{"kind":"out-pass","text":"needle at 6/12  ->  FOUND  \"undischarged federal tax lien\"   risk HIGH"}],"state":{"label":"what the curve licenses","before":{"title":"THE FINDING, AND ITS LIMITS","view":{"type":"rows","columns":["what people take from lost-in-the-middle","holds up?","why"],"rows":[{"cells":["position changes recall on identical context","yes","42% vs 98% on the same 31,200 tokens"],"tone":"win"},{"cells":["longer context deepens the trough","yes","88% at 12 chunks, 42% at 40"],"tone":"win"},{"cells":["so put everything critical at the edges","no","two edges, forty chunks &mdash; promoting one demotes another"],"tone":"bad"},{"cells":["so never use long context","no","shorten what you can; some tasks genuinely need the bulk"],"tone":"bad"},{"cells":["these exact percentages are the field's numbers","no","they move with model, length and task &mdash; run the sweep yourself"],"tone":"bad"}]}},"after":{"title":"WHAT TO CARRY OUT OF M16","view":{"type":"note","text":"Where a fact sits decides whether it is used. Shorten first — a shorter window has less middle to lose things in — then treat position as a second, independent decision on what survives. M17 is where that decision becomes a policy: which block goes at the top, which rides recency, and what belongs in the tolerant middle on purpose."}}}}]},{"id":"ce-ordering","badge":"WALKTHROUGH","color":"#b8860b","time":"~4 min","title":"Sequencing the case","spec":"M17 · what goes where, and why","intro":"M16 established that the middle of a window is where facts go to be ignored. This is the policy that follows from it, applied to one assembled call: which block rides primacy, which rides recency, what belongs in the tolerant middle on purpose — and the ordering that wins one question while losing the next.","provenance":{"kind":"illustrative","source":"a narrated assembly of one UCC related-party call; token counts and hit rates are plausible inventions, not measurements"},"foot":"This follows M17's <em>lawyer presenting a case</em> analogy: open with the framing, build the evidence, and close on the point you want held in mind.","steps":[{"title":"The default is already a positional policy","narrative":["The standard order — system and instructions, then stable reference, then retrieved material, then recent turns, then the question — is not a filing convention. Read it against M16's curve and it is a positioning decision that someone already made for you, correctly.","The framing rules sit at the top, on primacy. The specific ask sits at the bottom, on recency. The two bulky blocks that tolerate a bit of inattention — the state UCC reference and the twelve retrieved chunks — take the middle, which is exactly what the middle is for. If you never think about order again, this default will not embarrass you.","It becomes a problem only in a specific case: when something that <em>must not</em> be missed is inside one of those tolerant blocks. Which is the case this pipeline has."],"youDo":"Print your assembled prompt with a token count per block, in order. If you cannot say which block is riding primacy and which is riding recency, the order is an accident.","terminal":[{"kind":"tool","text":"assemble(question=\"are these 3 debtors related parties?\", order=\"standard\")"},{"kind":"out","text":"1 system + instructions        2,400\n2 tool defs                    1,900\n3 state UCC reference          3,400\n4 retrieved chunks (12)        9,360\n5 recent turns                 1,600\n6 the question                    90   <- last, on purpose"},{"kind":"out","text":"18,750 tokens assembled"}],"state":{"label":"standard order","before":{"title":"TOP OF THE WINDOW → BOTTOM","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system + instructions","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"state UCC reference","tokens":3400},{"label":"retrieved chunks (12)","tokens":9360},{"label":"recent turns","tokens":1600},{"label":"the question","tokens":90}],"highlight":["system + instructions","the question"],"note":"18,750 tokens. Framing on primacy, ask on recency, 14,360 tokens of tolerant bulk in between — the default order gets the two edges right without being asked to."}}}},{"title":"Pull the must-not-miss fact to an edge","narrative":["One of the twelve chunks carries an undischarged federal tax lien, and it ranks 6th on relevance — dead centre. M16's sweep puts mid-context recall at that length around 88%, which is fine for a chunk of background colour and not fine for the single fact that disqualifies a debtor.","The move is not to reorder everything. It is one promotion: lift disqualifying findings out of the retrieved block into a small pinned section immediately above the question, where recency carries them. Eleven chunks stay exactly where they were, and the pinned block costs 780 tokens that were already in the window.","The rule generalises past this pipeline. <b>Anything whose absence changes the decision does not live in the middle</b> — it gets promoted to an edge by class, not by relevance score, because relevance ranking has no idea which facts are load-bearing."],"claudeSays":"The disqualifying chunk is now the last thing before the question. Same twelve chunks, same 18,750 tokens.","youDo":"Give your assembler a <code>pin</code> list keyed on fact <em>class</em> — disqualifiers, hard constraints, safety rules — and place it last. Do not rely on the reranker to notice which facts stop a decision.","terminal":[{"kind":"tool","text":"git diff context/assemble.py"},{"kind":"out","text":"+  pinned = [c for c in chunks if c.klass in MUST_NOT_MISS]\n+  blocks.append(render(pinned, header=\"MUST NOT MISS\"))   # after retrieved, before the ask"},{"kind":"out-pass","text":"related-party question · disqualifying lien named in 50/50 runs (was 44/50)"}],"state":{"label":"one promotion","before":{"title":"BEFORE — disqualifier at rank 6 of 12","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system + instructions","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"state UCC reference","tokens":3400},{"label":"retrieved chunks (12)","tokens":9360},{"label":"recent turns","tokens":1600},{"label":"the question","tokens":90}],"highlight":["retrieved chunks (12)"],"note":"The tax-lien chunk is 6th inside the highlighted block. 88% recall at that position — which is a 12% chance of approving a debtor you must decline."}},"after":{"title":"AFTER — promoted to the tail, on recency","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system + instructions","tokens":2400},{"label":"tool defs","tokens":1900},{"label":"state UCC reference","tokens":3400},{"label":"retrieved chunks (11)","tokens":8580},{"label":"recent turns","tokens":1600},{"label":"MUST NOT MISS — disqualifiers","tokens":780},{"label":"the question","tokens":90}],"highlight":["MUST NOT MISS — disqualifiers"],"note":"18,750 tokens — identical total, one block moved. The promotion is by fact class, not by relevance score, because the ranker cannot tell which fact stops a loan."}}}},{"title":"Group or interleave — the question decides","narrative":["Inside the retrieved block there is a second ordering choice, and it is the one that decides this call. The question is cross-entity: <em>are ACME, SUMMIT and REDLINE the same operation behind three names?</em> The evidence is that three of the twelve filings share a registered address at 1450 NW 107 AVE.","Grouped by debtor — the tidy, obvious order — those three filings land in three separate blocks, roughly 3,000 tokens apart. The model reads three unremarkable debtor histories and reports no relationship. Sorted instead on the shared attribute, the same three filings become adjacent lines, and the pattern is visible without any reasoning at all.","Nothing was added, removed, summarised or reworded. Twelve filings in, twelve filings out. The grouped run says no; the interleaved run names all three entities and cites the address."],"youDo":"Ask what the answer's evidence looks like — one entity's record, or a pattern across entities — and sort the block on that. For cross-entity questions, sort on the relationship attribute, not on the entity.","terminal":[{"kind":"tool","text":"render(filings, order=\"group_by_debtor\")"},{"kind":"out","text":"[ACME LOGISTICS]  FL-0012345 @ 1450 NW 107 AVE\n[ACME LOGISTICS]  FL-0012346 @ 1450 NW 107 AVE\n...\n[REDLINE FREIGHT] FL-0022100 @ 1450 NW 107 AVE      <- ~3,000 tokens away"},{"kind":"out-fail","text":"\"No evidence these debtors are related parties.\""},{"kind":"tool","text":"render(filings, order=\"interleave_by\", key=\"addr\")"},{"kind":"out","text":"[1450 NW 107 AVE] ACME LOGISTICS   FL-0012345\n[1450 NW 107 AVE] REDLINE FREIGHT  FL-0022100\n[1450 NW 107 AVE] SUMMIT HOLDINGS  FL-0019001      <- adjacent"},{"kind":"out-pass","text":"\"Three entities share 1450 NW 107 AVE — likely related parties.\" 3/3 named"}],"state":{"label":"same 12 filings, two sorts","before":{"title":"BEFORE — grouped by debtor, signal scattered","view":{"type":"rows","columns":["block","filings","shared-address lines","distance apart"],"rows":[{"cells":["ACME LOGISTICS","4","2","&mdash;"]},{"cells":["SUMMIT HOLDINGS","4","1","~3,100 tokens from the ACME pair"],"tone":"bad"},{"cells":["REDLINE FREIGHT","4","1","~6,200 tokens from the ACME pair"],"tone":"bad"},{"cells":["<b>verdict</b>","12","3, never adjacent","<b>no relationship found</b>"],"tone":"bad"}]}},"after":{"title":"AFTER — interleaved on the shared attribute","view":{"type":"rows","columns":["block","filings","shared-address lines","distance apart"],"rows":[{"cells":["1450 NW 107 AVE","3","3","consecutive lines"],"tone":"win","new":true},{"cells":["55 BAY RD","2","&mdash;","&mdash;"]},{"cells":["900 PORT BLVD","3","&mdash;","&mdash;"]},{"cells":["other addresses","4","&mdash;","&mdash;"]},{"cells":["<b>verdict</b>","12","3, adjacent","<b>all three entities named, address cited</b>"],"tone":"win"}]}}}},{"title":"The rule, and the question it loses on","narrative":["Run the interleaved assembler against the next question in the queue — <em>list every active lien against ACME</em> — and it loses. Sorting on address scatters ACME's four filings across four separate address blocks, and the model returns two of the four. The grouped order it just beat returns all four.","So interleaving is not an upgrade; it is a match. Cross-entity questions want the relationship attribute as the sort key, per-entity questions want the entity, and applying either one to the other question type buries exactly the signal the task depends on. The selector is small — the discipline is remembering that there is a choice at all, rather than shipping whatever order the retriever returned.","That leaves ordering as what M17 claims it is: a free, independent, testable lever. Free because the tokens are identical either way. Independent because it changes nothing about retrieval, compression or the prompt text. Testable because you can hold the contents fixed, swap the order, and read the difference — which is the only reason anyone should believe the table below."],"claudeSays":"Two questions, two orderings, and each order is wrong for the other question. The contents were the same twelve filings in all four runs.","youDo":"A/B one ordering change on your own eval set this week with contents held fixed. It is the
